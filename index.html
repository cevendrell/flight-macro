async function initGlobe() {
  const cv = el('globe-canvas'), overlay = el('globe-overlay');
  if (!cv) return;
  const gen = nav;
  if (!LAND) {
    try {
      LAND = await fetch(BASE + 'land.json')
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    } catch { LAND = []; }        // a globe without coastlines still turns
  }
  // The coastline fetch is the one await here, and the reader may well have
  // navigated on during it. Starting the draw loop now would leak it.
  if (gen !== nav || !cv.isConnected) return;

  const pts = S.countries.map(c => {
    const m = TAX.countries[c.key];
    return m && m.lat != null
      ? { ...c, lat: m.lat, lng: m.lng } : null;
  }).filter(Boolean);
  const HOME = { lat: S.origin?.lat ?? 56.16, lng: S.origin?.lng ?? 10.20 };
  const maxF = Math.max(...pts.map(p => p.flights), 1);
  const LABELLED = pts.slice(0, 8);

  // rotP is the latitude at the centre of the disc. Aarhus sits at 56°N, so
  // tilting to ~38° puts the antenna and its corridors in the upper half
  // without pushing the southern hemisphere off the back entirely.
  let rotL = -HOME.lng, rotP = 38, spin = true, hot = null;
  let dragging = false, lastX = 0, lastY = 0;

  const css = getComputedStyle(document.documentElement);
  const tok = k => css.getPropertyValue(k).trim();

  const ctx = cv.getContext('2d');
  let R = 0, cx = 0, cy = 0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(w, h) / 2 - 34; cx = w / 2; cy = h / 2;
  }

  /** Orthographic projection. Returns null when the point faces away. */
  function project(lat, lng) {
    const l = (lng + rotL) * Math.PI / 180, p = lat * Math.PI / 180;
    const p0 = rotP * Math.PI / 180;
    const cosc = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l);
    if (cosc < 0) return null;
    return {
      x: cx + R * Math.cos(p) * Math.sin(l),
      y: cy - R * (Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l)),
      z: cosc,
    };
  }

  /** Spherical interpolation, so an arc follows the great circle. */
  function arcPoints(a, b, steps = 48) {
    const toXYZ = (lat, lng) => {
      const p = lat * Math.PI / 180, l = lng * Math.PI / 180;
      return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)];
    };
    const A = toXYZ(a.lat, a.lng), B = toXYZ(b.lat, b.lng);
    const dot = Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]));
    const om = Math.acos(dot);
    const out = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      let v;
      if (om < 1e-6) v = A;
      else {
        const s1 = Math.sin((1 - t) * om) / Math.sin(om), s2 = Math.sin(t * om) / Math.sin(om);
        v = [A[0] * s1 + B[0] * s2, A[1] * s1 + B[1] * s2, A[2] * s1 + B[2] * s2];
      }
      out.push({ lat: Math.asin(v[2]) * 180 / Math.PI,
                 lng: Math.atan2(v[1], v[0]) * 180 / Math.PI });
    }
    return out;
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // Sphere
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = tok('--surface'); ctx.fill();
    ctx.strokeStyle = tok('--rule-2'); ctx.lineWidth = 1; ctx.stroke();

    // Graticule every 30°
    ctx.strokeStyle = tok('--rule'); ctx.lineWidth = 1;
    for (let lat = -60; lat <= 60; lat += 30) {
      ctx.beginPath(); let started = false;
      for (let lng = -180; lng <= 180; lng += 3) {
        const q = project(lat, lng);
        if (!q) { started = false; continue; }
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      ctx.stroke();
    }
    for (let lng = -180; lng < 180; lng += 30) {
      ctx.beginPath(); let started = false;
      for (let lat = -90; lat <= 90; lat += 3) {
        const q = project(lat, lng);
        if (!q) { started = false; continue; }
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      ctx.stroke();
    }

    // Land
    ctx.fillStyle = tok('--sunken'); ctx.strokeStyle = tok('--rule-2'); ctx.lineWidth = .7;
    for (const ring of LAND) {
      ctx.beginPath(); let started = false, any = false;
      for (const [lng, lat] of ring) {
        const q = project(lat, lng);
        if (!q) { started = false; continue; }
        any = true;
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      if (any) { ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }

    // Corridor arcs, faintest first so the busiest sit on top
    const arcs = pts.slice(0, 22);
    for (const p of arcs) {
      const isHot = hot === p.key;
      ctx.beginPath(); let started = false;
      for (const s of arcPoints(p, HOME)) {
        const q = project(s.lat, s.lng);
        if (!q) { started = false; continue; }
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      ctx.strokeStyle = tok('--accent');
      ctx.globalAlpha = isHot ? .95 : .13 + .3 * (p.flights / maxF);
      ctx.lineWidth = isHot ? 2 : 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Country markers
    for (const p of pts) {
      const q = project(p.lat, p.lng);
      if (!q) continue;
      const r = 2.5 + 9 * Math.sqrt(p.flights / maxF);
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fillStyle = tok('--accent');
      ctx.globalAlpha = hot === p.key ? 1 : .28 + .6 * q.z;
      ctx.fill();
      if (hot === p.key) {
        ctx.globalAlpha = 1; ctx.lineWidth = 2;
        ctx.strokeStyle = tok('--ink'); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // The antenna
    const hq = project(HOME.lat, HOME.lng);
    if (hq) {
      ctx.beginPath(); ctx.arc(hq.x, hq.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = tok('--fall'); ctx.fill();
      ctx.beginPath(); ctx.arc(hq.x, hq.y, 11, 0, Math.PI * 2);
      ctx.strokeStyle = tok('--fall'); ctx.globalAlpha = .45; ctx.lineWidth = 1.5;
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    positionLabels();
  }

  // Overlay labels are real DOM so they stay crisp, clickable and accessible.
  const labelEls = new Map();
  overlay.innerHTML = '';
  for (const p of LABELLED) {
    const a = document.createElement('a');
    a.className = 'gl-label';
    a.href = `#/place/${p.key}`;
    a.innerHTML = `${esc(p.name)} <b>${n(p.flights)}</b>`;
    a.addEventListener('pointerenter', () => { hot = p.key; syncList(); });
    a.addEventListener('pointerleave', () => { hot = null; syncList(); });
    overlay.appendChild(a);
    labelEls.set(p.key, a);
  }
  /* Europe is dense: at this scale half a dozen countries land within a few
     pixels of each other. Place labels greedily by traffic and drop any that
     would collide with one already placed, so the busiest always wins and the
     overlay never turns into a pile. */
  function positionLabels() {
    const placed = [];
    for (const p of LABELLED) {
      const a = labelEls.get(p.key), q = project(p.lat, p.lng);
      if (!q || q.z < 0.18) { a.style.display = 'none'; continue; }

      const w = a.offsetWidth || 76, h = a.offsetHeight || 22;
      const x = q.x, y = q.y - 15 - 9 * Math.sqrt(p.flights / maxF);
      const box = { l: x - w / 2, r: x + w / 2, t: y - h / 2, b: y + h / 2 };
      const clash = hot !== p.key && placed.some(o =>
        box.l < o.r + 4 && box.r > o.l - 4 && box.t < o.b + 4 && box.b > o.t - 4);
      if (clash) { a.style.display = 'none'; continue; }

      placed.push(box);
      a.style.display = '';
      a.style.left = x + 'px';
      a.style.top  = y + 'px';
      a.style.opacity = Math.min(1, (q.z - 0.18) * 4);
      a.classList.toggle('hot', hot === p.key);
    }
  }
  function syncList() {
    document.querySelectorAll('.gl-item').forEach(x =>
      x.classList.toggle('hot', x.dataset.cc === hot));
  }

  // Hovering the ranked list turns the globe to that country.
  document.querySelectorAll('.gl-item').forEach(item => {
    item.addEventListener('pointerenter', () => {
      hot = item.dataset.cc;
      const p = pts.find(x => x.key === hot);
      if (p) { targetL = -p.lng; targetP = Math.max(-55, Math.min(60, p.lat * .8)); turning = true; }
      syncList();
    });
    item.addEventListener('pointerleave', () => { hot = null; turning = false; syncList(); });
  });

  let targetL = rotL, targetP = rotP, turning = false;

  cv.addEventListener('pointerdown', e => {
    dragging = true; spin = false; turning = false;
    lastX = e.clientX; lastY = e.clientY;
    cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    rotL += (e.clientX - lastX) * 0.32;
    rotP = Math.max(-80, Math.min(80, rotP - (e.clientY - lastY) * 0.32));
    lastX = e.clientX; lastY = e.clientY;
  });
  const endDrag = () => { dragging = false; cv.classList.remove('dragging');
                          setTimeout(() => { if (!dragging) spin = true; }, 2200); };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf;
  function frame() {
    if (turning) {
      let d = ((targetL - rotL + 540) % 360) - 180;
      rotL += d * 0.12; rotP += (targetP - rotP) * 0.12;
    } else if (spin && !reduce) {
      rotL -= 0.085;
    }
    draw();
    raf = requestAnimationFrame(frame);
  }
  const ro = new ResizeObserver(() => { resize(); draw(); });
  ro.observe(cv);
  resize(); frame();

  globeStop = () => { cancelAnimationFrame(raf); ro.disconnect(); globeStop = null; };
}

/* ── Entity pages ────────────────────────────────────────────────────── */
function entityShell({ crumbs, title, lede, stats, body }) {
  return `<header class="page-head">
    <div class="crumbs">${crumbs}</div>
    <h1>${title}</h1>
    ${lede ? `<p class="lede">${lede}</p>` : ''}
  </header>
  ${stats ? `<section>${stats}</section>` : ''}
  ${body}`;
}

function viewPlace(cc) {
  const c = S.countries.find(x => x.key === cc);
  if (!c) return notFound(`No aircraft registered in ${esc(countryName(cc))} have been recorded yet.`);
  const share = (c.flights / S.totals.flights * 100).toFixed(1);
  const wbShare = c.flights ? (c.widebody / c.flights * 100).toFixed(0) : 0;
  const isFar = c.continent && c.continent !== 'Europe';

  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em>
             <a href="#/continent/${encodeURIComponent(c.continent)}">${esc(c.continent)}</a> <em>/</em>
             <a href="#/region/${encodeURIComponent(c.region)}">${esc(c.region)}</a> <em>/</em> ${esc(c.name)}`,
    title: `${esc(c.name)}`,
    lede: isFar
      ? `${esc(c.name)} has no scheduled service to Aarhus. Everything below is aircraft at
         cruise altitude on intercontinental routings, passing through this antenna's range.`
      : `Aircraft registered in ${esc(c.name)}, as recorded passing over Aarhus.`,
    stats: readout([
      { v: fig(c.flights),  l: 'Flights', s: `${share}% of all traffic` },
      { v: fig(c.aircraft), l: 'Distinct aircraft' },
      { v: fig(c.widebody), l: 'Wide-body', s: `${wbShare}% of its traffic` },
      { v: c.change_pct == null ? '—' : pct(c.change_pct), l: 'Change vs prev. 24h',
        s: c.change_pct == null ? 'baseline too short' : null },
    ]),
    body: evidence('place', cc, `Every ${esc(c.name)} flight on record`,
        `SELECT callsign, ac_type, ac_desc, reg, seen_at, airline\nFROM flights\nWHERE reg_country = '${cc}'\nORDER BY first_seen DESC;`,
        `ovrhead-flights-${cc}`) + `
      <section>
        <div class="sec-head"><div><div class="eyebrow">Context</div>
          <h2>How ${esc(c.name)} compares in ${esc(c.region)}</h2></div></div>
        ${table(S.countries.filter(x => x.region === c.region), COUNTRY_COLS,
          { id: 'pl-c', max: 20, sortKey: 'flights', sortDir: -1, csv: false })}
      </section>`,
  });
}

/** The evidence half of an entity page. All three entity pages get the same
 *  two sections — a shape, then the rows it was computed from — so they can't
 *  drift apart, and both are filled by one trip to DuckDB. */
function evidence(kind, arg, heading, sql, csvName) {
  return `
  <section>
    <div class="sec-head"><div><div class="eyebrow">Rhythm</div>
      <h2>When it passes over</h2></div>
      <p class="sec-note">Counted in your browser from the same rows as the table below.</p></div>
    <div id="lazy-rhythm"><div class="status">Waiting on the query engine…</div></div>
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Evidence</div>
      <h2>${heading}</h2></div>
      <a class="btn" href="#/ask?sql=${encodeURIComponent(sql)}">Open in Ask →</a></div>
    <div id="lazy" data-kind="${esc(kind)}" data-arg="${esc(arg)}"
         data-csv-name="${esc(csvName)}">
      <span class="sr" role="status">Loading the flight table…</span>
      ${skeleton(7)}</div>
  </section>`;
}

function viewGroup(kind, name) {
  const list = kind === 'region' ? S.regions : S.continents;
  const g = list.find(x => x.key === name);
  if (!g) return notFound(`Nothing recorded for ${esc(name)} yet.`);
  const kids = S.countries.filter(c => (kind === 'region' ? c.region : c.continent) === name);
  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em> ${esc(name)}`,
    title: esc(name),
    lede: `${kids.length} registration countries, aggregated.`,
    stats: readout([
      { v: fig(g.flights), l: 'Flights', s: `${g.share}% of all traffic` },
      { v: fig(kids.length), l: 'Countries' },
      { v: fig(g.aircraft), l: 'Distinct aircraft' },
      { v: g.change_pct == null ? '—' : pct(g.change_pct), l: 'Change vs prev. 24h',
        s: g.change_pct == null ? 'baseline too short' : `${n(g.widebody)} wide-body` },
    ]),
    body: `<section>
      <div class="sec-head"><div><div class="eyebrow">Breakdown</div>
        <h2>Countries in ${esc(name)}</h2></div></div>
      ${table(kids, COUNTRY_COLS, { id: 'grp', max: 60, sortKey: 'flights', sortDir: -1 })}
    </section>`,
  });
}

function viewKind(key) {
  const k = S.week?.kinds.find(x => x.key === key);
  const meta = CAR?.kinds?.[key];
  if (!k || !meta) return notFound(`No such kind of flying: ${esc(key)}.`);
  const members = Object.entries(CAR.carriers)
    .filter(([, v]) => v.kind === key)
    .map(([p, v]) => ({ key: p, name: v.name, country: v.country }));
  const seen = new Set(S.operators.map(o => o.key));

  return entityShell({
    crumbs: `<a href="#/week">Week</a> <em>/</em> ${esc(meta.label)}`,
    title: esc(meta.label),
    lede: `${esc(meta.reads)} ${k.lift_pct >= 0
      ? `Over the week of ${niceDate(S.week.from)} this ran ${k.lift_pct}% heavier on weekdays than at the weekend.`
      : `Over the week of ${niceDate(S.week.from)} this ran ${Math.abs(k.lift_pct)}% heavier at the weekend than on weekdays.`}`,
    stats: readout([
      { v: fig(k.flights), l: 'Flights in the week' },
      { v: fig(Math.round(k.weekday_per_day)), l: 'On an average weekday' },
      { v: fig(Math.round(k.weekend_per_day)), l: 'On an average weekend day' },
      { v: fig(k.widebody), l: 'Wide-body',
        s: k.flights ? `${(k.widebody / k.flights * 100).toFixed(0)}% of its flights` : null },
    ]),
    body: `
      <section>
        <div class="sec-head"><div><div class="eyebrow">Who is in it</div>
          <h2>${n(members.length)} operators classified as ${esc(meta.label.toLowerCase())}</h2></div>
          <p class="sec-note">Seen over Aarhus, or listed and not yet seen.</p></div>
        ${table(members, [
          { k: 'key', h: 'Code', render: r => `<a href="#/operator/${esc(r.key)}" class="code">${esc(r.key)}</a>` },
          { k: 'name', h: 'Operator' },
          { k: 'country', h: 'Home', render: r => esc(countryName(r.country)) },
          { k: 'key', h: 'On record', render: r => seen.has(r.key)
              ? '<span class="dim">seen</span>' : '<span class="unknown">not yet seen</span>' },
        ], { id: 'kind-m', max: 60, csvName: `ovrhead-${key}` })}
      </section>` +
      evidence('kind', key, `Every ${esc(meta.label.toLowerCase())} flight on record`,
        `SELECT callsign, operator, ac_desc, reg_country_name, seen_at\nFROM flights\nWHERE carrier_kind = '${key}'\nORDER BY first_seen DESC;`,
        `ovrhead-flights-${key}`),
  });
}

function viewOperator(code) {
  const o = S.operators.find(x => x.key === code);
  if (!o) return notFound(`No flights recorded for operator ${esc(code)}.`);
  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em> Operators <em>/</em> ${esc(code)}`,
    title: o.name ? esc(o.name) : `Operator ${esc(code)}`,
    lede: o.name
      ? `ICAO code ${esc(code)}.${o.kind
          ? ` Classified as <a href="#/kind/${esc(o.kind)}">${
              esc((CAR?.kinds?.[o.kind]?.label || o.kind).toLowerCase())}</a> — ${
              esc(CAR?.kinds?.[o.kind]?.reads || '')}`
          : ''}`
      : `We see the ICAO prefix ${esc(code)} on these flights but it is not in our carrier
         table yet, so we can neither name the operator nor say what kind of flying this
         is. The flights themselves are real.`,
    stats: readout([
      { v: fig(o.flights), l: 'Flights', s: `${o.share}% of all traffic` },
      { v: fig(o.aircraft), l: 'Distinct aircraft' },
      { v: fig(o.widebody), l: 'Wide-body' },
      { v: o.change_pct == null ? '—' : pct(o.change_pct), l: 'Change vs prev. 24h' },
    ]),
    body: evidence('operator', code, 'Flights recorded',
      `SELECT callsign, ac_type, reg, reg_country_name, seen_at\nFROM flights\nWHERE airline_prefix = '${code}'\nORDER BY first_seen DESC;`,
      `ovrhead-flights-${code}`),
  });
}

function viewType(code) {
  const t = S.types.find(x => x.key === code);
  if (!t) return notFound(`No flights recorded for aircraft type ${esc(code)}.`);
  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em> Types <em>/</em> ${esc(code)}`,
    title: esc(t.desc || code),
    lede: `ICAO type code ${esc(code)} · ${t.widebody_type ? 'wide-body' : 'narrow-body'} airframe.
           ${t.widebody_type ? 'Wide-bodies over Aarhus are almost always intercontinental routings at cruise.' : ''}`,
    stats: readout([
      { v: fig(t.flights), l: 'Flights', s: `${t.share}% of all traffic` },
      { v: fig(t.aircraft), l: 'Distinct airframes' },
      { v: t.change_pct == null ? '—' : pct(t.change_pct), l: 'Change vs prev. 24h' },
    ]),
    body: evidence('type', code, 'Flights recorded',
      `SELECT callsign, reg, reg_country_name, airline, seen_at\nFROM flights\nWHERE ac_type = '${code}'\nORDER BY first_seen DESC;`,
      `ovrhead-flights-${code}`),
  });
}

const notFound = msg => `<header class="page-head">
  <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Not found</div>
  <h1>Nothing here yet</h1><p class="lede">${msg}</p></header>
  <a class="btn" href="#/explore">Browse what we do have →</a>`;

/** Entity pages paint instantly from the summary, then fill their evidence
 *  from DuckDB once it is up. The reader has usually navigated on by the time
 *  a cold engine finishes, so every await is followed by a generation check. */
async function fillLazy() {
  const host = el('lazy'), shape = el('lazy-rhythm');
  if (!host) return;
  const gen = nav;
  const { kind, arg, csvName } = host.dataset;
  const where = { place: `reg_country = ${q(arg)}`,
                  operator: `airline_prefix = ${q(arg)}`,
                  kind: `carrier_kind = ${q(arg)}`,
                  type: `ac_type = ${q(arg)}` }[kind];
  if (shape) engineNote(shape);
  try {
    await getDeep();
    if (gen !== nav) return;

    const [flights, byDay, byHour] = await Promise.all([
      query(`SELECT callsign, ac_type, ac_desc, reg, reg_country_name, operator,
                    carrier_kind, airline_prefix, seen_at,
                    ROUND(duration_sec/60.0) AS mins
             FROM flights WHERE ${where} ORDER BY first_seen DESC LIMIT 300`),
      query(`SELECT strftime(seen_at, '%Y-%m-%d') AS day, COUNT(*) AS flights
             FROM flights WHERE ${where} GROUP BY 1`),
      query(`SELECT CAST(strftime(seen_at, '%H') AS INTEGER) AS hour, COUNT(*) AS flights
             FROM flights WHERE ${where} GROUP BY 1`),
    ]);
    if (gen !== nav) return;

    host.innerHTML = table(flights.rows, FLIGHT_COLS,
      { id: 'lz', max: 60, sortKey: 'seen_at', sortDir: -1,
        filter: 'Filter these flights…', csvName });
    animateIn(host);

    if (shape) {
      // Zero-fill from the site's own calendar so a quiet day reads as quiet
      // rather than as a gap, and keeps the partial-day hatching.
      const dayN = new Map(byDay.rows.map(r => [String(r.day), Number(r.flights)]));
      const days = S.daily.map(d =>
        ({ day: d.day, flights: dayN.get(d.day) || 0, partial: d.partial }));
      const hourN = new Map(byHour.rows.map(r => [Number(r.hour), Number(r.flights)]));
      const hours = Array.from({ length: 24 }, (_, h) =>
        ({ hour: String(h).padStart(2, '0'), flights: hourN.get(h) || 0 }));
      shape.innerHTML = `<div class="rhythm">
        <div><div class="rhythm-t">By day</div>
          ${chart(days, { key: 'day', val: 'flights', partial: 'partial' })}</div>
        <div><div class="rhythm-t">By hour, UTC — all days combined</div>
          ${chart(hours, { key: 'hour', val: 'flights', labelEvery: 3 })}</div>
      </div>`;
      animateIn(shape);
    }
  } catch (e) {
    if (gen !== nav) return;
    const msg = `<div class="notice warn">Could not read the flight record: ${esc(e.message)}</div>`;
    host.innerHTML = msg;
    if (shape) shape.innerHTML = '';
  }
}

const FLIGHT_COLS = [

function wireAsk() {
  const ta = el('sql'), out = el('qout'), st = el('qstatus');
  if (!ta) return;
  const ctl = { m: el('c-measure'), d: el('c-dim'), f: el('c-filter'), w: el('c-win') };

  function compose() {
    const m = MEASURES[ctl.m.value], d = DIMS[ctl.d.value];
    const f = FILTERS[ctl.f.value], w = WINDOWS[ctl.w.value];
    const conds = [`${d.sql} IS NOT NULL`];
    if (f.sql) conds.push(f.sql);
    if (w.hours) conds.push(
      `first_seen >= (SELECT MAX(first_seen) FROM flights) - ${w.hours * 3600}`);
    const ordering = d.order || 'ORDER BY 2 DESC';
    return `SELECT ${d.sql} AS "${d.head}",\n       ${m.sql} AS "${m.label.replace(/^How many /, '')}"\n`
         + `FROM flights\nWHERE ${conds.join('\n  AND ')}\nGROUP BY 1\n${ordering};`;
  }

  async function run(sql) {
    sql = (sql || ta.value).trim();
    if (!sql) return;
    ta.value = sql;
    const gen = nav;
    if (deep) st.textContent = 'Working…';
    else engineNote(st);              // a cold start deserves a running account
    try {
      // Warm the engine before starting the clock. The first call pays for
      // downloading and instantiating DuckDB, which is not what the reader is
      // being told the query cost.
      await getDeep();
      if (gen !== nav) return;
      const t0 = performance.now();
      const { rows, cols } = await query(sql);
      if (gen !== nav) return;
      const ms = Math.round(performance.now() - t0);
      st.innerHTML = rows.length
        ? `<b>${n(rows.length)}</b> ${rows.length === 1 ? 'row' : 'rows'} · answered in ${ms} ms, in your browser`
        : '';
      out.innerHTML = rows.length ? renderResult(rows, cols)
        : `<div class="empty">Nothing in the record matches that.</div>`;
      animateIn(out);
    } catch (e) {
      if (gen !== nav) return;
      st.textContent = '';
      out.innerHTML = `<div class="notice warn"><b>That didn't run.</b> ${esc(e.message)}</div>`;
      el('adv').open = true;   // the SQL is where the problem is, so show it
    }
  }
  const runComposed = () => run(compose());

  Object.values(ctl).forEach(s => s.addEventListener('change', runComposed));

  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
    const p = PRESETS[+b.dataset.ex][1];
    ctl.m.value = p.m; ctl.d.value = p.d; ctl.f.value = p.f; ctl.w.value = p.w;
    runComposed();
  });

  el('run').onclick = () => run();
  const flash = (b, text, back) => {
    b.textContent = text; setTimeout(() => { b.textContent = back; }, 1800);
  };
  el('copy-sql').onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); flash(el('copy-sql'), 'Copied', 'Copy SQL'); }
    catch { flash(el('copy-sql'), 'Select and copy', 'Copy SQL'); }
  };
  el('link-sql').onclick = async () => {
    // Any query is a shareable address — that is how a signal hands its
    // evidence over, and it should work the other way too.
    const url = new URL(location.href);
    url.hash = '#/ask?sql=' + encodeURIComponent(ta.value.trim());
    try { await navigator.clipboard.writeText(url.href); flash(el('link-sql'), 'Link copied', 'Copy link to this query'); }
    catch { history.replaceState(null, '', url.href);
            flash(el('link-sql'), 'Link is in the address bar', 'Copy link to this query'); }
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
  });

  // A "reproduce this" link from a signal arrives with its own SQL.
  const linked = new URLSearchParams(location.hash.split('?')[1] || '').get('sql');
  if (linked) { el('adv').open = true; run(linked); }
  else runComposed();
}

/** Result rendering picks a chart when the shape is label + one number. The
 *  chart keeps the query's own ordering; the table below it can be re-sorted,
 *  filtered and exported like any other on the site. */
function renderResult(rows, cols) {
  let chartHtml = '';
  if (cols.length >= 2 && rows.length > 1 && rows.length <= 60) {
    const numCol = cols.slice(1).find(c => typeof rows[0][c] === 'number' || typeof rows[0][c] === 'bigint');
    if (numCol) {
      const data = rows.map(r => ({ k: String(r[cols[0]]), v: Number(r[numCol]) }));
      chartHtml = `<div style="margin-bottom:22px">${
        chart(data, { key: 'k', val: 'v', labelEvery: Math.ceil(data.length / 14) })}</div>`;
    }
  }
  const isNum = c => rows.some(r => typeof r[c] === 'number' || typeof r[c] === 'bigint');
  // Only reformat genuine temporal values. A strftime() result is already a
  // formatted string and must be left exactly as the query produced it.
  const isTime = (c, v) => v instanceof Date || (looksLikeTime(c) && typeof v !== 'string');
  const tcols = cols.map(c => ({
    k: c, h: c, num: isNum(c),
    csvValue: r => (r[c] != null && isTime(c, r[c])) ? ts(r[c]) : r[c],
    render: r => {
      const v = r[c];
      if (v == null) return `<span class="faint">—</span>`;
      if (isTime(c, v)) return `<span class="mono">${esc(ts(v))}</span>`;
      return (typeof v === 'number' || typeof v === 'bigint')
        ? n(v) : esc(String(v).slice(0, 80));
    },
  }));
  // The SQL said what order it wanted, so a fresh result arrives in that order.
  delete tblState.ask;
  return chartHtml + table(rows, tcols,
    { id: 'ask', max: 200, filter: 'Filter these rows…', csvName: 'ovrhead-query' });
}

      <li><b>${n(t.unresolved_country)} flights sit outside any allocated address block.</b></li>
      <li><b>The record is ${w.days_observed} days long</b>, ${w.complete_days} of them
      complete — which is why nothing here is presented as a trend yet.</li>
    </ul>

    <h3>Confidence</h3>
    <ul>
      <li><b>Observed</b> — a direct count, no inference.</li>
      <li><b>Early</b> — real, but too short a record to separate from noise.</li>
      <li><b>Moderate</b> — enough history and volume to be worth attention.</li>
      <li><b>Strong</b> — large, consistent, well sampled. Nothing qualifies yet.</li>
    </ul>

    <h3>What we're blind to</h3>
    <p>We see one point in Jutland. Scandinavia–Europe and Europe–Asia routings are
    over-represented; anything routed around Denmark is invisible. Absence here is not
    absence in the sky. Rather than ask you to take that on trust, the figure below is
    the receiver's actual footprint, drawn from where each aircraft was standing when
    we first heard it.</p>
  </section>

  <section>
    <div class="sec-head">
      <div><div class="eyebrow">Coverage</div><h2>What this antenna can hear</h2></div>
      <p class="sec-note">Every first contact plotted by true bearing and ground
        distance from the receiver.</p>
    </div>
    <div id="cov-stats">
      <div class="engine-rest">
        <span>Drawn from the full flight record — a few megabytes of query engine,
          fetched only if you want the figure.</span>
        <button class="btn primary" id="cov-go">Draw it</button>
      </div>
    </div>
    <div id="cov-stage">
      <canvas id="cov-canvas"></canvas>
    </div>
    <div class="globe-legend">
      <span><i class="home"></i>The receiver</span>
      <span><i class="dot"></i>First contact with an aircraft</span>
      <span><i class="env"></i>Reception envelope — 95th percentile range per bearing</span>
    </div>
    <p class="sec-note" id="cov-note" style="margin:16px auto 0;max-width:var(--measure)">
      The shape is set by terrain, antenna siting and how high the aircraft was flying,
      not by where the traffic is. A direction that reaches less far here is a direction
      we are deaf in — not a quiet one.</p>
  </section>`;
}

/* ── Coverage plot ───────────────────────────────────────────────────────
   Azimuthal equidistant, centred on the receiver: distance from the middle of
   the figure is true ground distance in every direction, so the range rings
   are real circles and the envelope is the honest shape of what we hear.
   The site's own coastline file is far too coarse at this scale to draw under
   it, and a wrong coastline would be worse than none. */
let covStop = null;

function initCoverage() {
  // The plot needs the full flight record, and the Method page is mostly prose.
  // Wait until the figure is actually approaching the viewport before spending
  // several megabytes of query engine on somebody who came here to read — but
  // leave a button as well, so it is never a figure that mysteriously refuses
  // to appear.
  const stage = el('cov-stage');
  if (!stage) return;
  let started = false;
  const go = () => { if (!started) { started = true; drawCoverage(); } };
  el('cov-go').onclick = go;
  if (deep) return go();                       // engine already warm — no cost to pay
  if (!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver(entries => {
    if (!entries.some(e => e.isIntersecting)) return;
    io.disconnect();
    go();
  }, { rootMargin: '300px' });
  io.observe(stage);
  covStop = () => { io.disconnect(); covStop = null; };
}

async function drawCoverage() {
  const cv = el('cov-canvas'), stats = el('cov-stats');
  if (!cv) return;
  const gen = nav;
  engineNote(stats);
  let rows;
  try {
    await getDeep();
    if (gen !== nav) return;
    ({ rows } = await query(`
      SELECT first_lat AS lat, first_lon AS lon
      FROM flights WHERE first_lat IS NOT NULL AND first_lon IS NOT NULL`));
  } catch (e) {
    if (gen !== nav) return;
    stats.innerHTML = `<div class="notice warn">Could not read positions: ${esc(e.message)}</div>`;
    return;
  }
  if (gen !== nav || !cv.isConnected) return;

  const HOME = { lat: S.origin?.lat ?? 56.16, lng: S.origin?.lng ?? 10.20 };
  const rad = d => d * Math.PI / 180;
  const φ0 = rad(HOME.lat);
  const pts = [];
  for (const r of rows) {
    const φ = rad(Number(r.lat)), Δλ = rad(Number(r.lon) - HOME.lng);
    const cosd = Math.sin(φ0) * Math.sin(φ) + Math.cos(φ0) * Math.cos(φ) * Math.cos(Δλ);
    const km = Math.acos(Math.max(-1, Math.min(1, cosd))) * 6371;
    const brg = Math.atan2(Math.sin(Δλ) * Math.cos(φ),
                           Math.cos(φ0) * Math.sin(φ) - Math.sin(φ0) * Math.cos(φ) * Math.cos(Δλ));
    if (Number.isFinite(km)) pts.push({ km, brg });
  }
  if (!pts.length) { stats.innerHTML = ''; return; }

  const sorted = [...pts].map(p => p.km).sort((a, b) => a - b);
  const at = f => sorted[Math.min(sorted.length - 1, Math.floor(f * sorted.length))];
  const p50 = at(.5), p95 = at(.95), far = sorted[sorted.length - 1];

  // Envelope: the 95th percentile range in each 5° sector. A single freak
  // contact should not inflate the shape, and the median would understate it.
  const SECTORS = 72;
  const buckets = Array.from({ length: SECTORS }, () => []);
  for (const p of pts) {
    let i = Math.floor(((p.brg + 2 * Math.PI) % (2 * Math.PI)) / (2 * Math.PI) * SECTORS);
    buckets[i % SECTORS].push(p.km);
  }
  const env = buckets.map(b => {
    if (b.length < 4) return null;         // too few contacts to claim a reach
    b.sort((x, y) => x - y);
    return b[Math.floor(0.95 * b.length)];
  });

  const scale = Math.ceil(Math.max(p95 * 1.25, 120) / 50) * 50;   // outer ring, km
  const rings = [scale / 4, scale / 2, scale * 3 / 4, scale].map(v => Math.round(v));

  const km = v => `${fig(Math.round(v))}<span class="u">km</span>`;
  stats.innerHTML = readout([
    { v: km(p50), txt: false, l: 'Median first-contact range' },
    { v: km(p95), txt: false, l: '95% of contacts within' },
    { v: km(far), txt: false, l: 'Furthest contact on record' },
    { v: fig(pts.length), l: 'Positions plotted',
      s: `${(pts.length / S.totals.flights * 100).toFixed(0)}% of flights report one` },
  ]);
  animateIn(stats);

  const beyond = pts.filter(p => p.km > scale).length;
  const note = el('cov-note');
  if (note && beyond) note.insertAdjacentHTML('afterbegin',
    `The frame stops at ${scale} km, which leaves ${n(beyond)} more distant
     contact${beyond === 1 ? '' : 's'} (${(beyond / pts.length * 100).toFixed(1)}%)
     outside it — the furthest at ${n(Math.round(far))} km. `);

  const ctx = cv.getContext('2d');
  const css = getComputedStyle(document.documentElement);
  const tok = k => css.getPropertyValue(k).trim();
  let R = 0, cx = 0, cy = 0;

  function draw(rev = 1) {
    const w = cv.clientWidth, h = cv.clientHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    if (cv.width !== w * dpr || cv.height !== h * dpr) {
      cv.width = w * dpr; cv.height = h * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    R = Math.min(w, h) / 2 - 26; cx = w / 2; cy = h / 2;
    const xy = (km, brg) => [cx + R * (km / scale) * Math.sin(brg),
                             cy - R * (km / scale) * Math.cos(brg)];

    ctx.font = `500 10px ${tok('--mono') || 'monospace'}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    for (const km of rings) {
      const r = R * (km / scale);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = tok('--rule-2'); ctx.lineWidth = 1;
      ctx.setLineDash(km === scale ? [] : [2, 4]); ctx.stroke(); ctx.setLineDash([]);
      // Sat on the vertical, these collided with the N spoke and its label.
      const [lx, ly] = xy(km, rad(22));
      const label = `${km} km`, tw = ctx.measureText(label).width + 8;
      ctx.fillStyle = tok('--bg'); ctx.fillRect(lx - tw / 2, ly - 6, tw, 12);
      ctx.fillStyle = tok('--mute'); ctx.fillText(label, lx, ly);
    }
    for (let b = 0; b < 360; b += 45) {
      const [x, y] = xy(scale, rad(b));
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y);
      ctx.strokeStyle = tok('--rule'); ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.fillStyle = tok('--mute');
    for (const [b, t] of [[0, 'N'], [90, 'E'], [180, 'S'], [270, 'W']]) {
      const [x, y] = xy(scale * 1.09, rad(b));
      ctx.fillText(t, x, y);
    }

    // Contacts and envelope appear behind a sweep, the way the receiver found
    // them: one bearing at a time, all the way round. It runs once.
    const TAU = Math.PI * 2;
    const swept = rev * TAU;
    const reached = brg => rev >= 1 || ((brg % TAU) + TAU) % TAU <= swept;

    ctx.fillStyle = tok('--accent');
    ctx.globalAlpha = pts.length > 4000 ? .13 : .22;
    for (const p of pts) {
      if (p.km > scale || !reached(p.brg)) continue;
      const [x, y] = xy(p.km, p.brg);
      ctx.fillRect(x - .9, y - .9, 1.8, 1.8);
    }
    ctx.globalAlpha = 1;

    ctx.beginPath();
    let started = false;
    for (let i = 0; i <= SECTORS; i++) {
      const v = env[i % SECTORS];
      const a = (i % SECTORS) / SECTORS * TAU;
      if (v == null || !reached(a)) { started = false; continue; }
      const [x, y] = xy(Math.min(v, scale), a);
      started ? ctx.lineTo(x, y) : (ctx.moveTo(x, y), started = true);
    }
    ctx.strokeStyle = tok('--ink');
    ctx.lineWidth = 1.6; ctx.stroke();

    if (rev < 1) {
      const trail = Math.PI / 3;      // how far the wedge lags the leading edge
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, R, swept - trail - Math.PI / 2, swept - Math.PI / 2);
      ctx.closePath();
      ctx.fillStyle = tok('--accent'); ctx.globalAlpha = .07; ctx.fill();
      ctx.globalAlpha = 1;
      const [ex, ey] = xy(scale, swept);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey);
      ctx.strokeStyle = tok('--accent'); ctx.lineWidth = 1.2;
      ctx.globalAlpha = .5; ctx.stroke(); ctx.globalAlpha = 1;
    }

    ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fillStyle = tok('--fall'); ctx.fill();
  }

  const ro = new ResizeObserver(() => draw(1));
  ro.observe(cv);

  if (still() || !('requestAnimationFrame' in window)) {
    draw(1);
    covStop = () => { ro.disconnect(); covStop = null; };
    return;
  }
  const t0 = performance.now(), span = 1150;
  let raf = requestAnimationFrame(function frame(now) {
    const p = Math.min(1, (now - t0) / span);
    draw(p * p * (3 - 2 * p));            // smoothstep, so it settles rather than stops
    if (p < 1) raf = requestAnimationFrame(frame);
  });
  covStop = () => { cancelAnimationFrame(raf); ro.disconnect(); covStop = null; };
}

/* ── The week ────────────────────────────────────────────────────────────
   The first page on this site that is about the economy rather than about the
   antenna, and the reason the carrier taxonomy exists. It only appears once
   seven consecutive complete days are on record; until then it says so. */
const DOWS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const niceDate = d => new Date(d + 'T00:00:00Z')
  .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', timeZone: 'UTC' });

/** Seven bars, weekend shaded differently, peak in accent. */
function spark(values, dows) {
  const max = values.reduce((m, v) => Math.max(m, v), 1);
  const peak = Math.max(...values);
  return `<div class="spark">${values.map((v, i) => `
    <i class="${dows[i] === 'Sat' || dows[i] === 'Sun' ? 'we' : ''} ${
      v === peak ? 'hi' : ''}" style="height:${(v / max * 100).toFixed(1)}%"
      title="${esc(dows[i])} — ${n(v)}"></i>`).join('')}</div>
    <div class="wk-dow">${dows.map(d => `<span>${esc(d[0])}</span>`).join('')}</div>`;
}

function viewWeek() {
  const w = S.week;
  if (!w) {
    const have = S.window.complete_days;
    return `<header class="page-head">
      <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Week</div>
      <h1>Not a week yet</h1>
      <p class="lede">This page needs seven consecutive complete days. The record
        holds ${n(have)}. Describing “a week” out of ${n(have)} days would be the
        easiest lie on this site to tell, so it waits.</p></header>
      <a class="btn" href="#/">Back to the signals →</a>`;
  }

  const t = w.totals;
  // Ordered by the thing the chart is about, so it reads top to bottom as
  // "most a working-week activity" down to "most a weekend one".
  const kinds = w.kinds
    .filter(k => k.key !== 'unclassified' && k.lift_pct != null)
    .sort((a, b) => b.lift_pct - a.lift_pct);
  const un = w.kinds.find(k => k.key === 'unclassified');
  const span = kinds.reduce((m, k) => Math.max(m, Math.abs(k.lift_pct)), 10);
  const byDow = Object.fromEntries(w.days.map(d => [d.dow, d]));
  const ordered = DOWS.filter(d => byDow[d]);

  // A bar drawn from 25 flights and one from 4,700 should not look equally
  // solid. Thin ones are hatched and labelled rather than dropped.
  const dbar = k => {
    const pos = k.lift_pct >= 0;
    const thin = k.confidence === 'early';
    const width = Math.abs(k.lift_pct) / span * 50;
    return `<a class="dbar${thin ? ' thin' : ''}" href="#/kind/${esc(k.key)}">
      <div class="dbar-k">${esc(k.label)}<span>${n(k.flights)} flights${
        thin ? ' · small sample' : ''}</span></div>
      <div class="dbar-t"><i class="${pos ? 'pos' : 'neg'}" style="width:${width.toFixed(1)}%"></i></div>
      <div class="dbar-v ${pos ? 'pos' : 'neg'}">${k.lift_pct > 0 ? '+' : ''}${k.lift_pct}%</div>
    </a>`;
  };

  return `
  <header class="page-head">
    <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Week</div>
    <h1>One week, and what it <span class="q">actually shows</span></h1>
    <p class="lede">${niceDate(w.from)} to ${niceDate(w.to)} — seven consecutive complete
      days, one of every weekday. Enough to describe the shape of a week. Not enough,
      yet, to say whether that shape is changing.</p>
  </header>

  <section class="wk">
    ${readout([
      { v: fig(Math.round(t.weekday_per_day)), l: 'Flights on an average weekday' },
      { v: fig(Math.round(t.weekend_per_day)), l: 'Flights on an average weekend day' },
      { v: `${t.lift_pct > 0 ? '+' : ''}${t.lift_pct}%`, l: 'Difference between them',
        s: 'almost nothing' },
      { v: `${w.coverage.share}%`, txt: false,
        l: 'Operators we can classify', s: `${n(w.coverage.no_callsign)} sent no callsign` },
    ])}
  </section>

  <section class="wk">
    <div class="sec-head">
      <div><div class="eyebrow">The finding</div>
        <h2>The working week changes what flies, not how much</h2></div>
      <p class="sec-note">How much more each kind of flying happens on a weekday
        than at the weekend.</p>
    </div>
    <div class="dbar-ends">
      <span></span><b><span>← weekend business</span><span>working week →</span></b><span></span>
    </div>
    <div class="dbars">${kinds.map(dbar).join('')}</div>
    <p class="sec-note" style="margin-top:16px;max-width:var(--measure)">
      Freight and holidays run in opposite directions, at almost the same size. In a
      single count of “flights overhead” they cancel, and the week looks flat — which
      is exactly what the ${t.lift_pct > 0 ? '+' : ''}${t.lift_pct}% above is.
      Hatched bars rest on fewer than 200 flights: read their direction, not their size.
      State flying is in the chart for completeness and is not economic demand.
      ${un ? `A further ${n(un.flights)} flights are from operators we cannot classify
        and are left out of this chart rather than quietly assigned somewhere.` : ''}</p>
  </section>

  <section class="wk">
    <div class="sec-head"><div><div class="eyebrow">Day by day</div>
      <h2>How each kind moves through the week</h2></div>
      <p class="sec-note">Weekends shaded. Tallest day in accent.</p></div>
    <div class="wk-grid">
      ${w.kinds.filter(k => k.flights >= 20).map(k => `
        <div>
          <div class="rhythm-t">${esc(k.label)} · ${n(k.flights)} flights</div>
          ${spark(ordered.map(d => byDow[d].kinds[k.key] || 0), ordered)}
          ${k.reads ? `<p class="kind-note">${esc(k.reads)}</p>` : ''}
        </div>`).join('')}
    </div>
  </section>

  <section class="wk">
    <div class="sec-head"><div><div class="eyebrow">Rhythm</div>
      <h2>A weekday and a weekend day, hour by hour</h2></div>
      <p class="sec-note">Average flights per hour, UTC.</p></div>
    <div class="wk-grid">
      <div><div class="rhythm-t">Weekday average</div>
        ${chart(w.hourly.map(h => ({ hour: String(h.hour).padStart(2, '0'), v: h.weekday })),
                { key: 'hour', val: 'v', labelEvery: 3 })}</div>
      <div><div class="rhythm-t">Weekend average</div>
        ${chart(w.hourly.map(h => ({ hour: String(h.hour).padStart(2, '0'), v: h.weekend })),
                { key: 'hour', val: 'v', labelEvery: 3 })}</div>
    </div>
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Evidence</div>
      <h2>The week, by day</h2></div>
      <a class="btn" href="#/ask?sql=${encodeURIComponent(
        `SELECT dow, carrier_kind, COUNT(*) AS flights\nFROM flights\nWHERE day BETWEEN '${w.from}' AND '${w.to}'\nGROUP BY 1, 2\nORDER BY 1, 3 DESC;`)}">Open in Ask →</a></div>
    ${table(w.days.map(d => ({ ...d, ...d.kinds })), [
      { k: 'day', h: 'Day', render: r => `<span class="mono">${esc(r.day)}</span>
          <span class="dim">${esc(r.dow)}</span>` },
      { k: 'flights', h: 'Flights', num: true, bar: true, render: r => n(r.flights) },
      { k: 'network', h: 'Network', num: true, render: r => n(r.network || 0) },
      { k: 'lowcost', h: 'Low-cost', num: true, render: r => n(r.lowcost || 0) },
      { k: 'leisure', h: 'Charter', num: true, render: r => n(r.leisure || 0) },
      { k: 'cargo', h: 'Cargo', num: true, render: r => n(r.cargo || 0) },
      { k: 'widebody', h: 'Wide-body', num: true, render: r => n(r.widebody) },
    ], { id: 'wk-d', max: 7, csvName: 'ovrhead-week' })}
  </section>

  <section class="prose">
    <h3>What this can and cannot carry</h3>
    <ul>
      <li><b>It is composition, not trend.</b> Every figure here is a direct count
      within one week. Nothing on this page compares one week to another, because
      there is only one.</li>
      <li><b>The kinds are a judgement.</b> Which carriers count as low-cost rather
      than network is editorial, published in
      <a href="${esc(BASE)}carriers.json" class="code">carriers.json</a>, and
      arguable. Hybrids are filed under the model they mostly fly.</li>
      <li><b>${w.coverage.share}% of flights are classified.</b> The rest are operators
      not in the table, or the ${n(w.coverage.no_callsign)} flights that transmitted no
      callsign at all. They are excluded, never distributed.</li>
      <li><b>An overflight is not a destination.</b> Most of what passes here is at
      cruise on the way somewhere else, which is why the total is so flat.</li>
    </ul>
  </section>`;
}

function viewAbout() {
  const t = S.totals, w = S.window;
  return `
  <header class="page-head">
    <div class="crumbs"><a href="#/">Signals</a> <em>/</em> About</div>
    <h1>One antenna, and everything it hears.</h1>
    <p class="lede">OvrHead is a small observatory in Aarhus, Denmark. It listens to the
      transponders of passing aircraft, keeps every observation, and publishes the whole
      record — not a summary of it.</p>
  </header>

  <section>
    ${readout([
      { v: fig(t.flights), l: 'Flights on record', s: `${w.days_observed} days` },
      { v: fig(t.countries), l: 'Registration countries' },
      { v: '1', l: 'Receivers', s: '56.16°N, 10.20°E' },
      { v: '0', l: 'Servers', s: 'static files only' },
    ])}
  </section>

  <section class="prose">
    <h3>Why bother</h3>
    <p>Aviation statistics arrive late, aggregated, and already interpreted. A receiver on a
    roof arrives instantly, ungrouped, and interpreted by nobody. That is a worse dataset in
    almost every way except the one that matters here: you can check it. Every figure on this
    site traces back to a row in a file you can download, and every claim comes with the
    query that produced it.</p>

    <h3>What it is not</h3>
    <p>Not a flight tracker — it will not tell you where a particular aeroplane is. Not a
    news source. And not a measure of the economy: aircraft counts are an input to that kind
    of question, never the answer. Where a reading looks like a conclusion, the
    <a href="#/method">method page</a> says what it actually rests on.</p>

    <h3>How it works</h3>
    <p>A Raspberry Pi with a software-defined radio listens on 1090 MHz. A poller snapshots
    everything visible every fifteen seconds. Overnight those snapshots are stitched into
    flight sessions, enriched with registration and aircraft type, and committed to a public
    repository. The site is static HTML on GitHub Pages; when you ask it something, it loads
    DuckDB into your browser and runs the query there. There is no backend, no account, and
    no analytics — nothing you do here is recorded anywhere.</p>

    <h3>Honesty rules</h3>
    <ul>
      <li>Partial days are hatched in every chart and excluded from every comparison.</li>
      <li>Nothing is called a trend until the record is long enough to support one. Right
      now nothing is.</li>
      <li>Missing values are shown as missing. An unreadable callsign is never a zero.</li>
      <li>Every signal carries what it does <em>not</em> show, alongside what it might.</li>
    </ul>

    <h3>Who made it</h3>
    <p>Built by <a href="https://cevendrell.com" rel="noopener">Carlos Ebrahim Vendrell</a>.
    The source, the pipeline and the whole record live at
    <a href="https://github.com/cevendrell/flight-macro" rel="noopener">github.com/cevendrell/flight-macro</a>.
    Set in Archivo and IBM Plex Mono; the palette is shared with LayOvr.</p>
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Next</div><h2>Where to go from here</h2></div></div>
    <div class="chips">
      <a class="chip" href="#/method">What the record can and cannot show →</a>
      <a class="chip" href="#/data">Take the files →</a>
      <a class="chip" href="#/ask">Ask it something →</a>
    </div>
  </section>`;
}

/* ── Search ──────────────────────────────────────────────────────────── */
function buildIndex() {
  const ix = [];
  S.countries.forEach(c => ix.push({ t: c.name, k: 'Country', h: `#/place/${c.key}`, n: c.flights,
                                     s: (c.name + ' ' + c.key + ' ' + (c.region || '')).toLowerCase() }));
  S.regions.forEach(r => ix.push({ t: r.key, k: 'Region', h: `#/region/${encodeURIComponent(r.key)}`,
                                   n: r.flights, s: r.key.toLowerCase() }));
  S.continents.forEach(r => ix.push({ t: r.key, k: 'Continent', h: `#/continent/${encodeURIComponent(r.key)}`,
                                      n: r.flights, s: r.key.toLowerCase() }));
  S.operators.forEach(o => ix.push({ t: o.name || o.key, k: 'Airline', h: `#/operator/${o.key}`,
                                     n: o.flights, s: ((o.name || '') + ' ' + o.key).toLowerCase() }));
  S.types.forEach(t => ix.push({ t: t.desc || t.key, k: 'Aircraft', h: `#/type/${t.key}`,
                                 n: t.flights, s: ((t.desc || '') + ' ' + t.key).toLowerCase() }));
  (S.week?.kinds || []).forEach(k => {
    if (k.key === 'unclassified') return;
    ix.push({ t: k.label, k: 'Kind of flying', h: `#/kind/${k.key}`, n: k.flights,
              s: (k.label + ' ' + k.key + ' ' + (k.reads || '')).toLowerCase() });
  });
  return ix;
}
function wireSearch(ix) {
  const box = el('search'), out = el('results'), wrap = el('search-wrap');
  let cursor = -1, hits = [];
  const close = () => {
    out.classList.remove('open'); cursor = -1;
    box.setAttribute('aria-expanded', 'false');
    box.removeAttribute('aria-activedescendant');
  };
  const go = h => { location.hash = h; box.value = ''; wrap.classList.remove('filled'); close(); };
  const mark = () => out.querySelectorAll('a').forEach((a, i) => {
    a.classList.toggle('cursor', i === cursor);
    a.setAttribute('aria-selected', String(i === cursor));
  });

  box.addEventListener('input', () => {
    const v = box.value.trim().toLowerCase();
    wrap.classList.toggle('filled', box.value.length > 0);
    if (v.length < 2) return close();
    hits = ix.filter(x => x.s.includes(v))
             .sort((a, b) => (b.s.startsWith(v) - a.s.startsWith(v)) || b.n - a.n)
             .slice(0, 12);
    out.innerHTML = hits.length
      ? hits.map((x, i) => `<a href="${x.h}" data-i="${i}" id="hit-${i}"
            role="option" aria-selected="false">
          <span>${esc(x.t)}</span>
          <span class="k">${esc(x.k)} · ${n(x.n)}</span></a>`).join('')
      : `<a role="option" aria-selected="false"><span class="dim">Nothing matches “${esc(box.value)}”.</span></a>`;
    out.classList.add('open');
    box.setAttribute('aria-expanded', 'true');
  });

  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (out.classList.contains('open')) { close(); }
      else { box.value = ''; wrap.classList.remove('filled'); box.blur(); }
      return;
    }
    if (!hits.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
      mark();
      box.setAttribute('aria-activedescendant', 'hit-' + cursor);
    }
    // Enter with nothing highlighted takes the best match, which is what
    // typing three letters and hitting return is asking for.
    if (e.key === 'Enter') { e.preventDefault(); go(hits[Math.max(cursor, 0)].h); }
  });

  out.addEventListener('click', () => { box.value = ''; wrap.classList.remove('filled'); close(); });
  document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) close(); });

  // "/" is the convention readers of dense pages already have their hands on;
  // ⌘K is the one everyone else has. Both, and neither steals a keystroke that
  // was going into a field.
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); box.focus(); box.select(); }
    if (e.key.toLowerCase() === 'k' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); box.focus(); box.select(); }
  });
}

/* ── Theme ───────────────────────────────────────────────────────────────
   Three states. "System" is the default and is a real choice, not the absence
   of one, so it gets its own button and its own stored value. */
function wireTheme() {
  const host = el('theme');
  const read = () => { try { return localStorage.getItem('ovrhead.theme') || 'system'; }
                       catch { return 'system'; } };
  const paint = mode => {
    if (mode === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = mode;
    host.querySelectorAll('button').forEach(b =>
      b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)));
  };
  host.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    const mode = b.dataset.themeSet;
    try { mode === 'system' ? localStorage.removeItem('ovrhead.theme')
                            : localStorage.setItem('ovrhead.theme', mode); } catch {}

    // The new theme wipes out from the button that was pressed, so the change
    // reads as something the reader did rather than something that happened.
    const r = b.getBoundingClientRect();
    const t = withTransition('theme-vt', () => paint(mode));
    if (!t) return;
    t.ready.then(() => {
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      const reach = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.documentElement.animate(
        { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${reach}px at ${x}px ${y}px)`] },
        { duration: 460, easing: 'cubic-bezier(.4,.14,.3,1)',
          pseudoElement: '::view-transition-new(root)' });
    }, () => {});   // skipped transition: the theme still changed, just plainly
  });
  paint(read());
}

/* ── Router ────────────────────────────────────────────────────────────
   `nav` is bumped on every navigation. Anything that awaits — the query
   engine, a fetch — compares against it afterwards so a slow page cannot
   paint over the one the reader has already moved on to. */
let nav = 0;
let paintScroll = () => {};

function resolve(p) {
  if (!p.length)                 return { html: viewSignals(),  title: null };
  if (p[0] === 's')              return { html: viewSignals(p[1]), sig: p[1],
                                          title: S.signals.find(x => x.id === p[1])?.title || 'Signal' };
  if (p[0] === 'globe')          return { html: viewGlobe(),    title: 'Globe' };
  if (p[0] === 'explore')        return { html: viewExplore(),  title: 'Explore' };
  if (p[0] === 'ask')            return { html: viewAsk(),      title: 'Ask the data' };
  if (p[0] === 'data')           return { html: viewData(),     title: 'Data' };
  if (p[0] === 'method')         return { html: viewMethod(),   title: 'Method' };
  if (p[0] === 'about')          return { html: viewAbout(),    title: 'About' };
  if (p[0] === 'week')           return { html: viewWeek(),     title: 'The week' };
  if (p[0] === 'kind')           return { html: viewKind(p[1]),
                                          title: CAR?.kinds?.[p[1]]?.label || 'Not found' };
  if (p[0] === 'place')          return { html: viewPlace(p[1]),
                                          title: S.countries.find(x => x.key === p[1])?.name || 'Not found' };
  if (p[0] === 'region' || p[0] === 'continent') {
    const name = decodeURIComponent(p[1] || '');
    const list = p[0] === 'region' ? S.regions : S.continents;
    return { html: viewGroup(p[0], name),
             title: list.some(x => x.key === name) ? name : 'Not found' };
  }
  if (p[0] === 'operator')       return { html: viewOperator(p[1]),
                                          title: S.operators.find(x => x.key === p[1])
                                                 ? (S.operators.find(x => x.key === p[1]).name || p[1])
                                                 : 'Not found' };
  if (p[0] === 'type')           return { html: viewType(p[1]),
                                          title: S.types.find(x => x.key === p[1])
                                                 ? (S.types.find(x => x.key === p[1]).desc || p[1])
                                                 : 'Not found' };
  return { html: notFound('That page does not exist.'), title: 'Not found' };
}

function route() {
  const hash = location.hash.replace(/^#/, '');
  // A bare anchor (#main from the skip link) is not a route. Leave the page be.
  if (hash && !hash.startsWith('/')) return;

  nav++;
  const raw = (hash || '/').split('?')[0];
  const p = raw.split('/').filter(Boolean);
  const view = el('view');
  if (globeStop) globeStop();   // stop the previous page's animation loop
  if (covStop) covStop();
  // Sort preference is worth carrying between pages; a filter and an expanded
  // row count are about the page you were on, so they reset with it.
  Object.values(tblState).forEach(s => { s.filter = ''; s.max = null; });

  let r;
  try {
    r = resolve(p);
  } catch (e) {
    console.error(e);
    r = { html: notFound(`Something broke rendering this page: ${esc(e.message)}`),
          title: 'Error' };
  }

  // The whole page swap happens in one pass so the View Transition captures a
  // settled layout: content, title, nav, scroll position and staging together.
  // Anything measured after this — the fold test in animateIn, the pill's new
  // rect — would be measuring the old page if it ran outside.
  withTransition('route-vt', () => {
    view.innerHTML = r.html;
    document.title = r.title ? `${r.title} · OvrHead` : 'OvrHead — an observatory over Aarhus';

    const base = '/' + (p[0] === 's' ? '' : p[0] || '');
    document.querySelectorAll('#nav a').forEach(a =>
      a.classList.toggle('on', a.dataset.r === base));

    view.querySelectorAll('[data-sig]').forEach(b => b.onclick = () => toggleSig(b));
    view.querySelectorAll('[data-permalink]').forEach(b => b.onclick = async () => {
      const url = new URL(location.href);
      url.hash = '#/s/' + b.dataset.permalink;
      try { await navigator.clipboard.writeText(url.href); b.textContent = 'Link copied'; }
      catch { location.hash = url.hash; b.textContent = 'Link is in the address bar'; }
      setTimeout(() => { b.textContent = 'Copy link'; }, 1800);
    });

    if (p[0] === 'ask')    wireAsk();
    if (p[0] === 'globe')  initGlobe();
    if (p[0] === 'method') initCoverage();
    if (el('lazy')) fillLazy();

    const target = r.sig && el(r.sig);
    if (target) target.scrollIntoView({ block: 'center', behavior: still() ? 'auto' : 'smooth' });
    else window.scrollTo(0, 0);

    movePill();
    animateIn(view, 'route');
    paintScroll();
  });
}

/* ── Boot ────────────────────────────────────────────────────────────── */
const grab = (name, required = true) =>
  fetch(BASE + name).then(r => {
    if (!r.ok) throw new Error(`${name} — ${r.status} ${r.statusText}`);
    return r.json();
  }).catch(e => { if (required) throw e; return null; });

(async function main() {
  wireTheme();
  try {
    boot('Fetching the record');
    const [summary, tax, manifest, carriers] = await Promise.all([
      grab('summary.json'), grab('taxonomy.json'), grab('manifest.json', false),
      grab('carriers.json', false),
    ]);
    S = summary; TAX = tax; S._manifest = manifest;
    CAR = carriers || { kinds: {}, carriers: {} };

    const age = (Date.now() - new Date(S.generated_at)) / 3.6e6;
    const ago = age < 1 ? 'just now'
              : age < 48 ? `${age.toFixed(0)}h ago`
              : `${(age / 24).toFixed(0)}d ago`;
    const stampEl = el('stamp');
    stampEl.className = 'freshness' + (age > 30 ? ' stale' : '');
    stampEl.innerHTML = `<span class="dot"></span>Updated <b>${ago}</b>`;
    stampEl.title = `Last data update ${S.generated_at.replace('T', ' ')} UTC · `
                  + `${n(S.totals.flights)} flights over ${S.window.days_observed} days`;
    el('foot-stamp').textContent =
      `${n(S.totals.flights)} flights · record to ${S.generated_at.slice(0, 10)}`;

    // The skip link is an anchor, not a route, so it moves focus itself rather
    // than letting the hash router try to make a page out of it.
    document.querySelector('.skip').addEventListener('click', e => {
      e.preventDefault(); el('main').focus();
    });

    wireSearch(buildIndex());
    paintScroll = wireScrollProgress();
    // The nav wraps to a second row on a phone, so the pill has to be told
    // where its link went whenever the bar reflows — and once more when the
    // web font lands and every link changes width.
    new ResizeObserver(movePill).observe(el('nav'));
    document.fonts?.ready.then(movePill).catch(() => {});

    addEventListener('hashchange', route);
    route();
    el('boot').classList.add('gone');
  } catch (e) {
    console.error(e);
    el('boot').innerHTML =
      `<div class="boot-in" style="max-width:460px;padding:26px;text-align:left">
         <div class="boot-t" style="color:var(--fall);margin-bottom:12px">The record would not load</div>
         <div style="font-size:.85rem;color:var(--ink-2);line-height:1.6">${esc(e.message)}</div>
         <div style="font-size:.8rem;color:var(--mute);line-height:1.6;margin-top:14px">
           The files are static, so this is usually a network problem rather than
           a broken site. <a href="" style="color:var(--accent)">Try again</a>, or take
           the data directly from
           <a href="https://github.com/cevendrell/flight-macro/tree/main/data/adsb"
              style="color:var(--accent)" rel="noopener">the repository</a>.
         </div>
       </div>`;
  }
})();
</script>
</body>
