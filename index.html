function viewMethod() {
  const t = S.totals, w = S.window;
  return `
  <header class="page-head">
    <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Method</div>
    <h1>What we can and cannot see</h1>
    <p class="lede">This page exists so you can argue with us.</p>
  </header>

  <section class="prose">
    <h3>How it is collected</h3>
    <p>One antenna in Aarhus (56.16°N, 10.20°E) receives ADS-B on 1090 MHz — line-of-sight,
    roughly 250–400 km for aircraft at cruise. We sample every 15 seconds; a gap of more than
    30 minutes starts a new flight.</p>

    <h3>How we know the country</h3>
    <p>Transponder addresses are allocated to states in fixed blocks. We resolve each address
    against that table, falling back to the registration prefix. The two methods agree on
    <b>100%</b> of flights where both are readable and together cover
    <b>${(100 - t.unresolved_country / t.flights * 100).toFixed(1)}%</b> of the record.</p>
    <p>This is where an aircraft is <em>registered</em> — not where it departed or is headed.
    A Ryanair jet is Irish-registered wherever it is flying.</p>

    <h3>What we don't claim</h3>
    <ul>
      <li><b>Routes.</b> We only know the nearest airport to where an aircraft entered and
      left range. At 38,000 feet that describes our antenna, not the flight.</li>
      <li><b>Cargo per aircraft.</b> Freighters and passenger jets share type codes, so we
      mark cargo only where the <em>operator</em> is an all-cargo carrier.</li>
      <li><b>Economic conclusions.</b> Aircraft counts are an input to those questions, not
      the answer.</li>
    </ul>

    <h3>Current gaps</h3>
    <ul>
      <li><b>Altitude and speed are missing</b> — the receiver returns them under field names
      the collector didn't read. Fixed going forward; the existing rows stay empty.</li>
      <li><b>${n(t.no_callsign)} flights carry no callsign</b>
      (${(t.no_callsign / t.flights * 100).toFixed(0)}%) — military, state and some private
      aircraft suppress it. Registration and type still come through.</li>
      <li><b>${n(t.unresolved_country)} flights sit outside any allocated address block.</b></li>
      <li><b>The record is ${w.days_observed} days long</b>, ${w.complete_days} of them
      complete — which is why nothing here is presented as a trend yet.</li>
    </ul>

    <h3>Confidence</h3>
    <ul>
      <li><b>Observed</b> — a direct count, no inference.</li>
      <li><b>Early</b> — real, but too short a record to separate from noise.</li>
      <li><b>Moderate</b> — enough history and volume to be worth attention.</li>
      <li><b>Strong</b> — large, consistent, well sampled. Nothing qualifies yet.</li>
    </ul>

    <h3>What we're blind to</h3>
    <p>We see one point in Jutland. Scandinavia–Europe and Europe–Asia routings are
    over-represented; anything routed around Denmark is invisible. Absence here is not
    absence in the sky.</p>
  </section>`;
}

/* ── Search ──────────────────────────────────────────────────────────── */
function buildIndex() {
  const ix = [];
  S.countries.forEach(c => ix.push({ t: c.name, k: 'Country', h: `#/place/${c.key}`, n: c.flights,
                                     s: (c.name + ' ' + c.key + ' ' + (c.region || '')).toLowerCase() }));
  S.regions.forEach(r => ix.push({ t: r.key, k: 'Region', h: `#/region/${encodeURIComponent(r.key)}`,
                                   n: r.flights, s: r.key.toLowerCase() }));
  S.continents.forEach(r => ix.push({ t: r.key, k: 'Continent', h: `#/continent/${encodeURIComponent(r.key)}`,
                                      n: r.flights, s: r.key.toLowerCase() }));
  S.operators.forEach(o => ix.push({ t: o.name || o.key, k: 'Airline', h: `#/operator/${o.key}`,
                                     n: o.flights, s: ((o.name || '') + ' ' + o.key).toLowerCase() }));
  S.types.forEach(t => ix.push({ t: t.desc || t.key, k: 'Aircraft', h: `#/type/${t.key}`,
                                 n: t.flights, s: ((t.desc || '') + ' ' + t.key).toLowerCase() }));
  return ix;
}
function wireSearch(ix) {
  const box = el('search'), out = el('results');
  let cursor = -1, hits = [];
  const close = () => { out.classList.remove('open'); cursor = -1; };
  box.addEventListener('input', () => {
    const v = box.value.trim().toLowerCase();
    if (v.length < 2) return close();
    hits = ix.filter(x => x.s.includes(v))
             .sort((a, b) => (b.s.startsWith(v) - a.s.startsWith(v)) || b.n - a.n)
             .slice(0, 12);
    out.innerHTML = hits.length
      ? hits.map((x, i) => `<a href="${x.h}" data-i="${i}">
          <span>${esc(x.t)}</span>
          <span class="k">${esc(x.k)} · ${n(x.n)}</span></a>`).join('')
      : `<a><span class="dim">Nothing matches “${esc(box.value)}”.</span></a>`;
    out.classList.add('open');
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Escape') { close(); box.blur(); }
    if (!hits.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cursor = (cursor + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
      out.querySelectorAll('a').forEach((a, i) => a.classList.toggle('cursor', i === cursor));
    }
    if (e.key === 'Enter' && cursor >= 0) { location.hash = hits[cursor].h; box.value = ''; close(); }
  });
  out.addEventListener('click', () => { box.value = ''; close(); });
  document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) close(); });
}

/* ── Router ──────────────────────────────────────────────────────────── */
function route() {
  const raw = (location.hash.replace(/^#/, '') || '/').split('?')[0];
  const p = raw.split('/').filter(Boolean);
  const view = el('view');
  if (globeStop) globeStop();   // stop the previous page's animation loop
  let html;
  try {
    if (!p.length)                     html = viewSignals();
    else if (p[0] === 'globe')         html = viewGlobe();
    else if (p[0] === 'explore')       html = viewExplore();
    else if (p[0] === 'ask')           html = viewAsk();
    else if (p[0] === 'data')          html = viewData();
    else if (p[0] === 'method')        html = viewMethod();
    else if (p[0] === 'place')         html = viewPlace(p[1]);
    else if (p[0] === 'region')        html = viewGroup('region', decodeURIComponent(p[1] || ''));
    else if (p[0] === 'continent')     html = viewGroup('continent', decodeURIComponent(p[1] || ''));
    else if (p[0] === 'operator')      html = viewOperator(p[1]);
    else if (p[0] === 'type')          html = viewType(p[1]);
    else                               html = notFound('That page does not exist.');
  } catch (e) {
    console.error(e);
    html = notFound(`Something broke rendering this page: ${esc(e.message)}`);
  }
  view.innerHTML = html;

  const base = '/' + (p[0] || '');
  document.querySelectorAll('#nav a').forEach(a =>
    a.classList.toggle('on', a.dataset.r === base));

  view.querySelectorAll('[data-sig]').forEach(b => b.onclick = () => {
    const s = b.closest('.sig');
    const open = s.classList.toggle('open');
    b.setAttribute('aria-expanded', String(open));
  });

  if (p[0] === 'ask')   wireAsk();
  if (p[0] === 'globe') initGlobe();
  if (el('lazy')) fillLazy();
  window.scrollTo(0, 0);
}

/* ── Boot ────────────────────────────────────────────────────────────── */
(async function main() {
  try {
    boot('Fetching the record');
    const [summary, tax, manifest] = await Promise.all([
      fetch(BASE + 'summary.json').then(r => { if (!r.ok) throw new Error(`summary.json — ${r.status}`); return r.json(); }),
      fetch(BASE + 'taxonomy.json').then(r => r.json()),
      fetch(BASE + 'manifest.json').then(r => r.json()).catch(() => null),
    ]);
    S = summary; TAX = tax; S._manifest = manifest;

    const age = (Date.now() - new Date(S.generated_at)) / 3.6e6;
    const ago = age < 1 ? 'just now'
              : age < 48 ? `${age.toFixed(0)}h ago`
              : `${(age / 24).toFixed(0)}d ago`;
    const stampEl = el('stamp');
    stampEl.className = 'freshness' + (age > 30 ? ' stale' : '');
    stampEl.innerHTML = `<span class="dot"></span>Updated <b>${ago}</b>`;
    stampEl.title = `Last data update ${S.generated_at.replace('T', ' ')} UTC · `
                  + `${n(S.totals.flights)} flights over ${S.window.days_observed} days`;

    wireSearch(buildIndex());
    addEventListener('hashchange', route);
    route();
    el('boot').classList.add('gone');
  } catch (e) {
    console.error(e);
    el('boot').innerHTML =
      `<div class="boot-in" style="max-width:440px;padding:26px">
         <div class="boot-t" style="color:var(--fall);margin-bottom:12px">The record would not load</div>
         <div style="font-size:.85rem;color:var(--ink-2);line-height:1.6">${esc(e.message)}</div>
       </div>`;
  }
})();
