<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Flight Macro — reading global flight-route data as a lens on macroeconomic shifts. Tourism, business travel, migration, supply chains.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Flight Macro">
  <meta property="og:description" content="Global macro trends, read through flight data.">
  <title>Flight Macro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050912'/%3E%3Cpath d='M6 22 L26 10 M6 10 L26 22' stroke='%235eead4' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg:      #050912;
      --bg-2:    #080e1a;
      --surface: #0b1220;
      --panel:   #101a2e;
      --cyan:    #5eead4;
      --cyan-d:  #2dd4bf;
      --cyan-l:  #99f6e4;
      --amber:   #f59e0b;
      --amber-l: #fbbf24;
      --violet:  #a78bfa;
      --text:    #e8ecf5;
      --dim:     #8a97b3;
      --mute:    #4a5878;
      --line:    rgba(255,255,255,0.07);
      --line-2:  rgba(255,255,255,0.12);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--cyan); color: var(--bg); }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(5,9,18,0.85);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { display: flex; align-items: center; gap: 0.6rem; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
    .nav-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--panel); border: 1px solid var(--cyan); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-mark svg { width: 16px; height: 16px; }
    .nav-title-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--mute); letter-spacing: 0.14em; text-transform: uppercase; margin-left: 0.5rem; }
    .nav-links { display: flex; gap: 1.75rem; list-style: none; }
    .nav-links a { font-size: 0.82rem; font-weight: 500; color: var(--dim); transition: color 0.2s; }
    .nav-links a:hover { color: var(--cyan-l); }
    @media (max-width: 720px) { .nav-title-sub { display: none; } .nav-links { gap: 1rem; } }

    /* APP LAYOUT */
    #app {
      display: grid;
      grid-template-columns: 380px 1fr;
      height: 100vh;
      padding-top: 58px;
    }
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      display: flex; flex-direction: column;
    }
    #map-wrap { position: relative; }
    #map { width: 100%; height: 100%; background: var(--bg-2); }

    /* FILTER PANEL */
    .filter-panel {
      padding: 1.25rem 1.25rem 1rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .filter-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem; color: var(--mute);
      letter-spacing: 0.2em; text-transform: uppercase;
      margin-bottom: 0.85rem;
    }
    .filter-group { margin-bottom: 0.9rem; }
    .filter-group:last-child { margin-bottom: 0; }
    .filter-label {
      display: block;
      font-size: 0.72rem; color: var(--dim);
      margin-bottom: 0.4rem; font-weight: 500;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chip {
      font-size: 0.72rem; font-weight: 500;
      padding: 5px 10px; border-radius: 4px;
      background: transparent; border: 1px solid var(--line-2);
      color: var(--dim); cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--cyan); color: var(--cyan-l); }
    .chip.active { background: var(--cyan); border-color: var(--cyan); color: var(--bg); font-weight: 600; }

    /* INSIGHT FEED */
    .feed-header {
      padding: 1rem 1.25rem 0.6rem;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .feed-title { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: var(--mute); letter-spacing: 0.2em; text-transform: uppercase; }
    .feed-count { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: var(--cyan-l); }
    .feed { padding: 0 1.25rem 2rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
    }
    .card:hover { border-color: var(--cyan); transform: translateY(-1px); }
    .card.active { border-color: var(--cyan); background: rgba(94,234,212,0.06); }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; gap: 0.75rem; }
    .card-route { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: var(--mute); letter-spacing: 0.08em; }
    .card-delta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
      white-space: nowrap;
    }
    .card-delta.up { color: var(--cyan); background: rgba(94,234,212,0.1); }
    .card-delta.down { color: var(--amber); background: rgba(245,158,11,0.1); }
    .card-headline { font-size: 0.95rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.35rem; line-height: 1.35; color: var(--text); }
    .card-reading { font-size: 0.78rem; color: var(--dim); line-height: 1.55; }
    .card-meta { margin-top: 0.6rem; display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
    .theme-tag {
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 3px;
    }
    .theme-tag.tourism { color: var(--cyan-l); background: rgba(94,234,212,0.08); }
    .theme-tag.business { color: var(--amber-l); background: rgba(245,158,11,0.1); }
    .theme-tag.migration { color: var(--violet); background: rgba(167,139,250,0.1); }
    .theme-tag.supply-chain { color: #fda4af; background: rgba(253,164,175,0.08); }
    .card-period { font-size: 0.66rem; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
    .card-conf { font-size: 0.62rem; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; margin-left: auto; }
    .empty { padding: 2rem 1rem; text-align: center; color: var(--mute); font-size: 0.85rem; }

    /* MAP OVERLAY LEGEND */
    .map-legend {
      position: absolute;
      bottom: 20px; left: 20px;
      background: rgba(11,18,32,0.9);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.75rem 0.9rem;
      border-radius: 6px;
      z-index: 400;
      font-size: 0.75rem;
    }
    .legend-title { font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; color: var(--mute); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .legend-row { display: flex; align-items: center; gap: 0.5rem; color: var(--dim); margin: 0.3rem 0; font-size: 0.72rem; }
    .legend-swatch { width: 24px; height: 3px; border-radius: 2px; }
    .legend-swatch.up { background: var(--cyan); box-shadow: 0 0 6px rgba(94,234,212,0.7); }
    .legend-swatch.down { background: var(--amber); box-shadow: 0 0 6px rgba(245,158,11,0.7); }

    /* LEAFLET DARK OVERRIDES */
    .leaflet-container { background: var(--bg-2) !important; font-family: 'Inter', sans-serif; }
    .leaflet-control-attribution { background: rgba(5,9,18,0.7) !important; color: var(--mute) !important; font-size: 10px !important; }
    .leaflet-control-attribution a { color: var(--dim) !important; }
    .leaflet-control-zoom a { background: var(--panel) !important; color: var(--dim) !important; border: 1px solid var(--line) !important; }
    .leaflet-control-zoom a:hover { background: var(--surface) !important; color: var(--cyan-l) !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel) !important; color: var(--text) !important; border: 1px solid var(--line-2); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .leaflet-popup-content { font-size: 0.8rem; margin: 10px 12px; }
    .leaflet-popup-content strong { color: var(--cyan-l); }

    /* MOBILE */
    .mobile-toggle {
      display: none;
      position: fixed; bottom: 20px; right: 20px; z-index: 600;
      background: var(--cyan); color: var(--bg); border: none;
      padding: 10px 16px; border-radius: 40px;
      font-family: inherit; font-size: 0.8rem; font-weight: 700;
      box-shadow: 0 6px 20px rgba(94,234,212,0.35);
      cursor: pointer;
    }
    @media (max-width: 780px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      #sidebar { position: fixed; top: 58px; bottom: 0; left: 0; right: 0; z-index: 550; transform: translateY(100%); transition: transform 0.3s; }
      body.sidebar-open #sidebar { transform: translateY(0); }
      .mobile-toggle { display: block; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="nav-mark">
      <svg viewBox="0 0 32 32"><path d="M6 22 L26 10 M6 10 L26 22" stroke="#5eead4" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </div>
    Flight Macro
    <span class="nav-title-sub">macro trends · flight data</span>
  </a>
  <ul class="nav-links">
    <li><a href="pages/methodology/index.html">Methodology</a></li>
    <li><a href="pages/about/index.html">About</a></li>
  </ul>
</nav>

<div id="app">

  <aside id="sidebar">
    <div class="filter-panel">
      <div class="filter-title">Filters</div>

      <div class="filter-group">
        <label class="filter-label">Granularity</label>
        <div class="chip-row" data-filter="granularity">
          <button class="chip active" data-value="all">All</button>
          <button class="chip" data-value="continent">Continent</button>
          <button class="chip" data-value="country">Country</button>
          <button class="chip" data-value="city">City</button>
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label">Theme</label>
        <div class="chip-row" data-filter="theme">
          <button class="chip active" data-value="all">All</button>
          <button class="chip" data-value="tourism">Tourism</button>
          <button class="chip" data-value="business">Business</button>
          <button class="chip" data-value="migration">Migration</button>
          <button class="chip" data-value="supply-chain">Supply chain</button>
        </div>
      </div>

      <div class="filter-group">
        <label class="filter-label">Direction</label>
        <div class="chip-row" data-filter="direction">
          <button class="chip active" data-value="all">All</button>
          <button class="chip" data-value="up">Up YoY</button>
          <button class="chip" data-value="down">Down YoY</button>
        </div>
      </div>
    </div>

    <div class="feed-header">
      <span class="feed-title">Signals</span>
      <span class="feed-count" id="feed-count">—</span>
    </div>
    <div class="feed" id="feed">
      <div class="empty">Loading signals…</div>
    </div>
  </aside>

  <div id="map-wrap">
    <div id="map"></div>
    <div class="map-legend">
      <div class="legend-title">Route flow YoY</div>
      <div class="legend-row"><div class="legend-swatch up"></div> Increasing</div>
      <div class="legend-row"><div class="legend-swatch down"></div> Decreasing</div>
    </div>
  </div>

</div>

<button class="mobile-toggle" id="mobile-toggle">Signals</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  const map = L.map('map', {
    center: [30, 15],
    zoom: 2,
    minZoom: 2,
    maxZoom: 6,
    worldCopyJump: true,
    zoomControl: true,
    attributionControl: true,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap · &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 19,
    pane: 'shadowPane',
    opacity: 0.45,
  }).addTo(map);

  const filters = { granularity: 'all', theme: 'all', direction: 'all' };
  let insights = [];
  let activeId = null;
  const arcLayer = L.layerGroup().addTo(map);
  const markerLayer = L.layerGroup().addTo(map);

  function greatCircle(a, b, segments = 64) {
    const pts = [];
    const dLat = b.lat - a.lat;
    const dLng = b.lng - a.lng;
    for (let i = 0; i <= segments; i++) {
      const t = i / segments;
      const lat = a.lat + dLat * t + Math.sin(Math.PI * t) * Math.abs(dLng) * 0.12;
      const lng = a.lng + dLng * t;
      pts.push([lat, lng]);
    }
    return pts;
  }

  function passesFilter(i) {
    if (filters.granularity !== 'all' && i.origin.type !== filters.granularity && i.dest.type !== filters.granularity) return false;
    if (filters.theme !== 'all' && i.theme !== filters.theme) return false;
    if (filters.direction === 'up' && i.deltaPct <= 0) return false;
    if (filters.direction === 'down' && i.deltaPct >= 0) return false;
    return true;
  }

  function render() {
    arcLayer.clearLayers();
    markerLayer.clearLayers();

    const visible = insights.filter(passesFilter);
    document.getElementById('feed-count').textContent = String(visible.length).padStart(2, '0');

    const feed = document.getElementById('feed');
    if (visible.length === 0) {
      feed.innerHTML = '<div class="empty">No signals match these filters.</div>';
    } else {
      feed.innerHTML = visible.map(cardHtml).join('');
      feed.querySelectorAll('.card').forEach(el => {
        el.addEventListener('click', () => selectInsight(el.dataset.id));
      });
    }

    visible.forEach(drawInsight);
  }

  function cardHtml(i) {
    const up = i.deltaPct >= 0;
    const sign = up ? '+' : '';
    const conf = i.confidence ? `<span class="card-conf">${i.confidence}</span>` : '';
    return `
      <div class="card ${i.id === activeId ? 'active' : ''}" data-id="${i.id}">
        <div class="card-top">
          <span class="card-route">${i.origin.name.toUpperCase()} → ${i.dest.name.toUpperCase()}</span>
          <span class="card-delta ${up ? 'up' : 'down'}">${sign}${i.deltaPct.toFixed(1)}%</span>
        </div>
        <div class="card-headline">${i.headline}</div>
        <div class="card-reading">${i.reading}</div>
        <div class="card-meta">
          <span class="theme-tag ${i.theme}">${i.theme.replace('-', ' ')}</span>
          <span class="card-period">${i.period}</span>
          ${conf}
        </div>
      </div>
    `;
  }

  function drawInsight(i) {
    const up = i.deltaPct >= 0;
    const color = up ? '#5eead4' : '#f59e0b';
    const weight = Math.min(1 + Math.abs(i.deltaPct) * 0.4, 5);
    const opacity = i.id === activeId ? 0.95 : 0.55;

    L.polyline(greatCircle(i.origin, i.dest), {
      color, weight, opacity,
      lineCap: 'round',
    }).addTo(arcLayer);

    [i.origin, i.dest].forEach((p, idx) => {
      const isDest = idx === 1;
      L.circleMarker([p.lat, p.lng], {
        radius: isDest ? 5 : 4,
        color, weight: 2,
        fillColor: isDest ? color : 'transparent',
        fillOpacity: isDest ? 0.9 : 0,
      }).bindPopup(`
        <strong>${i.origin.name} → ${i.dest.name}</strong><br>
        ${up ? '+' : ''}${i.deltaPct.toFixed(1)}% · ${i.period}<br>
        <span style="color:#8a97b3">${i.headline}</span>
      `).addTo(markerLayer);
    });
  }

  function selectInsight(id) {
    activeId = id === activeId ? null : id;
    render();
    const i = insights.find(x => x.id === id);
    if (i && activeId) {
      const bounds = L.latLngBounds([[i.origin.lat, i.origin.lng], [i.dest.lat, i.dest.lng]]);
      map.flyToBounds(bounds.pad(0.5), { duration: 0.9, maxZoom: 4 });
      if (window.innerWidth <= 780) document.body.classList.remove('sidebar-open');
    }
  }

  document.querySelectorAll('.chip-row').forEach(row => {
    const key = row.dataset.filter;
    row.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      filters[key] = btn.dataset.value;
      render();
    });
  });

  document.getElementById('mobile-toggle').addEventListener('click', () => {
    document.body.classList.toggle('sidebar-open');
  });

  fetch('data/insights.json')
    .then(r => r.json())
    .then(json => {
      insights = json.insights || [];
      render();
    })
    .catch(err => {
      document.getElementById('feed').innerHTML =
        `<div class="empty">Could not load insights.<br><span style="font-size:0.7rem">${err.message}</span></div>`;
    });
</script>
</body>
</html>
