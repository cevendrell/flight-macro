<script src="https://unpkg.com/three@0.155.0/build/three.min.js"></script>
<script src="https://unpkg.com/globe.gl@2.27.2/dist/globe.gl.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  // ---- Globe setup ----
  const mapEl = document.getElementById('map');
  const globe = Globe()(mapEl)
    .backgroundColor('rgba(0,0,0,0)')
    .globeImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-dark.jpg')
    .bumpImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png')
    .showAtmosphere(true)
    .atmosphereColor('#8fa8c8')
    .atmosphereAltitude(0.14)
    .polygonAltitude(0.006)
    .polygonCapColor(() => 'rgba(201,168,106,0)')
    .polygonSideColor(() => 'rgba(201,168,106,0)')
    .polygonStrokeColor(() => 'rgba(154,148,132,0.35)')
    .polygonsTransitionDuration(180)
    // Two-layer arcs: solid faded base + flowing dashed overlay (IEA-style)
    .arcColor('color')
    .arcAltitudeAutoScale(0.42)
    .arcStroke(a => a.stroke)
    .arcDashLength(a => a.dashLen ?? 1)
    .arcDashGap(a => a.dashGap ?? 0)
    .arcDashInitialGap(a => a.initGap ?? 0)
    .arcDashAnimateTime(a => a.animMs ?? 0)
    .arcsTransitionDuration(400)
    .pointsData([])
    .pointAltitude(0.008)
    .pointColor('color')
    .pointRadius(0.35);

  // ── Auto-fit to container, respond to resize ──
  function resizeGlobe() {
    const w = mapEl.clientWidth || window.innerWidth;
    const h = mapEl.clientHeight || window.innerHeight;
    globe.width(w).height(h);
  }
  resizeGlobe();
  window.addEventListener('resize', resizeGlobe);

  // ── Controls: slower auto-rotate before any pick; disable after ──
  globe.controls().autoRotate = true;
  globe.controls().autoRotateSpeed = 0.35;
  globe.controls().enableZoom = true;
  globe.controls().minDistance = 180;
  globe.controls().maxDistance = 600;

  // ── Fetch countries GeoJSON (via topojson from unpkg) and wire polygons ──
  fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json')
    .then(r => r.json())
    .then(topo => {
      const countries = topojson.feature(topo, topo.objects.countries).features
        .filter(f => f.properties && f.properties.name !== 'Antarctica');
      globe.polygonsData(countries)
        .polygonLabel(d => `<div class="scene-tooltip">${(d.properties && d.properties.name) || ''}</div>`)
        .onPolygonHover(hovered => {
          hoveredCountryFeature = hovered || null;
          globe
            .polygonAltitude(d => d === hovered ? 0.02 : 0.006)
            .polygonCapColor(d => d === hovered ? 'rgba(201,168,106,0.28)' : 'rgba(201,168,106,0)')
            .polygonStrokeColor(d => d === hovered ? 'rgba(220,194,150,0.9)' : 'rgba(154,148,132,0.35)');
          mapEl.style.cursor = hovered ? 'pointer' : 'grab';
        })
        .onPolygonClick(feat => {
          const name = feat && feat.properties && feat.properties.name;
          if (name) handleCountryClickFromMap(name);
        });
      document.getElementById('globe-loading').classList.add('done');
    })
    .catch(err => {
      console.warn('World atlas failed:', err);
      document.getElementById('globe-loading').classList.add('done');
    });

  // ── When user picks a country by clicking the globe ──
  // If already focused on a country, promote to a pair (drill into that specific corridor).
  // Otherwise, focus on this country as a fresh node.
  function handleCountryClickFromMap(name) {
    globe.controls().autoRotate = false;
    const cur = currentFocus();
    if (cur && cur.kind === 'country' && normName(cur.name) !== normName(name)) {
      focusOn({ kind: 'pair', id: `${cur.name}::${name}`, name: `${cur.name} ↔ ${name}`, pair: [cur.name, name] });
    } else {
      focusOn({ kind: 'country', id: name, name });
    }
  }

  // ---- State ----
  // The "focus" is a single node the user is exploring: a country, a region, or an airport.
  // Direction: 'both' (default), 'out' (from focus), 'in' (to focus).
  const filters = { theme: 'all', direction: 'all', sort: 'strength', dirRel: 'both' };
  let insights = [];
  let activeId = null;
  let hoverId = null;
  let meta = {};
  let hoveredCountryFeature = null;
  const arcById = new Map();

  /** Focus stack — most-recent node last. Empty stack = landing. */
  const focusStack = [];   // items: { kind: 'country'|'region'|'airport'|'pair', id, name }
  function currentFocus() { return focusStack.length ? focusStack[focusStack.length - 1] : null; }

  // ── Region definitions — expand freely ──────────────────────────────────
  const REGIONS = {
    'Nordics':           { members: ['SE','NO','DK','FI','IS'] },
    'Iberia':            { members: ['ES','PT'] },
    'Benelux':           { members: ['NL','BE','LU'] },
    'DACH':              { members: ['DE','AT','CH'] },
    'British Isles':     { members: ['GB','IE'] },
    'Baltics':           { members: ['EE','LV','LT'] },
    'Central Europe':    { members: ['PL','CZ','SK','HU'] },
    'Balkans':           { members: ['HR','RS','BA','ME','MK','AL','XK','SI'] },
    'Mediterranean EU':  { members: ['ES','IT','EL','PT','FR','HR','CY','MT'] },
    'EU':                { members: ['AT','BE','BG','CY','CZ','DE','DK','EE','EL','ES','FI','FR','HR','HU','IE','IT','LT','LU','LV','MT','NL','PL','PT','RO','SE','SI','SK'] },
    'MENA':              { members: ['MA','TN','EG','AE','QA','SA','JO','LB','IL'] },
    'East Asia':         { members: ['CN','JP','KR','HK','TW'] },
    'Southeast Asia':    { members: ['SG','TH','VN','ID','MY','PH'] },
    'North America':     { members: ['US','CA','MX'] },
    'Oceania':           { members: ['AU','NZ'] },
  };

  // ---- Watchlist (per-viewer, browser storage) ----
  const WATCH_KEY = 'ovrhead.watched.v1';
  let watched = new Set();
  try {
    const raw = localStorage.getItem(WATCH_KEY);
    if (raw) watched = new Set(JSON.parse(raw));
  } catch { /* private mode etc. */ }
  function saveWatched() {
    try { localStorage.setItem(WATCH_KEY, JSON.stringify([...watched])); } catch {}
  }
  function toggleWatch(id) {
    if (watched.has(id)) watched.delete(id); else watched.add(id);
    saveWatched();
    render();
    if (activeId === id) openDrawer(id); // refresh drawer star
  }

  // ---- Helpers ----
  function fmtInt(n) {
    if (!Number.isFinite(n)) return '';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  function strength(i) { return Math.abs(i.deltaPct || 0) * Math.log10(Math.max(i.volumeCurrent || 100, 10)); }

  function normName(s) { return String(s || '').trim().toLowerCase(); }

  /** Does an insight touch this country (by code or name)? Direction 'both'|'out'|'in'. */
  function insightTouchesCountry(i, code, name, dir = 'both') {
    const cLower = normName(code), nLower = normName(name);
    const oMatch = normName(i.origin.code) === cLower || normName(i.origin.name) === nLower || normName(i.origin.country) === nLower;
    const dMatch = normName(i.dest.code)   === cLower || normName(i.dest.name)   === nLower || normName(i.dest.country)   === nLower;
    if (dir === 'out') return oMatch;
    if (dir === 'in')  return dMatch;
    return oMatch || dMatch;
  }

  /** Does an insight belong to the currently-focused node? */
  function insightInFocus(i, node) {
    if (!node) return false;
    const dir = filters.dirRel || 'both';
    if (node.kind === 'country') {
      return insightTouchesCountry(i, node.id, node.name, dir);
    }
    if (node.kind === 'region') {
      const members = REGIONS[node.id]?.members || [];
      // "out": origin is a member country; "in": destination is a member country
      return members.some(code => insightTouchesCountry(i, code, '', dir));
    }
    if (node.kind === 'airport') {
      const iata = node.iataOrIcao;
      const endpointIsAirport = (i.origin.type === 'city' && i.origin.name.includes(`(${iata})`))
                              || (i.dest.type   === 'city' && i.dest.name.includes(`(${iata})`));
      return endpointIsAirport;
    }
    if (node.kind === 'pair') {
      const [a, b] = node.pair;
      return (insightTouchesCountry(i, a, a) && insightTouchesCountry(i, b, b));
    }
    return false;
  }

  function passesFilter(i) {
    const node = currentFocus();
    if (!node) return false;                     // landing shows top-N separately, not via this path
    if (!insightInFocus(i, node)) return false;
    if (filters.theme !== 'all' && i.theme !== filters.theme) return false;
    if (filters.direction === 'up' && i.deltaPct <= 0) return false;
    if (filters.direction === 'down' && i.deltaPct >= 0) return false;
    if (filters.direction === 'watched' && !watched.has(i.id)) return false;
    return true;
  }

  function sortInsights(list) {
    const s = filters.sort;
    const out = list.slice();
    if (s === 'strength') out.sort((a, b) => strength(b) - strength(a));
    else if (s === 'delta') out.sort((a, b) => Math.abs(b.deltaPct) - Math.abs(a.deltaPct));
    else if (s === 'volume') out.sort((a, b) => (b.volumeCurrent || 0) - (a.volumeCurrent || 0));
    else if (s === 'az') out.sort((a, b) => (a.origin.name + a.dest.name).localeCompare(b.origin.name + b.dest.name));
    return out;
  }

  // How many signals show in the short list. Busy user cap.
  const SHORT_LIST_MAX = 6;

  function scopedInsights() {
    const node = currentFocus();
    if (!node) return [];
    return insights.filter(i => insightInFocus(i, node));
  }

  function filteredInsights() {
    return sortInsights(insights.filter(passesFilter));
  }

  function render() {
    arcById.clear();
    const node = currentFocus();
    document.getElementById('map-prompt').classList.toggle('hidden', !!node);
    renderCrumbs();

    const hero = document.getElementById('hero-block');
    const feed = document.getElementById('feed');
    const dirTab = document.getElementById('direction-tab');

    if (!node) {
      dirTab.hidden = true;
      renderLanding(hero, feed);
    } else if (node.kind === 'pair') {
      dirTab.hidden = true;
      renderPairMode(hero, feed);
    } else {
      renderNodeDashboard(hero, feed, node, dirTab);
    }

    applyHighlight();

    // Fly only when the focus itself changes — not on sort/filter tweaks.
    const focusKey = node ? `${node.kind}:${node.id}` : '';
    if (node && focusKey !== lastFlownKey) {
      const arcTargets = filteredInsights();
      if (arcTargets.length) flyToSelection(arcTargets);
      lastFlownKey = focusKey;
    } else if (!node) {
      lastFlownKey = '';
    }
  }
  let lastFlownKey = '';

  // ── Navigation ──────────────────────────────────────────────────────────
  function focusOn(node, { push = true } = {}) {
    if (push) {
      // Collapse identical consecutive entries
      const cur = currentFocus();
      if (!cur || cur.kind !== node.kind || cur.id !== node.id) {
        focusStack.push(node);
      }
    }
    filters.dirRel = 'both';
    updateFocusInputValue();
    render();
  }
  function goBack() {
    focusStack.pop();
    updateFocusInputValue();
    render();
  }
  function clearFocus() {
    focusStack.length = 0;
    updateFocusInputValue();
    render();
  }
  function updateFocusInputValue() {
    const node = currentFocus();
    const el = document.getElementById('focus-input');
    if (el) el.value = node ? node.name : '';
    const cx = document.getElementById('focus-clear');
    if (cx) cx.hidden = !node;
  }

  function renderCrumbs() {
    const el = document.getElementById('crumbs');
    if (focusStack.length === 0) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    const parts = [`<button class="crumb-back" id="crumb-back">${focusStack.length > 1 ? '← back' : '× clear'}</button>`];
    parts.push(`<span class="crumb-item" data-idx="-1">Board</span>`);
    focusStack.forEach((node, idx) => {
      parts.push(`<span class="crumb-sep">›</span>`);
      const isLast = idx === focusStack.length - 1;
      parts.push(`<span class="crumb-item ${isLast ? 'current' : ''}" data-idx="${idx}">${escapeHtml(node.name)}</span>`);
    });
    el.innerHTML = parts.join(' ');
    el.querySelector('#crumb-back').addEventListener('click', () => {
      focusStack.length > 1 ? goBack() : clearFocus();
    });
    el.querySelectorAll('.crumb-item').forEach(c => {
      c.addEventListener('click', () => {
        const idx = Number(c.dataset.idx);
        if (idx === -1) return clearFocus();
        if (idx === focusStack.length - 1) return;   // already there
        focusStack.length = idx + 1;
        updateFocusInputValue();
        render();
      });
    });
  }

  function wireCards(container) {
    container.querySelectorAll('.card').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('.card-star')) return;
        selectInsight(el.dataset.id);
      });
      el.addEventListener('mouseenter', () => setHover(el.dataset.id));
      el.addEventListener('mouseleave', () => setHover(null));
    });
    container.querySelectorAll('.card-star').forEach(el => {
      el.addEventListener('click', e => { e.stopPropagation(); toggleWatch(el.dataset.id); });
    });
  }

  // ---- LANDING: no focus → thesis board of top 8 worldwide ----
  function renderLanding(hero, feed) {
    const top = sortInsights(insights.slice()).slice(0, 8);
    hero.innerHTML = `
      <div class="hero-eyebrow">Today · ${escapeHtml((meta && meta.period) || '')}</div>
      <div class="hero-title">Thesis <span class="accent">Board</span></div>
      <div class="hero-sub">The strongest ${top.length} macro signals across the network. Click any endpoint to focus on it, any card to open its reasoning.</div>
    `;
    if (!top.length) {
      feed.innerHTML = `<div class="feed-landing">Loading signals…</div>`;
      drawArcs([]);
      return;
    }
    feed.innerHTML = top.map(i => thesisCardHtml(i, insights)).join('');
    wireThesisCards(feed, insights);
    drawArcs(top);
  }

  // ---- NODE DASHBOARD — country, region, or airport ----
  function renderNodeDashboard(hero, feed, node, dirTab) {
    const scoped = scopedInsights();     // all insights matching this node (any theme, any dir per current dirRel)
    const shown  = filteredInsights();
    const kindLabel = node.kind === 'region' ? 'REGION' : node.kind === 'airport' ? 'AIRPORT' : 'COUNTRY';
    if (!scoped.length) {
      hero.innerHTML = `
        <div class="hero-eyebrow">${kindLabel} · ${escapeHtml(node.name)}</div>
        <div class="hero-title">No signals yet</div>
        <div class="hero-sub">The current dataset doesn't have material anomalies touching <strong>${escapeHtml(node.name)}</strong>. Try another node, or check back after the next update.</div>
      `;
      dirTab.hidden = true;
      feed.innerHTML = '';
      drawArcs([]);
      return;
    }
    const agg = aggregate(scoped);
    hero.innerHTML = `
      <div class="hero-eyebrow">${kindLabel} · ${escapeHtml(node.name)} · ${escapeHtml((meta && meta.period) || '')}</div>
      <div class="hero-num ${agg.netUp ? 'up' : 'down'}">${agg.netUp ? '+' : ''}${agg.netPct.toFixed(1)}%</div>
      <div class="hero-sub">
        Net across <strong>${agg.total} corridor${agg.total===1?'':'s'}</strong> · <strong>${agg.up}</strong> up, <strong>${agg.down}</strong> down.
      </div>
    `;

    // Direction chips: All / Outbound / Inbound. Only meaningful for country + region.
    if (node.kind !== 'airport') {
      dirTab.hidden = false;
      dirTab.innerHTML = `
        <button class="dir-chip ${filters.dirRel==='both' ? 'active':''}" data-dir="both">All flows</button>
        <button class="dir-chip ${filters.dirRel==='out'  ? 'active':''}" data-dir="out">Outbound →</button>
        <button class="dir-chip ${filters.dirRel==='in'   ? 'active':''}" data-dir="in">← Inbound</button>
      `;
      dirTab.querySelectorAll('.dir-chip').forEach(btn => {
        btn.addEventListener('click', () => { filters.dirRel = btn.dataset.dir; render(); });
      });
    } else {
      dirTab.hidden = true;
    }

    const top = shown.slice(0, SHORT_LIST_MAX);
    const overflow = shown.length - top.length;
    feed.innerHTML = `
      ${top.map(i => thesisCardHtml(i, insights)).join('')}
      ${overflow > 0 ? `<button class="show-more" id="show-more">Show ${overflow} more</button>` : ''}
    `;
    wireThesisCards(feed, insights);
    if (overflow > 0) {
      document.getElementById('show-more').addEventListener('click', () => {
        feed.innerHTML = shown.map(i => thesisCardHtml(i, insights)).join('');
        wireThesisCards(feed, insights);
      });
    }
    drawArcs(shown);
  }

  // ---- PAIR: two countries pinned, single thesis card ----
  function renderPairMode(hero, feed) {
    const shown = filteredInsights();
    const node = currentFocus();
    if (!shown.length) {
      hero.innerHTML = `
        <div class="hero-eyebrow">PAIR · ${escapeHtml(node.name)}</div>
        <div class="hero-title">No signal for this corridor</div>
        <div class="hero-sub">No material anomaly computed for this pair in the current period. Focus on either endpoint alone to widen.</div>
      `;
      feed.innerHTML = '';
      drawArcs([]);
      return;
    }
    const primary = shown[0];
    hero.innerHTML = `
      <div class="hero-eyebrow">PAIR · ${escapeHtml(primary.origin.name)} ↔ ${escapeHtml(primary.dest.name)}</div>
      <div class="hero-title">${escapeHtml(primary.headline || '')}</div>
    `;
    const related = shown.slice(1, 4);
    feed.innerHTML = `
      ${thesisCardHtml(primary, insights)}
      ${related.length ? `<div class="feed-heading" style="padding-top:0.75rem">Related</div>${related.map(i => thesisCardHtml(i, insights)).join('')}` : ''}
    `;
    wireThesisCards(feed, insights);
    requestAnimationFrame(() => {
      const first = feed.querySelector('.thesis-card');
      if (first) {
        first.classList.add('open');
        const btn = first.querySelector('.tc-expand');
        if (btn) btn.textContent = 'Hide reasoning ▴';
      }
    });
    drawArcs(shown);
  }

  function aggregate(list) {
    const up = list.filter(i => i.deltaPct > 0).length;
    const down = list.filter(i => i.deltaPct < 0).length;
    // Volume-weighted net delta if volumes present, else simple mean
    let netPct = 0;
    const withVol = list.filter(i => (i.volumeCurrent || 0) > 0);
    if (withVol.length) {
      const totalVol = withVol.reduce((s, i) => s + i.volumeCurrent, 0);
      netPct = withVol.reduce((s, i) => s + (i.deltaPct * i.volumeCurrent), 0) / totalVol;
    } else if (list.length) {
      netPct = list.reduce((s, i) => s + i.deltaPct, 0) / list.length;
    }
    return { total: list.length, up, down, netPct, netUp: netPct >= 0 };
  }

  function flyToSelection(visible) {
    // Centroid of all endpoints; altitude based on max span so both endpoints stay in view.
    let sumLat = 0, sumLng = 0, n = 0;
    let minLat = 90, maxLat = -90, minLng = 180, maxLng = -180;
    visible.forEach(i => {
      [i.origin, i.dest].forEach(p => {
        sumLat += p.lat; sumLng += p.lng; n++;
        minLat = Math.min(minLat, p.lat); maxLat = Math.max(maxLat, p.lat);
        minLng = Math.min(minLng, p.lng); maxLng = Math.max(maxLng, p.lng);
      });
    });
    if (!n) return;
    const span = Math.max(maxLat - minLat, maxLng - minLng);
    const altitude = Math.min(2.6, Math.max(0.9, span / 40 + 0.9));
    globe.controls().autoRotate = false;
    globe.pointOfView({ lat: sumLat / n, lng: sumLng / n, altitude }, 900);
  }

  // ── Thesis card — the primary experience ───────────────────────────────
  // Structure: Thesis (headline) · Anomaly + baseline · [expand] Pattern / If true / Angle
  // Confidence + theme in the meta row. No source line — attribution lives in
  // About/Methodology; on-card, it's just noise.

  function computePattern(i, all) {
    // Find peer corridors — same destination OR same origin — from other insights.
    const destPeers = all.filter(x => x.id !== i.id && x.dest.country === i.dest.country);
    const origPeers = all.filter(x => x.id !== i.id && x.origin.country === i.origin.country);
    const iUp = i.deltaPct >= 0;

    function summarize(peers, side) {
      if (peers.length < 2) return null;
      const same  = peers.filter(p => (p.deltaPct >= 0) === iUp).length;
      const total = peers.length;
      const ratio = same / total;
      const meanDelta = peers.reduce((s, p) => s + p.deltaPct, 0) / total;
      const sideLabel = side === 'dest' ? i.dest.country : i.origin.country;
      const oppLabel  = side === 'dest' ? 'origins' : 'destinations';
      if (ratio >= 0.7) {
        return `Regional pattern — ${same}/${total} other ${oppLabel} into <strong>${escapeHtml(sideLabel)}</strong> are moving the same way (mean ${meanDelta >= 0 ? '+' : ''}${meanDelta.toFixed(1)}%). This is about <strong>${escapeHtml(sideLabel)}</strong>, not just this pair.`;
      }
      if (ratio <= 0.3) {
        return `Idiosyncratic — other ${oppLabel} into <strong>${escapeHtml(sideLabel)}</strong> move the opposite way (mean ${meanDelta >= 0 ? '+' : ''}${meanDelta.toFixed(1)}%). This corridor is the outlier, not the rule.`;
      }
      return null;
    }
    return summarize(destPeers, 'dest') || summarize(origPeers, 'origin') ||
      `<span class="muted">Not enough peer corridors in the current dataset to say whether this is regional or idiosyncratic.</span>`;
  }

  function templateIfTrue(i) {
    const up = i.deltaPct >= 0;
    const theme = i.theme || 'business';
    const dest = escapeHtml(i.dest.name);
    const orig = escapeHtml(i.origin.name);
    if (theme === 'tourism') {
      return up
        ? `If sustained, expect <strong>${dest}</strong> hotel occupancy and F&B receipts to lift over the next 4–8 weeks. Watch for corroboration in next release of the ${orig} consumer-confidence index.`
        : `If sustained, expect <strong>${dest}</strong> hospitality operators to see a soft next quarter. Watch ${orig} disposable-income and FX moves.`;
    }
    if (theme === 'business') {
      return up
        ? `If persistent, likely to show up in cross-border services trade and next PMI release for the ${orig}–${dest} corridor. Corporate activity indicator to track: front-cabin load factor.`
        : `If persistent, softer transnational corporate activity between ${orig} and ${dest}. Track it against services-PMI and trade-balance releases.`;
    }
    if (theme === 'migration') {
      return up
        ? `If sustained, expect visa / work-permit applications on the ${orig} → ${dest} corridor to trend in the same direction over the next 1–2 quarters.`
        : `If sustained, a slowdown in visa / work-permit flows on this corridor. Watch labour-market indicators in ${dest}.`;
    }
    // supply-chain
    return up
      ? `If persistent, freighter capacity on the ${orig} → ${dest} lane will follow within a quarter. Corroborate against port-throughput data.`
      : `If persistent, expect logistics slot capacity to unwind on this lane. Corroborate against ${dest} manufacturing-PMI.`;
  }

  function templateAngle(i) {
    const up = i.deltaPct >= 0;
    const theme = i.theme || 'business';
    const dest = escapeHtml(i.dest.name);
    const orig = escapeHtml(i.origin.name);
    if (theme === 'tourism') {
      return up
        ? `Long ${dest} hospitality / short ${orig} discretionary retail if the trend hardens.`
        : `Long ${orig} domestic tourism / cautious on ${dest} hospitality names with exposure to this corridor.`;
    }
    if (theme === 'business') {
      return up
        ? `Overweight ${dest} services stocks with ${orig} client exposure; track carrier front-cabin unit revenue.`
        : `Underweight ${dest}-exposed corporate services if the pattern extends beyond one quarter.`;
    }
    if (theme === 'migration') {
      return up
        ? `${dest} labour supply loosening on this corridor — bullish for ${dest} sectors hiring at scale.`
        : `${dest} labour supply tightening on this corridor — cost pressure to watch in ${dest} labour-intensive sectors.`;
    }
    return up
      ? `Long ${dest} industrial-exposure names benefitting from inbound capacity; watch cargo carrier unit revenue.`
      : `Cargo capacity on this lane is easing — freight-rate downside for carriers over-indexed to it.`;
  }

  function thesisCardHtml(i, all) {
    const up = i.deltaPct >= 0;
    const sign = up ? '+' : '';
    const conf = (i.confidence || 'medium').toLowerCase();
    const theme = i.theme || 'business';
    const vol = i.volumeCurrent ? `<strong>${fmtInt(i.volumeCurrent)}</strong> pax` : 'material volume';
    const priorVol = i.volumePrior ? `${fmtInt(i.volumePrior)} prior` : '';
    const patternHtml = computePattern(i, all);

    return `
      <div class="thesis-card ${up ? 'dir-up' : 'dir-down'} ${i.id === activeId ? 'active' : ''}" data-id="${i.id}">
        <div class="tc-head">
          <div class="tc-thesis">${escapeHtml(i.headline || (i.origin.name + ' ↔ ' + i.dest.name))}</div>
          <div class="tc-delta ${up ? 'up' : 'down'}">${sign}${(+i.deltaPct).toFixed(1)}%</div>
        </div>
        <div class="tc-anomaly">
          <span class="clickable-node" data-node-country="${escapeHtml(i.origin.country || i.origin.name)}">${escapeHtml(i.origin.name)}</span>
          →
          <span class="clickable-node" data-node-country="${escapeHtml(i.dest.country || i.dest.name)}">${escapeHtml(i.dest.name)}</span>
          · ${vol}${priorVol ? ' vs ' + priorVol : ''} · ${escapeHtml(i.period || '')}
          <span class="tc-baseline"><span class="bs-name">baseline:</span> prior-year same window <span class="bs-note">→ seasonal + peer baselines coming</span></span>
        </div>
        <div class="tc-meta">
          <span class="tc-conf ${conf}">${conf.toUpperCase()}</span>
          <span class="tc-theme ${theme}">${theme.replace('-', ' ')}</span>
          <button class="tc-expand" data-id="${i.id}">Show reasoning ▾</button>
        </div>
        <div class="tc-body">
          <div class="tc-section"><h4>Pattern</h4><p>${patternHtml}</p></div>
          <div class="tc-section"><h4>If true</h4><p>${templateIfTrue(i)}</p></div>
          <div class="tc-section"><h4>Angle</h4><p>${templateAngle(i)}</p></div>
        </div>
      </div>
    `;
  }

  function wireThesisCards(container, allInsights) {
    container.querySelectorAll('.thesis-card').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('.tc-expand')) return;
        if (e.target.closest('.clickable-node')) return;
        selectInsight(el.dataset.id);
      });
      el.addEventListener('mouseenter', () => setHover(el.dataset.id));
      el.addEventListener('mouseleave', () => setHover(null));
    });
    container.querySelectorAll('.tc-expand').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const card = btn.closest('.thesis-card');
        const isOpen = card.classList.toggle('open');
        btn.textContent = isOpen ? 'Hide reasoning ▴' : 'Show reasoning ▾';
      });
    });
    // Endpoint chips → focus on that country
    container.querySelectorAll('.clickable-node').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        const name = el.dataset.nodeCountry;
        if (!name) return;
        focusOn({ kind: 'country', id: name, name });
      });
    });
  }

  // Compact card — the secondary list item. Route, delta, one-line reading, no meta noise.
  function compactCard(i) {
    const up = i.deltaPct >= 0;
    const sign = up ? '+' : '';
    return `
      <div class="card compact ${i.id === activeId ? 'active' : ''}" data-id="${i.id}">
        <div class="card-top">
          <span class="card-route">${escapeHtml(i.origin.name)} → ${escapeHtml(i.dest.name)}</span>
          <span class="card-delta ${up ? 'up' : 'down'}">${sign}${(+i.deltaPct).toFixed(1)}%</span>
        </div>
        <div class="card-headline compact">${escapeHtml(i.headline || '')}</div>
      </div>
    `;
  }

  // Full card — used inside the drawer for the deep-dive view.
  function cardHtml(i) {
    const up = i.deltaPct >= 0;
    const sign = up ? '+' : '';
    const conf = (i.confidence || '').toLowerCase();
    const vol = i.volumeCurrent ? `<span class="card-vol">${fmtInt(i.volumeCurrent)} pax</span>` : '';
    const isWatched = watched.has(i.id);
    const star = `<button class="card-star ${isWatched ? 'on' : ''}" data-id="${i.id}" title="${isWatched ? 'Remove from watched' : 'Add to watched'}" aria-label="Watch">
      <svg viewBox="0 0 24 24" fill="${isWatched ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>`;
    return `
      <div class="card ${i.id === activeId ? 'active' : ''}" data-id="${i.id}">
        ${star}
        <div class="card-top">
          <span class="card-route">${i.origin.name.toUpperCase()} ↔ ${i.dest.name.toUpperCase()}</span>
          <span class="card-delta ${up ? 'up' : 'down'}">${sign}${(+i.deltaPct).toFixed(1)}%</span>
        </div>
        <div class="card-headline">${escapeHtml(i.headline || '')}</div>
        <div class="card-reading">${escapeHtml(i.reading || '')}</div>
        <div class="card-meta">
          <span class="theme-tag ${i.theme || 'business'}">${(i.theme || 'business').replace('-', ' ')}</span>
          <span class="card-period">${escapeHtml(i.period || '')}</span>
          ${conf ? `<span class="card-period"><span class="card-conf-dot ${conf}"></span>${conf}</span>` : ''}
          ${vol}
        </div>
      </div>
    `;
  }

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function drawArcs(visible) {
    // Two arcs per corridor: a solid faint base + an animated flowing overlay.
    // The overlay's dash speed is inversely proportional to volume — bigger
    // corridors "flow" faster, mimicking IEA-style energy flow maps.
    const arcs = [];

    visible.forEach(i => {
      const up = i.deltaPct >= 0;
      const baseHex = up ? '#7fa88c' : '#b87857';
      const stroke = Math.min(0.35 + Math.abs(i.deltaPct) * 0.05, 1.3);

      // Faded base trace — shows the whole corridor path always.
      arcs.push({
        id: i.id, layer: 'base',
        startLat: i.origin.lat, startLng: i.origin.lng,
        endLat:   i.dest.lat,   endLng:   i.dest.lng,
        color: [withAlpha(baseHex, 0.22), withAlpha(baseHex, 0.22)],
        stroke: stroke * 0.85, baseStroke: stroke, baseColor: baseHex,
        dashLen: 1, dashGap: 0, animMs: 0,
      });

      // Flowing overlay — animated dashes traveling origin → destination.
      // Speed keyed to volume so busy corridors visibly pulse faster.
      const vol = i.volumeCurrent || 100000;
      const animMs = Math.max(1200, Math.min(4500, 6_000_000 / vol));
      arcs.push({
        id: i.id, layer: 'flow',
        startLat: i.origin.lat, startLng: i.origin.lng,
        endLat:   i.dest.lat,   endLng:   i.dest.lng,
        color: [withAlpha(baseHex, 0.9), withAlpha(baseHex, 0.15)],
        stroke, baseStroke: stroke, baseColor: baseHex,
        dashLen: 0.22, dashGap: 0.78,
        initGap: Math.random(),
        animMs,
      });

      arcById.set(i.id, { baseColor: baseHex, baseStroke: stroke });
    });

    globe.arcsData(arcs);

    // Bright dot at destination end — reads as the "head" of the flow.
    const points = [];
    visible.forEach(i => {
      const color = i.deltaPct >= 0 ? '#a3c1ac' : '#cf9578';
      points.push({ lat: i.origin.lat, lng: i.origin.lng, color, id: i.id, kind: 'origin' });
      points.push({ lat: i.dest.lat,   lng: i.dest.lng,   color, id: i.id, kind: 'dest' });
    });
    globe
      .pointsData(points)
      .pointAltitude(p => p.kind === 'dest' ? 0.012 : 0.006)
      .pointRadius(p => p.kind === 'dest' ? 0.45 : 0.28)
      .pointColor('color');
  }

  function setHover(id) {
    if (hoverId === id) return;
    hoverId = id;
    applyHighlight();
  }

  function applyHighlight() {
    document.querySelectorAll('.card').forEach(el => {
      el.classList.toggle('hover', el.dataset.id === hoverId && hoverId !== activeId);
    });
    if (!arcById.size) return;
    const anyFocus = !!(hoverId || activeId);
    globe
      .arcColor(a => {
        const rec  = arcById.get(a.id);
        const base = (rec && rec.baseColor) || '#7fa88c';
        const isActive = a.id === activeId;
        const isHover  = a.id === hoverId;
        // On the base layer, colors stay faint. On the flow layer, they go bright.
        if (a.layer === 'base') {
          const alpha = isActive ? 0.4 : (isHover ? 0.35 : (anyFocus ? 0.08 : 0.22));
          return [withAlpha(base, alpha), withAlpha(base, alpha)];
        }
        const startA = isActive ? 1.0 : (isHover ? 0.95 : (anyFocus ? 0.15 : 0.9));
        const endA   = isActive ? 0.4 : (isHover ? 0.35 : (anyFocus ? 0.04 : 0.15));
        return [withAlpha(base, startA), withAlpha(base, endA)];
      })
      .arcStroke(a => {
        const rec  = arcById.get(a.id);
        const base = (rec && rec.baseStroke) || 0.5;
        const boost = (a.id === activeId || a.id === hoverId) ? 0.6 : 0;
        return (a.layer === 'base' ? base * 0.85 : base) + boost;
      });
  }

  function withAlpha(hex, alpha) {
    const h = hex.replace('#', '');
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${alpha})`;
  }

  function selectInsight(id) {
    activeId = id === activeId ? null : id;
    render();
    const i = insights.find(x => x.id === id);
    if (i && activeId) {
      globe.controls().autoRotate = false;
      const midLat = (i.origin.lat + i.dest.lat) / 2;
      const midLng = (i.origin.lng + i.dest.lng) / 2;
      const span = Math.max(Math.abs(i.origin.lat - i.dest.lat), Math.abs(i.origin.lng - i.dest.lng));
      const altitude = Math.min(2.2, Math.max(0.8, span / 40 + 0.8));
      globe.pointOfView({ lat: midLat, lng: midLng, altitude }, 900);
      if (window.innerWidth <= 780) document.body.classList.remove('sidebar-open');
      openDrawer(id);
    } else {
      closeDrawer();
    }
  }

  // ---- Drawer ----
  const drawer = document.getElementById('drawer');
  const drawerBackdrop = document.getElementById('drawer-backdrop');

  function openDrawer(id) {
    const i = insights.find(x => x.id === id);
    if (!i) return;
    renderDrawer(i);
    drawer.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    drawerBackdrop.classList.add('open');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    drawerBackdrop.classList.remove('open');
    if (activeId) { activeId = null; render(); }
  }
  document.getElementById('drawer-close').addEventListener('click', closeDrawer);
  drawerBackdrop.addEventListener('click', closeDrawer);

  function renderDrawer(i) {
    const up = i.deltaPct >= 0;
    const sign = up ? '+' : '';
    const isWatched = watched.has(i.id);
    document.getElementById('drawer-route').textContent =
      `${i.origin.name} ↔ ${i.dest.name}${i.period ? ' · ' + i.period : ''}`;
    document.getElementById('drawer-headline').textContent = i.headline || '—';

    const vc = i.volumeCurrent || 0;
    const vp = i.volumePrior || 0;
    const maxV = Math.max(vc, vp, 1);
    const barsHtml = (vc || vp) ? `
      <div class="vol-compare">
        <div class="vol-row">
          <span class="vol-row-label">current</span>
          <div class="vol-bar-outer"><div class="vol-bar-fill current" style="width:${(vc/maxV*100).toFixed(1)}%"></div></div>
          <span class="vol-row-num">${fmtInt(vc)}</span>
        </div>
        <div class="vol-row">
          <span class="vol-row-label">prior yr</span>
          <div class="vol-bar-outer"><div class="vol-bar-fill prior" style="width:${(vp/maxV*100).toFixed(1)}%"></div></div>
          <span class="vol-row-num">${fmtInt(vp)}</span>
        </div>
      </div>` : '';

    const body = document.getElementById('drawer-body');
    body.innerHTML = `
      <div class="drawer-hero">
        <div class="drawer-hero-delta ${up ? 'up' : 'down'}">${sign}${(+i.deltaPct).toFixed(1)}%</div>
        <div class="drawer-hero-sub">${escapeHtml(i.period || '')} · ${(i.theme || 'business').replace('-', ' ')}${i.confidence ? ' · ' + i.confidence + ' confidence' : ''}</div>
        ${barsHtml}
      </div>

      <div class="drawer-section">
        <h3>Reading</h3>
        <div class="drawer-reading">${escapeHtml(i.reading || 'No reading available.')}</div>
      </div>

      <div class="drawer-section">
        <h3>Corridor</h3>
        <div class="drawer-meta-grid">
          <div class="drawer-meta-cell"><div class="k">Origin</div><div class="v"><span class="country-chip" data-country="${escapeHtml(i.origin.name)}">${escapeHtml(i.origin.name)}</span></div></div>
          <div class="drawer-meta-cell"><div class="k">Destination</div><div class="v"><span class="country-chip" data-country="${escapeHtml(i.dest.name)}">${escapeHtml(i.dest.name)}</span></div></div>
          <div class="drawer-meta-cell"><div class="k">Volume (curr)</div><div class="v">${vc ? vc.toLocaleString() + ' pax' : '—'}</div></div>
          <div class="drawer-meta-cell"><div class="k">Volume (prior)</div><div class="v">${vp ? vp.toLocaleString() + ' pax' : '—'}</div></div>
        </div>
      </div>

      <div class="drawer-section">
        <h3>Actions</h3>
        <div class="drawer-actions">
          <button class="drawer-btn ${isWatched ? 'ok' : 'ghost'}" id="dw-watch">
            <svg viewBox="0 0 24 24" fill="${isWatched ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            ${isWatched ? 'Watched' : 'Watch'}
          </button>
          <button class="drawer-btn ghost" id="dw-copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy for note
          </button>
          <button class="drawer-btn ghost" id="dw-export-one">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Export row
          </button>
        </div>
        <div style="font-size:0.7rem;color:var(--mute);margin-top:0.6rem;line-height:1.5">
          "Copy for note" produces a citation-ready sentence with source attribution and retrieval date.
        </div>
      </div>

      <div class="drawer-section">
        <h3>Related</h3>
        ${relatedCorridorsHtml(i)}
      </div>
    `;

    document.getElementById('dw-watch').addEventListener('click', () => toggleWatch(i.id));
    document.getElementById('dw-copy').addEventListener('click', e => copyCitation(i, e.currentTarget));
    document.getElementById('dw-export-one').addEventListener('click', () => exportCsv([i], `ovrhead_${i.id}.csv`));
    body.querySelectorAll('.country-chip').forEach(el => {
      el.addEventListener('click', () => filterToCountry(el.dataset.country));
    });
    body.querySelectorAll('[data-related-id]').forEach(el => {
      el.addEventListener('click', () => selectInsight(el.dataset.relatedId));
    });
  }

  function relatedCorridorsHtml(i) {
    const related = insights
      .filter(x => x.id !== i.id && (x.origin.code === i.origin.code || x.dest.code === i.origin.code || x.origin.code === i.dest.code || x.dest.code === i.dest.code))
      .slice(0, 4);
    if (!related.length) return '<div style="font-size:0.8rem;color:var(--mute)">No overlapping corridors in current dataset.</div>';
    return related.map(r => {
      const up = r.deltaPct >= 0;
      return `<div data-related-id="${r.id}" style="display:flex;justify-content:space-between;padding:0.5rem 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:0.82rem;gap:0.5rem">
        <span style="color:var(--dim)">${escapeHtml(r.origin.name)} ↔ ${escapeHtml(r.dest.name)}</span>
        <span style="color:${up ? 'var(--brass)' : 'var(--down)'};font-family:'JetBrains Mono',monospace">${up ? '+' : ''}${(+r.deltaPct).toFixed(1)}%</span>
      </div>`;
    }).join('');
  }

  function filterToCountry(name) {
    // From the drawer, jumping to a country focuses that node.
    focusOn({ kind: 'country', id: name, name });
    closeDrawer();
  }

  // ---- Citation + CSV ----
  function copyCitation(i, btn) {
    const now = new Date().toISOString().slice(0, 10);
    const vol = i.volumeCurrent ? `${i.volumeCurrent.toLocaleString()} passengers` : 'material volume';
    const text = `OvrHead: ${i.origin.name} ↔ ${i.dest.name} ${i.deltaPct >= 0 ? 'up' : 'down'} ${Math.abs(i.deltaPct).toFixed(1)}% YoY (${i.period}, ${vol}). ${i.reading || ''} Source: ${meta.source || 'Eurostat'} via OvrHead, retrieved ${now}.`;
    (navigator.clipboard && navigator.clipboard.writeText
      ? navigator.clipboard.writeText(text)
      : Promise.reject('no clipboard')
    ).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = '✓ Copied';
      btn.classList.add('ok');
      setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('ok'); }, 1600);
    }).catch(() => alert(text));
  }

  function exportCsv(rows, filename = 'ovrhead_signals.csv') {
    if (!rows.length) return;
    const cols = ['id','origin_name','origin_code','dest_name','dest_code','period','delta_pct','volume_current','volume_prior','theme','confidence','headline','reading'];
    const esc = v => {
      if (v == null) return '';
      const s = String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const body = rows.map(r => [
      r.id, r.origin.name, r.origin.code, r.dest.name, r.dest.code,
      r.period, r.deltaPct, r.volumeCurrent ?? '', r.volumePrior ?? '',
      r.theme, r.confidence, r.headline, r.reading,
    ].map(esc).join(','));
    const csv = [cols.join(','), ...body].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 100);
  }

  document.getElementById('btn-export').addEventListener('click', () => {
    const visible = sortInsights(insights.filter(passesFilter));
    exportCsv(visible, `ovrhead_${new Date().toISOString().slice(0,10)}.csv`);
  });
  document.getElementById('btn-clear-watch').addEventListener('click', () => {
    if (!watched.size) return;
    if (confirm(`Clear ${watched.size} watched signal(s)?`)) {
      watched.clear(); saveWatched(); render();
    }
  });

  // ---- Filter bindings ----
  document.querySelectorAll('.chip-row').forEach(row => {
    const key = row.dataset.filter;
    row.addEventListener('click', e => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      row.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      filters[key] = btn.dataset.value;
      render();
    });
  });

  // ── Focus input + autocomplete (countries · regions · airports) ─────────
  const focusInput  = document.getElementById('focus-input');
  const focusClear  = document.getElementById('focus-clear');
  const focusSuggest = document.getElementById('focus-suggest');
  let suggestIndex = 0;
  let suggestOptions = [];

  function buildIndex() {
    // countries — from what's actually in the insights
    const countries = new Set();
    const airports = new Map();  // "Frankfurt (FRA)" → { iataOrIcao, name }
    insights.forEach(i => {
      [i.origin, i.dest].forEach(p => {
        if (p.country) countries.add(p.country);
        if (p.type === 'city' && p.name.match(/\(([A-Z0-9]+)\)/)) {
          const m = p.name.match(/\(([A-Z0-9]+)\)/);
          if (m) airports.set(p.name, { iataOrIcao: m[1], name: p.name });
        }
      });
    });
    return {
      countries: [...countries].sort().map(n => ({ kind: 'country', id: n, name: n })),
      regions:   Object.keys(REGIONS).sort().map(n => ({ kind: 'region', id: n, name: n })),
      airports:  [...airports.values()].sort((a, b) => a.name.localeCompare(b.name))
                    .map(a => ({ kind: 'airport', id: a.name, name: a.name, iataOrIcao: a.iataOrIcao })),
    };
  }

  function renderSuggest(query = '') {
    const idx = buildIndex();
    const q = normName(query);
    const filter = arr => q ? arr.filter(o => normName(o.name).includes(q) || normName(o.id).includes(q)) : arr;
    const countries = filter(idx.countries).slice(0, 8);
    const regions   = filter(idx.regions).slice(0, 6);
    const airports  = filter(idx.airports).slice(0, 6);

    suggestOptions = [...regions, ...countries, ...airports];   // regions first — smallest set, easy to spot
    if (!suggestOptions.length) {
      focusSuggest.innerHTML = `<div class="fs-empty">No match. Try a country, region, or airport city.</div>`;
      focusSuggest.hidden = false;
      return;
    }
    let html = '';
    if (regions.length)   html += `<div class="fs-group">Regions</div>` + regions.map((o, i) => optHtml(o, i)).join('');
    if (countries.length) html += `<div class="fs-group">Countries</div>` + countries.map((o, i) => optHtml(o, regions.length + i)).join('');
    if (airports.length)  html += `<div class="fs-group">Airports</div>` + airports.map((o, i) => optHtml(o, regions.length + countries.length + i)).join('');
    focusSuggest.innerHTML = html;
    focusSuggest.hidden = false;
    suggestIndex = 0;
    updateSuggestActive();
    focusSuggest.querySelectorAll('.fs-option').forEach(el => {
      el.addEventListener('mousedown', e => {   // mousedown so it fires before input blur
        e.preventDefault();
        const idx = Number(el.dataset.idx);
        pickSuggest(idx);
      });
    });
  }
  function optHtml(o, i) {
    return `<div class="fs-option" data-idx="${i}"><span>${escapeHtml(o.name)}</span><span class="fs-kind">${o.kind}</span></div>`;
  }
  function updateSuggestActive() {
    focusSuggest.querySelectorAll('.fs-option').forEach((el, i) => {
      el.classList.toggle('active', i === suggestIndex);
    });
  }
  function pickSuggest(i) {
    if (i < 0 || i >= suggestOptions.length) return;
    const opt = suggestOptions[i];
    focusOn(opt);
    focusSuggest.hidden = true;
    focusInput.blur();
  }

  focusInput.addEventListener('focus', () => renderSuggest(focusInput.value));
  focusInput.addEventListener('input', () => renderSuggest(focusInput.value));
  focusInput.addEventListener('blur', () => setTimeout(() => { focusSuggest.hidden = true; }, 150));
  focusInput.addEventListener('keydown', e => {
    if (focusSuggest.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); suggestIndex = Math.min(suggestIndex + 1, suggestOptions.length - 1); updateSuggestActive(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); suggestIndex = Math.max(suggestIndex - 1, 0); updateSuggestActive(); }
    else if (e.key === 'Enter')   { e.preventDefault(); pickSuggest(suggestIndex); }
    else if (e.key === 'Escape')  { e.preventDefault(); focusSuggest.hidden = true; focusInput.blur(); }
  });
  focusClear.addEventListener('click', () => { clearFocus(); focusInput.focus(); });

  document.getElementById('mobile-toggle').addEventListener('click', () => {
    document.body.classList.toggle('sidebar-open');
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (drawer.classList.contains('open')) { closeDrawer(); return; }
      if (activeId) { selectInsight(activeId); return; }
      if (currentFocus()) { goBack(); return; }
    }
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      focusInput.focus();
    }
  });

  // ---- Data load ----
  function formatUpdated(iso) {
    if (!iso) return '—';
    try {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const days = Math.floor((Date.now() - d.getTime()) / 86400000);
      if (days <= 0) return 'updated today';
      if (days === 1) return 'updated 1d ago';
      return `updated ${days}d ago`;
    } catch { return iso; }
  }

  fetch('data/insights.json')
    .then(r => r.json())
    .then(json => {
      insights = json.insights || [];
      meta = json.meta || {};
      document.getElementById('updated-pill').textContent = formatUpdated(meta.updated);
      render();
    })
    .catch(err => {
      document.getElementById('feed').innerHTML =
        `<div class="empty">Could not load insights.<br><span style="font-size:0.7rem">${err.message}</span></div>`;
    });
</script>
</body>
</html>
