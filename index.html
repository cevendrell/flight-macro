<!-- Theme is resolved before first paint so a stored choice never flashes the
     other theme. Inline and synchronous on purpose. -->
<script>
  try {
    var t = localStorage.getItem('ovrhead.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

<style>
/* ─────────────────────────────────────────────────────────────────────────
   Tokens.

   The palette is LayOvr's, used as documented there: navy dominant, amber as
   the warm action accent, burgundy reserved strictly for negative/critical
   signals, periwinkle as the secondary voice on navy, and a warm off-white
   ground with lavender-grey hairlines.

   Where OvrHead departs is the night theme. LayOvr is a light-only app; here
   the dark theme is built by promoting navy from accent to ground and letting
   LayOvr's own on-navy pair (#EEF1F8 / #82A5D6) carry the text. Same family,
   its own room — an observatory after dark.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --bg:        #f5f3f0;   /* LayOvr ink — warm off-white */
  --surface:   #ffffff;   /* LayOvr surface */
  --sunken:    #efece7;
  --ink:       #05164d;   /* LayOvr navy — also textPrimary */
  --ink-2:     #777586;   /* LayOvr textSecondary — muted purple-grey */
  --mute:      #8e8b9e;   /* LayOvr textTertiary */
  --faint:     #aca9bb;
  --rule:      #e2dfe9;   /* LayOvr hairline — lavender-grey */
  --rule-2:    #cdc8da;
  --accent:    #8a5a33;   /* LayOvr amber — action / CTA */
  --accent-bg: rgba(138,90,51,.09);
  --navy:      #05164d;
  --navy-deep: #05164d;
  --topbar:    #05164d;   /* pinned — nav bar is always this, both themes */
  --on-navy:   #eef1f8;   /* LayOvr onNavy */
  --on-navy-2: #82a5d6;   /* LayOvr onNavySub — periwinkle */
  --rise:      #2e875e;   /* LayOvr success */
  --fall:      #7d2b2d;   /* LayOvr burgundy — danger / critical ONLY */
  --rise-bg:   rgba(46,135,94,.10);
  --fall-bg:   rgba(125,43,45,.09);
  /* LayOvr reserves its darkest value for the pivotal CTAs. On the warm
     ground that is navy; on the navy ground it has to be the amber. */
  --cta-bg:       #05164d;
  --cta-fg:       #eef1f8;
  --cta-hover-fg: #ffffff;
  --bar:          #6b76a0;   /* muted navy — chart bars on the warm ground */

  /* One sans, weight does the work — the same logic as LayOvr's BrandFont.
     Archivo is squarer and a touch narrower than a default grotesque, which
     keeps dense tables legible and gives headlines some spine. */
  --sans:  'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Two radii only, per LayOvr — but pulled in from 10/16, which made every
     list read as an app card rather than a record. */
  --r-control: 7px;
  --r-card:    11px;

  --rail:  212px;
  --pad:   clamp(20px, 3.5vw, 44px);
  --measure: 68ch;
  color-scheme: light;   /* native controls follow the theme */
}

/* Night: page goes near-black — navy stays only in the pinned top bar. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0c0c0e;   /* near-black, no blue cast */
    --surface:   #191919;   /* card surface — dark grey, not navy */
    --sunken:    #060606;
    --ink:       #eef1f8;
    --ink-2:     #aab2c8;
    --mute:      #737b96;
    --faint:     #4d5470;
    --rule:      rgba(210,210,220,.12);   /* neutral, not periwinkle-tinted */
    --rule-2:    rgba(210,210,220,.22);
    --accent:    #d2955c;
    --accent-bg: rgba(210,149,92,.14);
    --navy:      #191919;   /* navy token now points to dark-grey surface in dark mode */
    --on-navy:   #eef1f8;
    --on-navy-2: #82a5d6;
    --rise:      #5cc191;
    --fall:      #d97b73;
    --rise-bg:   rgba(92,193,145,.14);
    --fall-bg:   rgba(217,123,115,.14);
    --cta-bg:       #d2955c;
    --cta-fg:       #1a0f05;
    --cta-hover-fg: #1a0f05;
    --bar:          #6a7fa8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0c0c0e; --surface:#191919; --sunken:#060606;
  --ink:#eef1f8; --ink-2:#aab2c8; --mute:#737b96; --faint:#4d5470;
  --rule:rgba(210,210,220,.12); --rule-2:rgba(210,210,220,.22);
  --accent:#d2955c; --accent-bg:rgba(210,149,92,.14);
  --navy:#191919; --on-navy:#eef1f8; --on-navy-2:#82a5d6;
  --rise:#5cc191; --fall:#d97b73;
  --rise-bg:rgba(92,193,145,.14); --fall-bg:rgba(217,123,115,.14);
  --cta-bg:#d2955c; --cta-fg:#1a0f05; --cta-hover-fg:#1a0f05; --bar:#6a7fa8;
  color-scheme: dark;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:16px; -webkit-text-size-adjust:100%; }
body {
  font-family:var(--sans); font-weight:400; line-height:1.6;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
a { color:inherit; }
button, input, textarea, select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }
@media (prefers-reduced-motion:reduce) { *{animation:none!important;transition:none!important} }

/* ── Shell ─────────────────────────────────────────────────────────────── */
#shell { min-height:100vh; }

/* Top bar in LayOvr's navy, using that project's on-navy pair. */
#topbar { position:sticky; top:0; z-index:80; background:var(--topbar); color:var(--on-navy); }
.bar { max-width:1240px; margin:0 auto; padding:0 var(--pad);
       display:flex; align-items:center; gap:20px; min-height:56px; flex-wrap:wrap; }
/* The bar needs three rows on a phone. Pinning a quarter of the screen for it
   is a worse trade than making the reader scroll up for the nav, so below this
   width it scrolls away with the page. */
@media (max-width:760px){
  #topbar { position:static; }
  .bar { padding:10px var(--pad); gap:10px; }
  .mark { order:0; }
  #nav  { order:2; }
}

.mark { display:flex; align-items:baseline; gap:9px; text-decoration:none; flex-shrink:0; }
.mark b { font-family:var(--mono); font-size:.82rem; font-weight:600;
          letter-spacing:.24em; color:var(--on-navy); }
.mark span { font-size:.68rem; color:var(--on-navy-2); }
@media (max-width:520px){ .mark span{ display:none } }

#nav { display:flex; gap:2px; flex-wrap:wrap; }
#nav a { font-size:.85rem; color:var(--on-navy-2); text-decoration:none;
         padding:7px 12px; border-radius:var(--r-control); white-space:nowrap; }
#nav a:hover { color:var(--on-navy); background:rgba(238,241,248,.09); }
/* The active background is drawn by #nav-pill, which slides — see Motion. */
#nav a.on { color:var(--navy); font-weight:600; }

/* Freshness is a permanent fixture of the chrome, not a footnote — every page
   should say how current the record is without the reader going looking. */
.freshness { margin-left:auto; font-family:var(--mono); font-size:.68rem;
             color:var(--on-navy-2); text-decoration:none; white-space:nowrap;
             display:flex; align-items:center; gap:7px;
             padding:6px 11px; border-radius:var(--r-control);
             border:1px solid rgba(130,165,214,.28); }
.freshness:hover { border-color:var(--on-navy-2); color:var(--on-navy); }
.freshness .dot { width:6px; height:6px; border-radius:50%; background:var(--rise);
                  flex-shrink:0; box-shadow:0 0 0 3px rgba(46,135,94,.22); }
.freshness.stale .dot { background:var(--fall); box-shadow:0 0 0 3px rgba(217,123,115,.22); }
.freshness b { font-weight:500; color:var(--on-navy); }
@media (max-width:760px){ .freshness{ margin-left:0; order:4 } }

#main { padding:0 var(--pad) 100px; min-width:0; }
.wrap { max-width:1240px; margin:0 auto; }

/* ── Search ────────────────────────────────────────────────────────────── */
#search-wrap { position:relative; flex:0 1 210px; }
@media (max-width:760px){ #search-wrap{ flex:1 1 160px; order:3 } }
#search {
  width:100%; background:rgba(238,241,248,.09); border:1px solid rgba(130,165,214,.28);
  border-radius:var(--r-control); padding:7px 11px; font-size:.78rem; color:var(--on-navy);
}
#search::placeholder { color:var(--on-navy-2); opacity:.68; }
#search:focus { border-color:var(--on-navy-2); background:rgba(238,241,248,.14); }
#results {
  position:absolute; z-index:60; left:0; right:0; top:calc(100% + 7px); min-width:240px;
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-card); max-height:340px; overflow-y:auto; display:none;
  box-shadow:0 10px 34px rgba(5,22,77,.20); padding:5px;
}
#results.open { display:block; }
#results a {
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  padding:8px 10px; text-decoration:none; font-size:.79rem;
  border-radius:var(--r-control); color:var(--ink);
}
#results a:hover, #results a.cursor { background:var(--accent-bg); color:var(--accent); }
#results .k { font-family:var(--mono); font-size:.61rem; color:var(--mute);
              text-transform:uppercase; letter-spacing:.09em; }

/* ── Page header ───────────────────────────────────────────────────────── */
.crumbs { font-size:.67rem; font-weight:600; color:var(--mute); letter-spacing:.11em;
          text-transform:uppercase; padding:28px 0 0; display:flex; gap:7px; flex-wrap:wrap; }
.crumbs a { text-decoration:none; color:var(--mute); }
.crumbs a:hover { color:var(--accent); }
.crumbs em { font-style:normal; color:var(--faint); }

h1 { font-weight:600; font-size:clamp(1.95rem,4.4vw,2.85rem);
     line-height:1.08; letter-spacing:-.032em; margin:11px 0 0;
     text-wrap:balance; max-width:19ch; }
h1 .q { color:var(--accent); }
.lede { font-size:.98rem; font-weight:400; color:var(--ink-2); max-width:var(--measure);
        margin-top:14px; line-height:1.6; }
.page-head { padding-bottom:26px; border-bottom:1px solid var(--rule); margin-bottom:28px; }

h2 { font-weight:600; font-size:1.22rem; letter-spacing:-.022em;
     margin:0 0 3px; text-wrap:balance; line-height:1.24; }
h3 { font-size:.94rem; font-weight:600; margin:0 0 6px; }
p { max-width:var(--measure); }

section { margin-bottom:48px; }
.sec-head { display:flex; align-items:baseline; justify-content:space-between;
            gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.sec-note { font-size:.8rem; color:var(--mute); max-width:52ch; }
/* LayOvr's eyebrow: uppercase, semibold, 1.2pt tracking. */
.eyebrow { font-size:.68rem; font-weight:600; letter-spacing:.11em;
           text-transform:uppercase; color:var(--accent); margin-bottom:8px; }

/* ── Readout strip ─────────────────────────────────────────────────────── */
.readout { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
           border-top:1px solid var(--ink); border-bottom:1px solid var(--rule); }
.ro { padding:14px 16px 14px 0; border-right:1px solid var(--rule); }
.ro:last-child { border-right:none; }
.ro-v { font-family:var(--mono); font-size:1.5rem; font-weight:500; line-height:1.05;
        letter-spacing:-.025em; color:var(--ink); }
/* Readouts are sized for figures. A word set at that size looks like a
   mistake, so text values step down into the body face. */
.ro-v.txt { font-family:var(--sans); font-size:1.02rem; font-weight:600;
            letter-spacing:0; line-height:1.25; }
.ro-l { font-size:.71rem; color:var(--ink-2); margin-top:6px; }
.ro-s { font-size:.67rem; color:var(--mute); font-family:var(--mono); margin-top:3px; }

/* ── Signal rows (the insight grammar) ─────────────────────────────────── */
/* Flat, hairline-separated rows — a record to scan, not a stack of cards.
   The open state gets a tint and an accent edge instead of card chrome. */
.signals { border-top:1px solid var(--rule-2); }
.sig { border-bottom:1px solid var(--rule); border-left:2px solid transparent; }
.sig:hover { background:var(--surface); }
.sig.open { background:var(--surface); border-left-color:var(--accent); }
.sig-top {
  display:grid; grid-template-columns:128px minmax(0,1fr) auto; gap:18px;
  align-items:start; padding:16px 14px; width:100%; background:none; border:none;
  text-align:left; cursor:pointer; color:inherit;
}
@media (max-width:680px){ .sig-top{ grid-template-columns:1fr; gap:8px; padding:14px 12px } }
.sig-metric { font-family:var(--mono); font-size:1.5rem; font-weight:500; line-height:1;
              letter-spacing:-.035em; color:var(--ink); }
.sig-metric.up { color:var(--rise); } .sig-metric.down { color:var(--fall); }
.sig-mlabel { font-size:.67rem; color:var(--mute); margin-top:5px; line-height:1.35; }
.sig-title { font-size:1.02rem; font-weight:600; line-height:1.3; letter-spacing:-.017em;
             text-wrap:balance; color:var(--ink); }
.sig-sub { font-size:.79rem; color:var(--ink-2); margin-top:4px; }
.sig-where { font-family:var(--mono); font-size:.67rem; color:var(--mute); margin-top:4px; }
.sig-right { display:flex; align-items:center; gap:11px; }
@media (max-width:680px){ .sig-right{ justify-content:flex-start } }
.chev { font-family:var(--mono); color:var(--faint); font-size:.85rem;
        transition:transform .16s ease; }
.sig[open] .chev, .sig.open .chev { transform:rotate(90deg); }

/* Open/closed state lives in the Motion section at the foot of this sheet —
   the panel animates its height, so it cannot be display:none. */
.sig-grid { display:grid; grid-template-columns:128px minmax(0,1fr); gap:18px; }
@media (max-width:680px){ .sig-grid{ grid-template-columns:1fr } }
.sig-fields { display:flex; flex-direction:column; gap:16px; max-width:var(--measure); }
.field-k { font-size:.65rem; font-weight:600; letter-spacing:.11em;
           text-transform:uppercase; color:var(--mute); margin-bottom:5px; }
.field-v { font-size:.88rem; color:var(--ink); line-height:1.62; }
.field-v.caveat { color:var(--ink-2); }

/* ── Confidence ────────────────────────────────────────────────────────── */
.conf { font-size:.62rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
        padding:4px 9px; border:1px solid var(--rule-2); border-radius:var(--r-control);
        color:var(--ink-2); white-space:nowrap; }
.conf[data-c="strong"]   { color:var(--rise); border-color:var(--rise); background:var(--rise-bg); }
.conf[data-c="moderate"] { color:var(--accent); border-color:var(--accent); background:var(--accent-bg); }
.conf[data-c="observed"] { color:var(--ink-2); }
.conf[data-c="early"]    { color:var(--mute); border-style:dashed; }

/* ── Tables ────────────────────────────────────────────────────────────── */
.tbl-wrap { overflow-x:auto; border-top:1px solid var(--ink); }
table { width:100%; border-collapse:collapse; font-size:.83rem; }
th { font-size:.63rem; letter-spacing:.1em; text-transform:uppercase;
     color:var(--mute); text-align:left; font-weight:600; padding:10px 12px 9px 0;
     border-bottom:1px solid var(--rule); white-space:nowrap; }
th.num, td.num { text-align:right; }
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { color:var(--ink); }
th .dir { color:var(--accent); }
td { padding:8px 12px 8px 0; border-bottom:1px solid var(--rule); vertical-align:baseline; }
tbody tr:hover { background:var(--accent-bg); }
td.num, .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
td a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rule-2); }
td a:hover { color:var(--accent); border-bottom-color:var(--accent); }
.code { font-family:var(--mono); font-size:.76rem; color:var(--accent); }
.dim { color:var(--mute); }
.faint { color:var(--faint); }
.unknown { color:var(--mute); font-style:italic; font-size:.8rem; }

/* Share bar sits behind the number, not beside it */
.barcell { position:relative; }
.barcell .fill { position:absolute; right:0; top:50%; transform:translateY(-50%);
                 height:15px; background:var(--accent-bg); border-right:2px solid var(--accent);
                 pointer-events:none; }
.barcell span { position:relative; }

/* ── Charts ────────────────────────────────────────────────────────────── */
.chart-fig { margin:0; }
.chart { display:flex; align-items:flex-end; gap:3px; height:150px;
         border-bottom:1px solid var(--ink); padding-top:8px; }
.cbar { flex:1; min-width:3px; display:flex; flex-direction:column; justify-content:flex-end;
        height:100%; position:relative; }
.cbar i { display:block; background:var(--bar); width:100%; border-radius:2px 2px 0 0; }
.cbar.hi i { background:var(--accent); }
.cbar.partial i { background:repeating-linear-gradient(45deg,var(--faint),var(--faint) 2px,transparent 2px,transparent 4px); }
.cbar:hover i { background:var(--accent); }
.caxis { display:flex; gap:3px; margin-top:6px; }
.caxis span { flex:1; min-width:3px; font-family:var(--mono); font-size:.6rem;
              color:var(--mute); text-align:center; overflow:hidden; white-space:nowrap; }
.ro-v .u { font-size:.56em; color:var(--mute); margin-left:4px; letter-spacing:0; }
.rhythm { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:24px 34px; }
.rhythm-t { font-size:.67rem; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
            color:var(--mute); margin-bottom:9px; }

/* ── Globe ─────────────────────────────────────────────────────────────── */
#globe-layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:26px;
                align-items:start; }
@media (max-width:960px){ #globe-layout{ grid-template-columns:1fr } }

#globe-stage { position:relative; aspect-ratio:1/1;
               width:100%; max-width:min(100%, 540px); margin:0 auto; }
#globe-canvas { width:100%; height:100%; cursor:grab; touch-action:none; display:block; }
#globe-canvas.dragging { cursor:grabbing; }

/* Labels are positioned each frame from the projected point, so they track
   the sphere as it turns and disappear round the back. */
#globe-overlay { position:absolute; inset:0; pointer-events:none; }
.gl-label { position:absolute; transform:translate(-50%,-50%);
            font-size:.7rem; font-weight:600; letter-spacing:-.01em;
            background:var(--bg); color:var(--ink);
            border:1px solid var(--rule-2); border-radius:var(--r-control);
            padding:3px 8px; white-space:nowrap; pointer-events:auto;
            cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:6px; }
.gl-label:hover { border-color:var(--accent); color:var(--accent); }
.gl-label b { font-family:var(--mono); font-weight:500; color:var(--mute); font-size:.66rem; }
.gl-label:hover b { color:var(--accent); }
.gl-label.hot { border-color:var(--accent); background:var(--accent); color:#fff; }
.gl-label.hot b { color:rgba(255,255,255,.8); }

.globe-legend { display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
                margin-top:10px; font-size:.72rem; color:var(--mute); }
.globe-legend i { display:inline-block; width:8px; height:8px; border-radius:50%;
                  background:var(--accent); margin-right:6px; vertical-align:middle; }
.globe-legend i.home { background:var(--fall); }
.globe-legend i.dot  { width:5px; height:5px; }
.globe-legend i.env  { width:16px; height:2px; border-radius:0; background:var(--ink); }

/* ── Coverage ──────────────────────────────────────────────────────────── */
#cov-stage { position:relative; aspect-ratio:1/1; width:100%;
             max-width:min(100%, 520px); margin:22px auto 0; }
#cov-canvas { width:100%; height:100%; display:block; }

.gl-list { display:flex; flex-direction:column; border-top:1px solid var(--ink); }
.gl-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:11px;
           align-items:baseline; padding:10px 6px; border-bottom:1px solid var(--rule);
           text-decoration:none; color:var(--ink); cursor:pointer; }
.gl-item:hover, .gl-item.hot { background:var(--surface); }
.gl-item .rank { font-family:var(--mono); font-size:.66rem; color:var(--faint); }
.gl-item .nm { font-size:.86rem; font-weight:500; }
.gl-item .sub { font-size:.71rem; color:var(--mute); margin-top:2px; }
.gl-item .n { font-family:var(--mono); font-size:.8rem; color:var(--ink-2); }

/* ── Hierarchy browser ─────────────────────────────────────────────────── */
.hier { display:grid; grid-template-columns:repeat(auto-fit,minmax(228px,1fr)); gap:0 24px; }
.hcol { border-top:1px solid var(--ink); }
.hcol h3 { font-size:.64rem; letter-spacing:.11em; text-transform:uppercase;
           color:var(--mute); font-weight:600; padding:9px 6px 8px;
           border-bottom:1px solid var(--rule); margin-bottom:2px; }
.hrow { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
        padding:7px 6px; border-radius:var(--r-control); text-decoration:none; font-size:.84rem;
        color:var(--ink); }
.hrow:hover { color:var(--accent); background:var(--accent-bg); }
.hrow.on { color:var(--accent); font-weight:600; }
.hrow b { font-weight:inherit; }
.hrow .n { font-family:var(--mono); font-size:.76rem; color:var(--mute); }

/* ── Buttons / controls ────────────────────────────────────────────────── */
.btn {
  font-size:.73rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r-control);
  padding:9px 15px; cursor:pointer; text-decoration:none; display:inline-block;
  color:var(--ink); white-space:nowrap;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
/* LayOvr reserves near-black for its two pivotal CTAs. Here the equivalent
   weight goes to the one action that actually runs something. */
.btn.primary { background:var(--cta-bg); color:var(--cta-fg); border-color:var(--cta-bg); }
.btn.primary:hover { background:var(--accent); border-color:var(--accent); color:var(--cta-hover-fg); }
.btn:disabled { opacity:.45; cursor:default; }

/* The query builder reads as a sentence, so the controls sit inline in the
   prose rather than in a labelled form grid. */
.qb { border-top:1px solid var(--ink); border-bottom:1px solid var(--rule);
      padding:20px 0; margin-bottom:6px; }
.qb-line { display:flex; flex-wrap:wrap; align-items:center; gap:9px;
           font-size:1.06rem; line-height:2.1; }
.qb-t { color:var(--ink-2); }
/* Native select chrome: the browser draws the arrow in the right colour for
   whichever theme is active, which a hand-drawn SVG arrow cannot do without
   a per-theme override that leaks into the un-stamped state. */
.qb select {
  font-family:inherit; font-size:1rem; font-weight:600; color:var(--accent);
  background:var(--accent-bg); border:1px solid transparent;
  border-radius:var(--r-control); padding:5px 8px; cursor:pointer; max-width:100%;
}
.qb select:hover { border-color:var(--accent); }

/* SQL is available, not prominent. */
.adv { margin-top:34px; border-top:1px solid var(--rule); padding-top:14px; }
.adv summary { font-size:.8rem; color:var(--mute); cursor:pointer; list-style:none;
               display:flex; align-items:center; gap:7px; padding:4px 0; }
.adv summary::-webkit-details-marker { display:none; }
.adv summary::before { content:'›'; font-family:var(--mono); transition:transform .16s ease;
                       display:inline-block; }
.adv[open] summary::before { transform:rotate(90deg); }
.adv summary:hover { color:var(--accent); }
.adv-note { font-size:.79rem; color:var(--mute); margin:10px 0 10px; max-width:var(--measure); }
.adv-bar { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }

/* ── SQL ───────────────────────────────────────────────────────────────── */
.sql-box { background:var(--sunken); border:1px solid var(--rule); border-radius:var(--r-control);
           padding:14px 16px; font-family:var(--mono); font-size:.76rem; line-height:1.65;
           white-space:pre; overflow-x:auto; color:var(--ink-2); }
textarea.sql-box { width:100%; resize:vertical; min-height:132px; color:var(--ink);
                   white-space:pre; tab-size:2; }
textarea.sql-box:focus { border-color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.chip { font-size:.78rem; padding:8px 13px; border:1px solid var(--rule-2);
        border-radius:var(--r-control); background:var(--surface); cursor:pointer;
        color:var(--ink-2); text-align:left; text-decoration:none; }
.chip:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }

/* ── Notices ───────────────────────────────────────────────────────────── */
.notice { border-left:3px solid var(--accent); background:var(--accent-bg);
          padding:14px 17px; font-size:.84rem; color:var(--ink-2);
          max-width:var(--measure); line-height:1.6;
          border-radius:0 var(--r-control) var(--r-control) 0; }
/* Burgundy is LayOvr's critical-only colour, so it appears here only when
   something is actually wrong. */
.notice.warn { border-left-color:var(--fall); background:var(--fall-bg); }
.notice b { color:var(--ink); font-weight:600; }
.status { font-family:var(--mono); font-size:.7rem; color:var(--mute); padding:10px 0; }
.empty { font-family:var(--mono); font-size:.76rem; color:var(--mute); padding:24px 0;
         border-bottom:1px solid var(--rule); }

/* ── Boot ──────────────────────────────────────────────────────────────── */
#boot { position:fixed; inset:0; z-index:900; background:var(--bg);
        display:flex; align-items:center; justify-content:center; }
#boot.gone { display:none; }
.boot-in { text-align:center; }
.boot-rings { width:54px; height:54px; margin:0 auto 18px; border-radius:50%;
              border:1px solid var(--rule-2); position:relative; }
.boot-rings::after { content:''; position:absolute; inset:11px; border-radius:50%;
                     border:1.5px solid var(--accent); animation:ping 1.8s ease-out infinite; }
@keyframes ping { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(1.5);opacity:0} }
.boot-t { font-size:.72rem; font-weight:600; letter-spacing:.13em;
          text-transform:uppercase; color:var(--mute); }

.dl { display:flex; flex-direction:column; border-top:1px solid var(--ink); }
.dl-row { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
          padding:11px 4px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
.dl-row:hover { background:var(--surface); }
.dl-row .meta { font-family:var(--mono); font-size:.7rem; color:var(--mute); }
.prose p { margin-bottom:13px; font-size:.9rem; line-height:1.68; }
.prose h3 { margin:28px 0 8px; font-size:.7rem; font-weight:600; letter-spacing:.11em;
            text-transform:uppercase; color:var(--accent); }
.prose ul { margin:0 0 13px 1.1em; max-width:var(--measure); }
.prose li { font-size:.9rem; margin-bottom:5px; line-height:1.62; }

/* ── The week ──────────────────────────────────────────────────────────── */
/* Two neutral colours, because weekday-heavy and weekend-heavy are two kinds
   of activity and neither is the good one. Amber is the working week, muted
   navy is the weekend — the same pair the charts already use. */
.wk { --wkday:var(--accent); --wkend:var(--bar); }

.dbars { border-top:1px solid var(--ink); }
.dbar { display:grid; grid-template-columns:132px minmax(0,1fr) 74px; gap:14px;
        align-items:center; padding:11px 0; border-bottom:1px solid var(--rule);
        text-decoration:none; color:inherit; }
.dbar:hover { background:var(--surface); }
.dbar-k { font-size:.85rem; font-weight:600; }
.dbar-k span { display:block; font-family:var(--mono); font-size:.65rem;
               font-weight:400; color:var(--mute); margin-top:2px; }
/* The axis is the middle of the track, so the eye reads direction before size. */
.dbar-t { position:relative; height:22px; }
.dbar-t::before { content:''; position:absolute; left:50%; top:-4px; bottom:-4px;
                  width:1px; background:var(--rule-2); }
.dbar-t i { position:absolute; top:4px; height:14px; border-radius:2px; }
.dbar-t i.pos { left:50%; background:var(--wkday); }
.dbar-t i.neg { right:50%; background:var(--wkend); }
.dbar-v { font-family:var(--mono); font-size:.9rem; text-align:right; }
.dbar-v.pos { color:var(--accent); }
.dbar-v.neg { color:var(--ink-2); }
/* Fewer than a couple of hundred flights behind it: hatched, so the eye
   discounts it without the row being hidden. */
.dbar.thin .dbar-t i.pos { background:repeating-linear-gradient(45deg,
    var(--accent), var(--accent) 3px, transparent 3px, transparent 6px); }
.dbar.thin .dbar-t i.neg { background:repeating-linear-gradient(45deg,
    var(--bar), var(--bar) 3px, transparent 3px, transparent 6px); }
.dbar.thin .dbar-v { color:var(--mute); }
.dbar-ends { display:grid; grid-template-columns:132px minmax(0,1fr) 74px; gap:14px;
             font-size:.63rem; letter-spacing:.1em; text-transform:uppercase;
             color:var(--mute); font-weight:600; padding-bottom:7px; }
.dbar-ends b { display:flex; justify-content:space-between; font-weight:inherit; }
/* On a phone the track is the point; the label gives up width for it. */
@media (max-width:560px){
  .dbar, .dbar-ends { grid-template-columns:88px minmax(0,1fr) 50px; gap:10px; }
  .dbar-k { font-size:.78rem; }
  .dbar-v { font-size:.8rem; }
  .dbar-ends { font-size:.55rem; }
}

/* Seven days, one row per kind — enough to see freight climb through a week. */
.spark { display:flex; gap:2px; align-items:flex-end; height:44px;
         border-bottom:1px solid var(--rule-2); }
.spark i { flex:1; background:var(--bar); border-radius:1px 1px 0 0; min-height:1px; }
.spark i.we { background:var(--rule-2); }
.spark i.hi { background:var(--accent); }
.wk-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
           gap:26px 34px; }
.wk-dow { display:flex; gap:2px; margin-top:5px; }
.wk-dow span { flex:1; font-family:var(--mono); font-size:.58rem; color:var(--mute);
               text-align:center; }
.kind-note { font-size:.79rem; color:var(--ink-2); line-height:1.6; margin-top:3px; }
/* A quiet label, not a badge — the operator's name is the thing being read. */
.kind-tag { font-family:var(--mono); font-size:.6rem; letter-spacing:.06em;
            text-transform:uppercase; color:var(--mute); border:1px solid var(--rule-2);
            border-radius:4px; padding:1px 5px; white-space:nowrap; margin-left:5px; }
.kind-tag[data-k="cargo"]  { color:var(--accent); border-color:var(--accent); }
.kind-tag[data-k="bizjet"] { color:var(--accent); border-color:var(--rule-2); }

/* ── Skip link ─────────────────────────────────────────────────────────── */
.skip { position:absolute; left:-9999px; top:0; z-index:200;
        background:var(--surface); color:var(--ink); border:1px solid var(--accent);
        border-radius:var(--r-control); padding:10px 16px; font-size:.82rem; font-weight:600; }
.skip:focus { left:var(--pad); top:9px; }

/* ── Theme switch ──────────────────────────────────────────────────────── */
/* Three states, not two: a reader who has never chosen should keep following
   their system, and that has to be visible as its own setting. */
#theme { display:flex; gap:1px; padding:2px; flex-shrink:0;
         border:1px solid rgba(130,165,214,.28); border-radius:var(--r-control); }
#theme button { background:none; border:none; cursor:pointer; line-height:0;
                padding:5px 7px; border-radius:5px; color:var(--on-navy-2); }
#theme button:hover { color:var(--on-navy); background:rgba(238,241,248,.10); }
#theme button[aria-pressed="true"] { color:var(--navy); background:var(--on-navy); }
:root[data-theme="dark"] #theme button[aria-pressed="true"],
:root:not([data-theme="light"]) #theme button[aria-pressed="true"] { color:#05164d; }
#theme svg { width:14px; height:14px; display:block; fill:none;
             stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
/* Rides up beside the wordmark on a phone rather than claiming a row. */
@media (max-width:760px){ #theme{ order:1; margin-left:auto } }

/* ── Table utilities ───────────────────────────────────────────────────── */
th.sortable { position:relative; }
th.sortable:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
.tbl-bar { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
           margin-bottom:11px; }
.tbl-filter { flex:0 1 240px; background:var(--surface); color:var(--ink);
              border:1px solid var(--rule-2); border-radius:var(--r-control);
              padding:7px 11px; font-size:.8rem; }
.tbl-filter::placeholder { color:var(--mute); }
.tbl-filter:focus { border-color:var(--accent); outline:none; }
.tbl-count { font-family:var(--mono); font-size:.7rem; color:var(--mute); }
.tbl-bar .btn { margin-left:auto; }

/* A linked-to signal keeps the open treatment plus a moment of emphasis, so
   somebody arriving from a shared link can see which row was meant. */
.sig.target { box-shadow:inset 3px 0 0 -1px var(--accent); }

/* ── Engine loading ────────────────────────────────────────────────────── */
.engine { display:flex; align-items:center; gap:10px; font-family:var(--mono);
          font-size:.71rem; color:var(--mute); padding:12px 0; }
.engine .track { flex:0 1 160px; height:3px; border-radius:2px;
                 background:var(--rule); overflow:hidden; }
.engine .track i { display:block; height:100%; background:var(--accent);
                   width:0; transition:width .3s ease; }
.engine-rest { display:flex; align-items:center; gap:16px; flex-wrap:wrap;
               padding:14px 0; font-size:.82rem; color:var(--mute);
               max-width:var(--measure); }

/* ── Footer ────────────────────────────────────────────────────────────── */
#foot { border-top:1px solid var(--rule); margin-top:12px; padding:26px 0 0;
        display:flex; gap:16px 28px; flex-wrap:wrap; align-items:baseline;
        font-size:.78rem; color:var(--mute); }
#foot a { color:var(--ink-2); text-decoration:none;
          border-bottom:1px solid var(--rule-2); }
#foot a:hover { color:var(--accent); border-bottom-color:var(--accent); }
#foot .sep { margin-left:auto; font-family:var(--mono); font-size:.68rem; }

/* ── Keyboard hint ─────────────────────────────────────────────────────── */
.kbd { font-family:var(--mono); font-size:.62rem; border:1px solid rgba(130,165,214,.34);
       border-radius:4px; padding:1px 4px; color:var(--on-navy-2);
       position:absolute; right:8px; top:50%; transform:translateY(-50%);
       pointer-events:none; }
#search-wrap:focus-within .kbd, #search-wrap.filled .kbd { display:none; }
@media (max-width:520px){ .kbd{ display:none } }

/* ── noscript ──────────────────────────────────────────────────────────── */
.noscript { max-width:640px; margin:80px auto; padding:0 var(--pad);
            font-size:.95rem; line-height:1.7; color:var(--ink-2); }

/* ═══════════════════════════════════════════════════════════════════════
   MOTION

   No animation library. Every effect below is a CSS transition, a
   scroll-driven reveal, or the Web Animations API — the same primitives the
   React motion kits are built on, without the 40 KB of runtime.

   The rule this page holds itself to: motion has to carry information.
   Something moves because it arrived, changed place, or is still loading.
   Nothing here moves to be noticed.

   The global reduced-motion rule near the top of this stylesheet switches off
   every CSS transition and animation. It cannot reach a script-driven
   animation, so each of those checks the preference itself.
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  /* One easing for entrances (decelerating, lands softly), one for movement
     within the page (symmetric), one duration scale. */
  --ease-out:  cubic-bezier(.22, .61, .36, 1);
  --ease-move: cubic-bezier(.4, .14, .3, 1);
  --t-fast: .16s;
  --t-base: .28s;
  --t-slow: .46s;
}
@property --trail-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

/* ── View transitions ───────────────────────────────────────────────────
   Route changes cross-fade rather than snapping. The chrome is pulled out of
   the snapshot by name so the bar and footer stay put while the page beneath
   them changes — otherwise the whole window blinks. */
@media (prefers-reduced-motion: no-preference) {
  html.route-vt::view-transition-old(root) { animation: vt-out .16s ease-in both; }
  html.route-vt::view-transition-new(root) { animation: vt-in var(--t-base) var(--ease-out) both; }
  html.route-vt #topbar { view-transition-name: topbar; }
  html.route-vt #foot   { view-transition-name: foot; }
  /* Named separately so it is lifted out of the bar's snapshot and the browser
     interpolates it between its old and new position — the slide comes free. */
  html.route-vt #nav-pill { view-transition-name: navpill; }
  ::view-transition-group(navpill) { animation-duration: var(--t-base); }
}
@keyframes vt-out { to { opacity:0 } }
@keyframes vt-in  { from { opacity:0; transform:translateY(6px) } }
/* The theme switch is its own gesture: the new theme wipes out from the
   button that was pressed. The crossfade would fight it, so it is dropped. */
html.theme-vt::view-transition-old(root),
html.theme-vt::view-transition-new(root) { animation:none; mix-blend-mode:normal; }
html.theme-vt::view-transition-old(root) { z-index:1; }
html.theme-vt::view-transition-new(root) { z-index:2; }

/* ── In-view reveal ─────────────────────────────────────────────────────
   The class is added by script, never in the markup: if the observer never
   runs, or motion is turned down, the content was simply never hidden. */
.rise { opacity:0; transform:translateY(9px);
        transition: opacity var(--t-slow) var(--ease-out),
                    transform var(--t-slow) var(--ease-out);
        transition-delay: var(--rise-d, 0ms); }
.rise.in { opacity:1; transform:none; }

/* ── Nav: the pill follows ──────────────────────────────────────────────
   One element sliding between links, instead of a background appearing on the
   new one. It is the shortest possible explanation of what just happened. */
#nav { position:relative; }
#nav-pill { position:absolute; left:0; top:0; z-index:0; border-radius:var(--r-control);
            background:var(--on-navy); opacity:0; pointer-events:none;
            transform:translate3d(0,0,0); transform-origin:0 0;
            transition: transform var(--t-base) var(--ease-move),
                        width var(--t-base) var(--ease-move),
                        height var(--t-base) var(--ease-move),
                        opacity var(--t-fast) linear; }
#nav a { position:relative; z-index:1; transition:color var(--t-fast) linear; }
#nav a.on { color:var(--navy); background:none; font-weight:600; }

/* ── Scroll progress ────────────────────────────────────────────────────
   A hairline of how far through a long page you are. Method and Data are the
   only pages long enough to need it; it costs nothing on the short ones. */
#scrollbar { position:absolute; left:0; bottom:0; height:2px; width:100%;
             transform:scaleX(0); transform-origin:0 50%;
             background:var(--accent); opacity:.85; pointer-events:none; }

/* ── Disclosure ─────────────────────────────────────────────────────────
   The panel animates between 0 and its measured height. The tidier CSS trick —
   transitioning a grid track from 0fr to 1fr — resolves the track to zero here
   however the child is sized, so the height is measured in script instead and
   handed to the Web Animations API. CSS still owns the resting states, so the
   panel is correct even if the animation never runs.

   `visibility` is what keeps a closed panel out of the tab order and the
   accessibility tree; `height: 0` alone would leave its buttons focusable. */
.sig-body { height:0; overflow:hidden;
            visibility:hidden; transition: visibility 0s var(--t-base); }
.sig.open .sig-body { height:auto; visibility:visible; transition-delay:0s; }
.sig-grid { padding:0 14px 20px; }
@media (max-width:680px){ .sig-grid{ padding:0 12px 16px } }

/* ── Shimmer ────────────────────────────────────────────────────────────
   Used in two places and only while something is genuinely pending: over the
   skeleton of a table that is loading, and over the boot line. */
@keyframes shimmer { to { background-position:-200% 0; } }

/* Off-screen but read aloud — a shimmering rectangle says "loading" to a
   sighted reader and nothing at all to a screen reader. */
.sr { position:absolute; width:1px; height:1px; overflow:hidden;
      clip-path:inset(50%); white-space:nowrap; }

.skel { border-top:1px solid var(--rule-2); }
.skel-row { display:grid; grid-template-columns:1.1fr 2fr 1fr 1.2fr 1.4fr 1fr;
            gap:18px; align-items:center; height:37px;
            border-bottom:1px solid var(--rule); padding-right:12px; }
.skel-row i { display:block; height:8px; border-radius:3px;
              background:linear-gradient(90deg, var(--sunken) 0%, var(--rule-2) 45%,
                                          var(--sunken) 70%);
              background-size:200% 100%; animation:shimmer 1.5s linear infinite;
              animation-delay:var(--sd, 0s); }
@media (max-width:680px){ .skel-row{ grid-template-columns:1fr 1.6fr 1fr; } }

.shimmer-text { background:linear-gradient(90deg, var(--mute) 35%, var(--ink) 50%,
                                            var(--mute) 65%);
                background-size:200% 100%; animation:shimmer 2.4s linear infinite;
                -webkit-background-clip:text; background-clip:text; color:transparent; }

/* ── Border trail ───────────────────────────────────────────────────────
   A light running the perimeter of the one operation on this site that takes
   real time. The determinate bar inside says how far along it is; the trail
   only says that it has not stalled. */
/* Sized to its contents, with a faint resting edge under the moving light —
   a trail on an invisible border reads as a tick floating in space. */
.engine { position:relative; padding:12px 14px; border-radius:var(--r-control);
          max-width:min(100%, 400px);
          box-shadow:inset 0 0 0 1px var(--rule); }
.engine .msg { flex:1; }
.engine::before {
  content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
  background:conic-gradient(from var(--trail-angle),
             transparent 0deg 296deg, var(--accent) 344deg, transparent 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  animation:trail 2.6s linear infinite;
}
@keyframes trail { to { --trail-angle:360deg; } }
/* Where @property is unsupported the gradient simply sits still — a plain
   accent-tinted edge, which is a fine resting state. */

/* ── Charts grow in ─────────────────────────────────────────────────────
   Bars rise from the axis in reading order, so the shape assembles left to
   right the way you would read it off a page. */
.chart.grow .cbar i { transform:scaleY(0); transform-origin:bottom; }
.chart.grow.in .cbar i { transform:none;
  transition: transform var(--t-slow) var(--ease-out);
  transition-delay: calc(var(--i, 0) * 11ms); }

/* ── Search results ─────────────────────────────────────────────────────
   `allow-discrete` plus @starting-style animates a box that is display:none
   between states — no wrapper element, no script. */
#results { opacity:0; transform:translateY(-5px) scale(.99); transform-origin:100% 0;
           transition: opacity var(--t-fast) var(--ease-out),
                       transform var(--t-fast) var(--ease-out),
                       display var(--t-fast) allow-discrete; }
#results.open { opacity:1; transform:none; }
@starting-style { #results.open { opacity:0; transform:translateY(-5px) scale(.99); } }
#results a { transition: background var(--t-fast) linear, color var(--t-fast) linear; }

/* ── Micro-interactions ─────────────────────────────────────────────────
   Small, fast, and only on things you can press. */
.btn { transition: border-color var(--t-fast) linear, color var(--t-fast) linear,
                   background var(--t-fast) linear, transform var(--t-fast) var(--ease-out); }
.btn:active:not(:disabled) { transform:translateY(1px); }
.chip { transition: border-color var(--t-fast) linear, color var(--t-fast) linear,
                    background var(--t-fast) linear, transform var(--t-fast) var(--ease-out); }
.chip:hover { transform:translateY(-1px); }
.chip:active { transform:translateY(0); }
.sig { transition: background var(--t-fast) linear, border-left-color var(--t-fast) linear; }
.chev { transition: transform var(--t-base) var(--ease-move), color var(--t-fast) linear; }
.sig:hover .chev { color:var(--accent); }
.gl-item, .hrow, .dl-row { transition: background var(--t-fast) linear,
                                       color var(--t-fast) linear,
                                       padding-left var(--t-fast) var(--ease-out); }
.gl-item:hover, .hrow:hover { padding-left:11px; }
.freshness, #theme button, .gl-label { transition: color var(--t-fast) linear,
                                                   border-color var(--t-fast) linear,
                                                   background var(--t-fast) linear; }
tbody tr { transition: background var(--t-fast) linear; }
th.sortable .dir { display:inline-block; transition: transform var(--t-base) var(--ease-move); }

/* The counted-up readouts must not reflow while they run: the figures are
   already tabular, and this stops the label beneath them from twitching. */
.ro-v { font-variant-numeric:tabular-nums; }
</style>
</head>

<script type="module">
const BASE = new URL('./data/adsb/', location.href).href;

/* ── State ───────────────────────────────────────────────────────────────
   Two layers. `S` is the precomputed summary and arrives in one small fetch,
   which is what every page paints from. `deep` is DuckDB with the real flight
   table, loaded only when a page actually needs to run a query. */
let S = null, TAX = null, CAR = null;
let deep = null, deepPromise = null;

const $  = s => document.querySelector(s);
const el = document.getElementById.bind(document);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => Number(v ?? 0).toLocaleString('en-US');
/* Small changes keep a decimal — rounding 0.4% to "+0%" reads as "no change",
   which is a different claim from the one the data is making. */
const pct = v => (v > 0 ? '+' : '') + Number(v).toFixed(Math.abs(v) < 10 ? 1 : 0) + '%';

/** Arrow hands timestamps back as epoch milliseconds, Dates, or strings
 *  depending on the column. Normalise all three to "YYYY-MM-DD HH:MM". */
function ts(v) {
  if (v == null) return '—';
  let d;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number' || typeof v === 'bigint') {
    const ms = Number(v);
    d = new Date(ms < 1e12 ? ms * 1000 : ms);   // seconds vs milliseconds
  } else {
    d = new Date(String(v));
    if (isNaN(d)) return String(v).slice(0, 16);
  }
  return isNaN(d) ? '—' : d.toISOString().slice(0, 16).replace('T', ' ');
}
const looksLikeTime = c => /(_at|_seen|^ts$|time|date|day)$/i.test(c);
const boot = t => { const b = el('boot-t'); if (b) b.textContent = t; };

const CONF_TEXT = {
  strong:   'Large, consistent and well sampled.',
  moderate: 'Enough history and volume to be worth attention.',
  observed: 'Directly counted. No inference involved.',
  early:    'Real, but the record is too short to call it a trend.',
};

/* ── Motion ──────────────────────────────────────────────────────────────
   The stylesheet's global reduced-motion rule switches off every CSS
   animation and transition, but it cannot reach anything driven from script,
   so `still()` gates all of those by hand. Read it as: if the reader has asked
   for less movement, every function here does the work and skips the show. */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)');
const still = () => REDUCE.matches;

/** A figure that counts up when it first comes into view. */
const fig = (value, text) =>
  `<span class="ro-n" data-count="${value}">${text ?? n(value)}</span>`;

/**
 * Run a DOM change inside a View Transition, tagging <html> so the stylesheet
 * knows which kind it is. Falls back to a plain mutation where the API is
 * missing or motion is turned down. The depth count matters because a theme
 * switch and a route change can overlap, and the first to finish must not
 * strip the other's tag.
 */
const vtDepth = {};
function withTransition(cls, mutate) {
  if (still() || !document.startViewTransition) { mutate(); return null; }
  const root = document.documentElement;
  vtDepth[cls] = (vtDepth[cls] || 0) + 1;
  root.classList.add(cls);
  const t = document.startViewTransition(mutate);
  // A transition is skipped — and all three of its promises reject — whenever
  // the tab is hidden or a second one starts on top of it. That is ordinary,
  // not an error, so every promise gets a handler and none of them reach the
  // console as an unhandled rejection.
  const quiet = p => p.then(() => {}, () => {});
  quiet(t.ready); quiet(t.updateCallbackDone);
  quiet(t.finished).then(() => {
    if (--vtDepth[cls] <= 0) { vtDepth[cls] = 0; root.classList.remove(cls); }
  });
  return t;
}

/**
 * Entrance choreography for a freshly painted subtree.
 *
 *   mode 'route'  — the page just changed, and the view transition has already
 *                   carried everything the reader can see. Only what is still
 *                   below the fold is staged, so nothing animates twice.
 *   mode 'insert' — rows arrived inside a page the reader is already looking
 *                   at. Those should announce themselves wherever they are.
 *
 * Figures count up either way: a number ticking to its value is a different
 * channel from a fade, and it is the one piece of motion here that says
 * something the static page does not — that this was counted, not asserted.
 */
let revealObs = null;
function animateIn(root, mode = 'insert') {
  root.querySelectorAll('[data-count]').forEach(observeCount);
  if (still() || !root || !('IntersectionObserver' in window)) return;

  if (!revealObs) {
    revealObs = new IntersectionObserver((entries, obs) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        e.target.classList.add('in');
        obs.unobserve(e.target);
      }
    }, { rootMargin: '0px 0px -6% 0px', threshold: .01 });
  }

  const fold = innerHeight * 0.92;
  const staged = [];
  const stage = (el, delay) => {
    if (mode === 'route' && el.getBoundingClientRect().top < fold) return;
    el.style.setProperty('--rise-d', delay + 'ms');
    el.classList.add('rise');
    staged.push(el);
    revealObs.observe(el);
  };

  if (mode === 'route') {
    let i = 0;
    root.querySelectorAll(':scope > header, :scope > section').forEach(sec => {
      // The signals list stages its own rows, so its section stays put and the
      // reader watches the claims arrive one at a time instead of as a slab.
      const list = sec.querySelector('.signals');
      if (list) [...list.children].forEach((row, j) => stage(row, Math.min(j, 9) * 34));
      else stage(sec, Math.min(i, 5) * 55);
      i++;
    });
  } else {
    [...root.children].forEach((child, i) => stage(child, Math.min(i, 6) * 45));
  }

  root.querySelectorAll('.chart').forEach(c => {
    if (mode === 'route' && c.getBoundingClientRect().top < fold) return;
    c.classList.add('grow');
    staged.push(c);
    revealObs.observe(c);
  });

  // Staged elements start invisible, so anything that never gets its callback
  // would stay that way. Observers do go quiet — a backgrounded tab is the
  // common case — so after a moment, show whatever is on screen regardless.
  // Content below the fold is left alone: it still has a reveal coming.
  setTimeout(() => {
    for (const el of staged) {
      if (el.classList.contains('in')) continue;
      const r = el.getBoundingClientRect();
      if (r.bottom > 0 && r.top < innerHeight) el.classList.add('in');
    }
  }, 2500);
}

/** AnimatedNumber: ease a figure from zero to its value, once, in view. */
let countObs = null;
function observeCount(el) {
  if (el.dataset.counted) return;
  el.dataset.counted = '1';
  if (still()) return;
  if (!countObs) {
    countObs = new IntersectionObserver((entries, obs) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        obs.unobserve(e.target);
        countTo(e.target);
      }
    }, { threshold: .3 });
  }
  countObs.observe(el);
}
function countTo(el) {
  const to = Number(el.dataset.count);
  if (!Number.isFinite(to) || Math.abs(to) > 1e9) return;
  const dur = 640, t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 3);          // ease-out cubic
    el.textContent = n(Math.round(to * eased));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/**
 * FLIP. Measure every row, let `render` reorder them, then animate each row
 * from where it used to be to where it now is. Sorting a table is the one
 * moment on this site where a row genuinely moves, and watching it move is
 * the difference between "the numbers changed" and "this row went there".
 */
function flip(host, render) {
  const rows = host.querySelectorAll('tbody tr[data-key]');
  if (still() || rows.length === 0 || rows.length > 120 || !rows[0].animate) return render();
  const before = new Map();
  rows.forEach(tr => before.set(tr.dataset.key, tr.getBoundingClientRect().top));
  render();
  host.querySelectorAll('tbody tr[data-key]').forEach(tr => {
    const was = before.get(tr.dataset.key);
    if (was == null) {
      tr.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, easing: 'ease-out' });
      return;
    }
    const dy = was - tr.getBoundingClientRect().top;
    if (Math.abs(dy) < 1) return;
    tr.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }],
               { duration: 340, easing: 'cubic-bezier(.22,.61,.36,1)' });
  });
}

/** The nav pill slides to whichever section is current. */
let pillPlaced = false;
function movePill() {
  const pill = el('nav-pill');
  if (!pill) return;
  const on = document.querySelector('#nav a.on');
  if (!on) { pill.style.opacity = '0'; return; }
  if (!pillPlaced) {                    // don't slide in from the corner
    pill.style.transition = 'none';
    requestAnimationFrame(() => { pill.style.transition = ''; });
    pillPlaced = true;
  }
  pill.style.width = on.offsetWidth + 'px';
  pill.style.height = on.offsetHeight + 'px';
  pill.style.transform = `translate3d(${on.offsetLeft}px, ${on.offsetTop}px, 0)`;
  pill.style.opacity = '1';
}

/** How far through a long page you are. Hidden on pages that don't scroll. */
function wireScrollProgress() {
  const bar = el('scrollbar');
  let queued = false;
  const paint = () => {
    queued = false;
    const span = document.documentElement.scrollHeight - innerHeight;
    bar.style.opacity = span > 500 ? '.8' : '0';
    bar.style.transform = `scaleX(${span > 0 ? Math.min(1, scrollY / span) : 0})`;
  };
  addEventListener('scroll', () => {
    if (!queued) { queued = true; requestAnimationFrame(paint); }
  }, { passive: true });
  addEventListener('resize', paint, { passive: true });
  return paint;
}

/**
 * Open or close a signal, animating between zero and the panel's real height.
 * scrollHeight reports the content height in both states — the panel is
 * overflow-hidden — so one measurement before the class flips serves both
 * directions. The animation does not fill: when it ends the element falls back
 * to whatever CSS says for the state it is now in.
 */
function toggleSig(btn) {
  const sig = btn.closest('.sig');
  const body = sig.querySelector('.sig-body');
  const h = body.scrollHeight;
  const open = !sig.classList.contains('open');
  sig.classList.toggle('open', open);
  btn.setAttribute('aria-expanded', String(open));
  if (still() || !body.animate || !h) return;
  const frames = [{ height: '0px' }, { height: h + 'px' }];
  // Cancel the previous run rather than layering a second one over it, so
  // hammering the row cannot leave two animations fighting for the height.
  body._anim?.cancel();
  body._anim = body.animate(open ? frames : frames.slice().reverse(),
                            { duration: 280, easing: 'cubic-bezier(.4,.14,.3,1)' });
}

/** Shimmering placeholder with the shape of the table that is coming. */
function skeleton(rows = 7) {
  const cells = r => Array.from({ length: 6 }, (_, c) =>
    `<i style="--sd:${(((r * 6 + c) % 9) * .09).toFixed(2)}s;width:${
      46 + ((r * 7 + c * 23) % 45)}%"></i>`).join('');
  return `<div class="skel" aria-hidden="true">${
    Array.from({ length: rows }, (_, r) => `<div class="skel-row">${cells(r)}</div>`).join('')
  }</div>`;
}

/* ── Engine progress ─────────────────────────────────────────────────────
   Standing up DuckDB is the one slow thing on the site — several megabytes of
   WebAssembly on a cold cache. A spinner would be a lie about how long that
   takes, so the pages that trigger it say what is happening instead. */
const engineWatchers = new Set();
let engineState = { msg: 'Starting the query engine…', frac: 0 };
function engineSay(msg, frac) {
  engineState = { msg, frac };
  engineWatchers.forEach(fn => fn(engineState));
}
/** Paint engine start-up into `host` until the engine is up. No-op once warm. */
function engineNote(host) {
  if (deep) return;
  host.innerHTML = `<div class="engine"><span class="track"><i></i></span>
    <span class="msg">${esc(engineState.msg)}</span></div>`;
  const bar = host.querySelector('.track i'), msg = host.querySelector('.msg');
  const fn = s => {
    if (!host.isConnected) return engineWatchers.delete(fn);
    bar.style.width = Math.round(s.frac * 100) + '%';
    msg.textContent = s.msg;
  };
  engineWatchers.add(fn);
  getDeep().finally(() => engineWatchers.delete(fn));
}

/* ── Deep layer: DuckDB-Wasm ─────────────────────────────────────────────
   Loaded on demand. We deliberately do NOT load aircraft_db.parquet (4.7 MB):
   type, registration and description are already denormalised onto each
   flight row, so the browser never needs the full 636k-aircraft table. */
async function getDeep() {
  if (deep) return deep;
  if (deepPromise) return deepPromise;
  deepPromise = (async () => {
    engineSay('Fetching the query engine…', .06);
    const duckdb = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm');
    const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
    const workerUrl = URL.createObjectURL(
      new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' }));
    const worker = new Worker(workerUrl);
    const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), worker);
    engineSay('Starting DuckDB in a worker…', .3);
    await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
    URL.revokeObjectURL(workerUrl);
    const conn = await db.connect();

    const man = await fetch(BASE + 'manifest.json').then(r => r.json());
    const total = man.flights.reduce((a, f) => a + (f.bytes || 0), 0) || 1;
    let got = 0;
    for (const f of man.flights) {
      engineSay(`Loading the flight record — ${(got / 1024).toFixed(0)} of ${
        (total / 1024).toFixed(0)} KB`, .6 + .3 * (got / total));
      const buf = await fetch(BASE + f.path.replace(/^data\/adsb\//, '')).then(r => {
        if (!r.ok) throw new Error(`${f.name} — ${r.status}`);
        return r.arrayBuffer();
      });
      await db.registerFileBuffer(f.name, new Uint8Array(buf));
      got += f.bytes || buf.byteLength;
    }
    engineSay('Building the views…', .94);
    const names = man.flights.map(f => `'${f.name}'`).join(',');

    // Country attribution as a pure range join. ICAO addresses are always six
    // lowercase hex digits, so comparing them as strings is equivalent to
    // comparing the integers — no casting needed. Narrowest block wins, which
    // is how sub-allocations (Iceland inside Ireland's range) resolve.
    const blocks = TAX.blocks.map(b =>
      `('${b.lo_hex}','${b.hi_hex}','${b.cc}',${b.width})`).join(',');
    await conn.query(`CREATE TABLE country_block(lo VARCHAR, hi VARCHAR, cc VARCHAR, width BIGINT)`);
    await conn.query(`INSERT INTO country_block VALUES ${blocks}`);

    const cRows = Object.entries(TAX.countries).map(([cc, m]) =>
      `('${cc}',${q(m.name)},${q(m.region)},${q(m.continent)})`).join(',');
    await conn.query(`CREATE TABLE country(cc VARCHAR, name VARCHAR, region VARCHAR, continent VARCHAR)`);
    await conn.query(`INSERT INTO country VALUES ${cRows}`);

    // Who is flying, and what kind of flying it is. The same judgement the
    // summary was built with, so a query here and a figure on the front page
    // cannot disagree.
    await conn.query(`CREATE TABLE carrier(prefix VARCHAR, op_name VARCHAR, kind VARCHAR)`);
    const carRows = Object.entries(CAR.carriers || {}).map(([p, v]) =>
      `('${p}',${q(v.name)},${q(v.kind)})`).join(',');
    if (carRows) await conn.query(`INSERT INTO carrier VALUES ${carRows}`);

    await conn.query(`CREATE VIEW _raw AS SELECT * FROM read_parquet([${names}], union_by_name=true)`);
    await conn.query(`
      CREATE VIEW flights AS
      SELECT r.*,
             c.cc         AS reg_country,
             ct.name      AS reg_country_name,
             ct.region    AS reg_region,
             ct.continent AS reg_continent,
             -- 'A310', not 'A31'. A31 also matches the A318 and A319, which are
             -- narrow-bodies, and counting them as long-haul inflated the
             -- wide-body figure by about a sixth.
             CASE WHEN r.ac_type SIMILAR TO '(A30|A310|A33|A34|A35|A38|B74|B76|B77|B78|IL9|MD11|A124|C5M).*'
                  THEN 'widebody' ELSE 'narrowbody' END AS body,
             -- Cargo is a property of the operator, never the airframe: a
             -- passenger 777 and a freighter share a type code.
             car.kind = 'cargo' AS is_cargo,
             car.kind AS carrier_kind,
             COALESCE(car.op_name, r.airline) AS operator,
             -- A naive UTC timestamp, not TIMESTAMPTZ. duckdb-wasm ships
             -- without ICU, so strftime() cannot bind against a zoned value —
             -- which quietly broke every by-day and by-hour query on the site.
             -- make_timestamp() takes microseconds since the epoch, so this is
             -- the same instant with the zone stripped, already in UTC.
             make_timestamp(r.first_seen * 1000000) AS seen_at,
             strftime(make_timestamp(r.first_seen * 1000000), '%Y-%m-%d') AS day,
             strftime(make_timestamp(r.first_seen * 1000000), '%a') AS dow,
             CASE WHEN strftime(make_timestamp(r.first_seen * 1000000), '%a')
                       IN ('Sat','Sun') THEN 'weekend' ELSE 'weekday' END AS daytype
      FROM _raw r
      LEFT JOIN country_block c
             ON r.hex >= c.lo AND r.hex <= c.hi
            AND c.width = (SELECT MIN(b2.width) FROM country_block b2
                           WHERE r.hex >= b2.lo AND r.hex <= b2.hi)
      LEFT JOIN country ct ON ct.cc = c.cc
      LEFT JOIN carrier car ON car.prefix = r.airline_prefix`);
    engineSay('Ready.', 1);
    deep = { db, conn };
    return deep;
  })();
  deepPromise.catch(() => { deepPromise = null; });   // let a failed start retry
  return deepPromise;
}
const q = v => v == null ? 'NULL' : `'${String(v).replace(/'/g, "''")}'`;

async function query(sql) {
  const { conn } = await getDeep();
  const r = await conn.query(sql);
  return { rows: r.toArray().map(x => x.toJSON ? x.toJSON() : x),
           cols: (r.schema?.fields ?? []).map(f => f.name) };
}

/* ── Shared components ───────────────────────────────────────────────── */
const confChip = c => `<span class="conf" data-c="${esc(c)}" title="${esc(CONF_TEXT[c] || '')}">${esc(c)}</span>`;

function readout(items) {
  return `<div class="readout">${items.map(i => `
    <div class="ro">

          String(i.v).replace(/<[^>]*>/g, ''))) ? ' txt' : ''}">${i.v}</div>
      <div class="ro-l">${esc(i.l)}</div>
      ${i.s ? `<div class="ro-s">${esc(i.s)}</div>` : ''}
    </div>`).join('')}</div>`;

/** Bar chart. Partial buckets are hatched so an incomplete day never reads
 *  as a genuine dip. */
function chart(data, { key, val, partial, labelEvery = 1 } = {}) {
  if (!data.length) return `<div class="empty">Nothing recorded yet.</div>`;
  const max = data.reduce((m, d) => Math.max(m, +d[val] || 0), 1);
  const peak = data.reduce((a, b) => (+b[val] > +a[val] ? b : a));
  const bars = data.map((d, i) => {
    const isP = partial && d[partial];
    return `<div class="cbar ${d === peak ? 'hi' : ''} ${isP ? 'partial' : ''}"
      title="${esc(d[key])} — ${n(d[val])}${isP ? ' (partial coverage)' : ''}">
      <i style="height:${(+d[val] / max * 100).toFixed(1)}%;--i:${i}"></i></div>`;
  }).join('');
  // Dates read best trimmed to MM-DD, but anything else has to keep its start
  // or it turns to nonsense ("Sweden" -> "weden").
  const tick = v => {
    const t = String(v ?? '');
    return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(5, 10) : t.slice(0, 8);
  };
  const axis = data.map((d, i) =>
    `<span title="${esc(d[key])}">${i % labelEvery === 0 ? esc(tick(d[key])) : ''}</span>`).join('');
  // A wall of bare divs is nothing to a screen reader, so the figure carries a
  // one-line reading of its own shape.
  const sum = data.reduce((a, d) => a + (+d[val] || 0), 0);
  const alt = `Bar chart. ${data.length} values from ${data[0][key]} to `
            + `${data[data.length - 1][key]}. Highest is ${peak[key]} at ${n(peak[val])}; `
            + `${n(sum)} in total.`;
  return `<figure class="chart-fig" role="img" aria-label="${esc(alt)}">
    <div class="chart">${bars}</div><div class="caxis">${axis}</div></figure>`;
}

/* ── Tables ──────────────────────────────────────────────────────────────
   A table owns its own state — sort, filter, how many rows are showing — and
   repaints itself in place. Routing a column sort back through the router
   would also scroll the reader to the top of the page and re-run whatever
   query filled the table, which is the wrong amount of machinery for a sort. */
const TABLES = new Map();
const tblState = {};

/** dir: 1 ascending, -1 descending — and the header arrow always says which.
 *  Blanks sort last in both directions; a missing value is not a small one. */
const comparator = (key, dir) => (a, b) => {
  // Arrow hands timestamps back as epoch numbers on some columns and Dates on
  // others; sorting a Date by its string puts Friday before Monday.
  const num = v => (v instanceof Date ? v.getTime() : v);
  const x = num(a[key]), y = num(b[key]);
  const xn = x == null || x === '', yn = y == null || y === '';
  if (xn || yn) return xn && yn ? 0 : xn ? 1 : -1;
  const numeric = ['number', 'bigint'].includes(typeof x) ||
                  ['number', 'bigint'].includes(typeof y);
  return numeric ? (Number(x) - Number(y)) * dir
                 : String(x).localeCompare(String(y)) * dir;
};

/**
 * A sortable, filterable, drillable entity table.
 *   cols     — { k, h, num?, bar?, render?, csvValue? } per column
 *   sortKey  — column sorted on first paint
 *   sortDir  — 1 ascending, -1 descending
 *   filter   — placeholder text; presence enables the filter box
 *   csv      — false to suppress the export button
 */
function table(rows, cols, opts = {}) {
  const id = opts.id || 't';
  const st = tblState[id] || (tblState[id] = {
    key: opts.sortKey ?? null, dir: opts.sortDir ?? -1, filter: '', max: opts.max ?? 40,
  });
  if (st.max !== Infinity) st.max = opts.max ?? 40;   // null after a navigation
  TABLES.set(id, { rows, cols, opts });
  return `<div class="tbl" data-tbl="${esc(id)}">${tableInner(id)}</div>`;
}

function tableInner(id) {
  const t = TABLES.get(id);
  if (!t) return '';
  const { cols, opts } = t, st = tblState[id];
  if (!t.rows.length) return `<div class="empty">${esc(opts.empty || 'No rows.')}</div>`;

  const needle = st.filter.trim().toLowerCase();
  const rows = needle
    ? t.rows.filter(r => cols.some(c => String(r[c.k] ?? '').toLowerCase().includes(needle)))
    : t.rows;
  const sorted = st.key ? [...rows].sort(comparator(st.key, st.dir)) : rows;

  const barKey = cols.find(c => c.bar)?.k;
  const top = barKey ? rows.reduce((m, r) => Math.max(m, +r[barKey] || 0), 1) : 1;

  const head = cols.map(c => {
    const on = st.key === c.k;
    const next = on ? -st.dir : (c.num ? -1 : 1);   // numbers open big-first, words A–Z
    return `<th class="${c.num ? 'num ' : ''}sortable" data-t="${esc(id)}" data-k="${esc(c.k)}"
        tabindex="0" aria-sort="${on ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"
        title="Sort by ${esc(c.h)} — ${next > 0 ? 'ascending' : 'descending'}"
      >${esc(c.h)}${on ? `<span class="dir" aria-hidden="true"> ${st.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;
  }).join('');

  const keyOf = cols[0].k;
  const body = sorted.slice(0, st.max).map(r =>
    `<tr data-key="${esc(String(r[keyOf] ?? ''))}">${cols.map(c => {
    const v = c.render ? c.render(r) : esc(r[c.k] ?? '—');
    if (c.bar) return `<td class="num barcell">
        <div class="fill" style="width:${(+r[c.k] / top * 100).toFixed(1)}%"></div>
        <span>${v}</span></td>`;
    return `<td class="${c.num ? 'num' : ''}">${v}</td>`;
  }).join('')}</tr>`).join('');

  const bar = (opts.filter || opts.csv !== false) ? `<div class="tbl-bar">
    ${opts.filter ? `<input class="tbl-filter" type="search" data-tf="${esc(id)}"
        placeholder="${esc(opts.filter)}" aria-label="${esc(opts.filter)}"
        value="${esc(st.filter)}" autocomplete="off" spellcheck="false">` : ''}
    ${needle ? `<span class="tbl-count">${n(rows.length)} of ${n(t.rows.length)}</span>` : ''}
    ${opts.csv === false ? '' : `<button class="btn" data-csv="${esc(id)}">Export CSV</button>`}
  </div>` : '';

  const empty = !sorted.length
    ? `<div class="empty">Nothing matches “${esc(st.filter)}”.</div>` : '';
  const more = sorted.length > st.max
    ? `<div class="status">Showing ${n(st.max)} of ${n(sorted.length)}.
       <button class="btn" data-all="${esc(id)}" style="margin-left:9px">Show all</button></div>` : '';

  return bar + (empty || `<div class="tbl-wrap"><table data-tid="${esc(id)}">
    <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`) + more;
}

function repaintTable(id) {
  const host = document.querySelector(`[data-tbl="${CSS.escape(id)}"]`);
  if (!host) return;
  const wasFiltering = document.activeElement?.dataset?.tf === id;
  flip(host, () => { host.innerHTML = tableInner(id); });
  if (wasFiltering) {
    const box = host.querySelector('.tbl-filter');
    if (box) { box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }
}

/* One delegated listener for every table on the page. */
function sortBy(id, key) {
  const st = tblState[id];
  const col = TABLES.get(id)?.cols.find(c => c.k === key);
  st.dir = st.key === key ? -st.dir : (col?.num ? -1 : 1);
  st.key = key;
  repaintTable(id);
}
document.addEventListener('click', e => {
  const th = e.target.closest('th.sortable');
  if (th) return sortBy(th.dataset.t, th.dataset.k);
  const all = e.target.closest('[data-all]');
  if (all) { tblState[all.dataset.all].max = Infinity; return repaintTable(all.dataset.all); }
  const csv = e.target.closest('[data-csv]');
  if (csv) return exportTable(csv.dataset.csv);
});
document.addEventListener('keydown', e => {
  const th = e.target.closest?.('th.sortable');
  if (!th || (e.key !== 'Enter' && e.key !== ' ')) return;
  e.preventDefault();
  sortBy(th.dataset.t, th.dataset.k);
});
document.addEventListener('input', e => {
  const box = e.target.closest('.tbl-filter');
  if (!box) return;
  tblState[box.dataset.tf].filter = box.value;
  repaintTable(box.dataset.tf);
});

/* ── Taking the data with you ────────────────────────────────────────────
   The site's claim is that you don't have to trust it. Every table on it is
   therefore one click from a file you can open somewhere else. */
const csvCell = v => {
  if (v == null) return '';
  const s = v instanceof Date ? v.toISOString() : String(v);
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
function exportTable(id) {
  const t = TABLES.get(id);
  if (!t) return;
  const needle = tblState[id].filter.trim().toLowerCase();
  const rows = needle
    ? t.rows.filter(r => t.cols.some(c => String(r[c.k] ?? '').toLowerCase().includes(needle)))
    : t.rows;
  const st = tblState[id];
  const out = st.key ? [...rows].sort(comparator(st.key, st.dir)) : rows;
  const csv = [t.cols.map(c => csvCell(c.h)).join(','),
               ...out.map(r => t.cols.map(c =>
                 csvCell(c.csvValue ? c.csvValue(r) : r[c.k])).join(','))].join('\r\n');
  download(`${t.opts.csvName || 'ovrhead-' + id}-${S.generated_at.slice(0, 10)}.csv`, csv);
}
function download(name, text, type = 'text/csv;charset=utf-8') {
  // Leading BOM: without it Excel opens a UTF-8 CSV as Latin-1 and mangles
  // every non-ASCII airline and country name in the file.
  const url = URL.createObjectURL(new Blob(['\uFEFF' + text], { type }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function changeCell(v) {
  if (v == null) return `<span class="faint" title="Not enough baseline to compare">—</span>`;
  return `<span style="color:var(--${v >= 0 ? 'rise' : 'fall'})">${pct(v)}</span>`;
}
const countryName = cc => TAX?.countries?.[cc]?.name || cc;
