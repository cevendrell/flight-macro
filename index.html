<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="OvrHead — reading global flight-route data as a lens on macroeconomic shifts. Tourism, business travel, migration, supply chains.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OvrHead">
  <meta property="og:description" content="Global macro trends, read through flight data.">
  <title>OvrHead</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a1119'/%3E%3Cpath d='M6 22 L26 10 M6 10 L26 22' stroke='%23c9a86a' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Ground — deep midnight navy, warm enough not to feel like vacuum */
      --bg:      #0a1119;
      --bg-2:    #0d1420;
      --surface: #121a26;
      --panel:   #18202e;

      /* Structure — warm lines instead of pure white alpha */
      --line:    rgba(201, 180, 140, 0.08);
      --line-2:  rgba(201, 180, 140, 0.16);

      /* Text — warm parchment, not blue-white */
      --text:    #e8dfd0;
      --dim:     #9a9484;
      --mute:    #5e5a4e;

      /* Primary accent — brass/teak (LayOvr family) */
      --brass:   #c9a86a;
      --brass-l: #dcc296;
      --brass-d: #8f7748;

      /* Trend colors — sage up, burnt sienna down. Muted, ledger-like. */
      --up:      #7fa88c;
      --up-l:    #a3c1ac;
      --down:    #b87857;
      --down-l:  #cf9578;

      /* Secondary — subtle aeronautical steel blue */
      --steel:   #6b8caf;
      --steel-l: #9ab2cc;

      /* Category accents — restrained */
      --violet:  #9086b8;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }
    ::selection { background: var(--brass); color: var(--bg); }

    /* NAV */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 500;
      padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(5,9,18,0.85);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo { display: flex; align-items: center; gap: 0.6rem; font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
    .nav-mark { width: 26px; height: 26px; border-radius: 6px; background: var(--panel); border: 1px solid var(--brass); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-mark svg { width: 16px; height: 16px; }
    .nav-title-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--mute); letter-spacing: 0.14em; text-transform: uppercase; margin-left: 0.5rem; }
    .nav-links { display: flex; gap: 1.75rem; list-style: none; }
    .nav-links a { font-size: 0.82rem; font-weight: 500; color: var(--dim); transition: color 0.2s; }
    .nav-links a:hover { color: var(--brass-l); }
    @media (max-width: 720px) { .nav-title-sub { display: none; } .nav-links { gap: 1rem; } }

    /* APP LAYOUT */
    #app {
      display: grid;
      grid-template-columns: 400px 1fr;
      height: 100vh;
      padding-top: 58px;
    }
    #sidebar {
      background: var(--surface);
      border-right: 1px solid var(--line);
      overflow-y: auto;
      display: flex; flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: var(--mute) var(--surface);
    }
    #sidebar::-webkit-scrollbar { width: 8px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--mute); border-radius: 4px; }
    #map-wrap { position: relative; }
    #map { width: 100%; height: 100%; background: var(--bg-2); }

    /* SIDEBAR HEADER */
    .side-head {
      padding: 1rem 1.25rem 0.85rem;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    .side-head-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .side-title { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--mute); letter-spacing: 0.2em; text-transform: uppercase; }
    .updated-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem; color: var(--brass-l);
      background: rgba(201,168,106,0.10);
      padding: 3px 8px; border-radius: 3px;
      letter-spacing: 0.08em;
    }
    /* HERO CARD — the primary answer */
    .hero-block {
      padding: 1rem 1.25rem 0.5rem;
    }
    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
      color: var(--mute); letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .hero-title {
      font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em;
      line-height: 1.15; margin-bottom: 0.75rem; color: var(--text);
    }
    .hero-title .accent { color: var(--brass); }
    .hero-num {
      font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 600;
      letter-spacing: -0.02em; line-height: 1; margin-bottom: 0.35rem;
    }
    .hero-num.up   { color: var(--up-l); }
    .hero-num.down { color: var(--down-l); }
    .hero-sub {
      font-size: 0.82rem; color: var(--dim); line-height: 1.55;
      margin-bottom: 0.9rem;
    }
    .hero-sub strong { color: var(--text); font-weight: 600; }
    .hero-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.6rem; }

    /* PAIR-MODE INLINE DETAIL — used when both A and B are picked */
    .pair-detail {
      background: var(--panel);
      border: 1px solid var(--brass);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      margin-top: 0.5rem;
    }
    .pair-detail-reading {
      font-size: 0.88rem; color: var(--text); line-height: 1.6;
      margin: 0.6rem 0 0.8rem;
    }
    .pair-vol-row { display: flex; align-items: center; gap: 0.6rem; font-size: 0.72rem; margin: 0.35rem 0; }
    .pair-vol-label { width: 66px; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
    .pair-vol-bar { flex: 1; height: 5px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
    .pair-vol-fill.current { background: var(--brass); height: 100%; }
    .pair-vol-fill.prior   { background: var(--mute); height: 100%; }
    .pair-vol-num { width: 60px; text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--text); font-variant-numeric: tabular-nums; }

    /* ADVANCED FILTERS — folded away by default */
    details.advanced {
      border-top: 1px solid var(--line);
      padding: 0.6rem 1.25rem;
    }
    details.advanced summary {
      cursor: pointer; list-style: none;
      font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
      color: var(--mute); letter-spacing: 0.16em; text-transform: uppercase;
      padding: 0.35rem 0; user-select: none;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::before { content: '›  '; color: var(--mute); transition: transform 0.15s; display: inline-block; }
    details.advanced[open] summary::before { transform: rotate(90deg); }
    details.advanced .filter-panel-inner {
      padding: 0.5rem 0 0.75rem;
    }
    .filter-group { margin-bottom: 0.75rem; }
    .filter-group:last-child { margin-bottom: 0; }
    .filter-label {
      display: block;
      font-size: 0.64rem; color: var(--mute);
      letter-spacing: 0.14em; text-transform: uppercase;
      margin-bottom: 0.35rem; font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip {
      font-size: 0.72rem; font-weight: 500;
      padding: 4px 9px; border-radius: 4px;
      background: transparent; border: 1px solid var(--line-2);
      color: var(--dim); cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--brass); color: var(--brass-l); }
    .chip.active { background: var(--brass); border-color: var(--brass); color: var(--bg); font-weight: 600; }

    /* INSIGHT FEED */
    .feed-header {
      padding: 0.85rem 1.25rem 0.5rem;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .feed-title { font-size: 0.66rem; font-family: 'JetBrains Mono', monospace; color: var(--mute); letter-spacing: 0.2em; text-transform: uppercase; }
    .feed-count { font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: var(--brass-l); }
    .feed { padding: 0 1.25rem 2rem; display: flex; flex-direction: column; gap: 0.45rem; }
    .feed-heading {
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
      color: var(--mute); letter-spacing: 0.2em; text-transform: uppercase;
      padding: 0.5rem 0 0.3rem;
    }
    .show-more {
      margin-top: 0.4rem; padding: 0.55rem;
      background: transparent; border: 1px dashed var(--line-2);
      color: var(--dim); font-family: inherit; font-size: 0.75rem;
      border-radius: 6px; cursor: pointer;
      transition: all 0.15s;
    }
    .show-more:hover { color: var(--brass-l); border-color: var(--brass); }

    /* Compact card variant — leaner, used for related/secondary lists */
    .card.compact { padding: 0.65rem 0.85rem; }
    .card.compact .card-headline { font-size: 0.82rem; margin: 0.2rem 0 0; line-height: 1.4; color: var(--dim); font-weight: 500; }
    .card.compact .card-headline.compact { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card.compact .card-top { padding-right: 0; margin-bottom: 0; }
    .card.compact .card-route { font-size: 0.75rem; color: var(--text); font-family: inherit; font-weight: 500; letter-spacing: 0; text-transform: none; }
    .card.compact .card-delta { font-size: 0.78rem; padding: 1px 6px; }

    /* THESIS CARD — the primary experience */
    .thesis-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--brass);
      border-radius: 8px;
      padding: 0.9rem 1rem 0.85rem;
      transition: border-color 0.2s, transform 0.15s;
      cursor: pointer;
    }
    .thesis-card:hover { border-color: var(--brass); border-left-color: var(--brass-l); transform: translateY(-1px); }
    .thesis-card.active { border-color: var(--brass-l); border-left-color: var(--brass-l); background: rgba(201,168,106,0.05); }
    .thesis-card.dir-down { border-left-color: var(--down); }
    .thesis-card.dir-down:hover { border-left-color: var(--down-l); }
    .thesis-card.dir-up   { border-left-color: var(--up); }
    .thesis-card.dir-up:hover   { border-left-color: var(--up-l); }

    .tc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.5rem; }
    .tc-thesis { font-size: 0.95rem; font-weight: 700; line-height: 1.3; color: var(--text); letter-spacing: -0.01em; }
    .tc-delta {
      font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 600;
      padding: 3px 9px; border-radius: 5px; white-space: nowrap; flex-shrink: 0;
    }
    .tc-delta.up   { color: var(--up-l);   background: rgba(127,168,140,0.14); }
    .tc-delta.down { color: var(--down-l); background: rgba(184,120,87,0.15); }

    .tc-anomaly {
      font-size: 0.78rem; color: var(--dim); line-height: 1.55;
      padding: 0.35rem 0 0.55rem;
      border-bottom: 1px dashed var(--line);
    }
    .tc-anomaly strong { color: var(--text); font-weight: 500; }
    .tc-baseline {
      font-family: 'JetBrains Mono', monospace; font-size: 0.68rem;
      color: var(--mute); letter-spacing: 0.04em; margin-top: 0.2rem;
      display: block;
    }
    .tc-baseline .bs-name { color: var(--dim); }
    .tc-baseline .bs-note { color: var(--brass-l); }

    .tc-meta {
      display: flex; align-items: center; gap: 0.5rem;
      padding-top: 0.55rem; flex-wrap: wrap;
    }
    .tc-conf {
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
      padding: 2px 7px; border-radius: 3px; letter-spacing: 0.1em; font-weight: 600;
    }
    .tc-conf.high   { color: var(--up-l);    background: rgba(127,168,140,0.14); }
    .tc-conf.medium { color: var(--brass-l); background: rgba(201,168,106,0.10); }
    .tc-conf.low    { color: var(--down-l);  background: rgba(184,120,87,0.10); }
    .tc-theme {
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 2px 7px; border-radius: 3px;
    }
    .tc-theme.tourism      { color: var(--brass-l); background: rgba(201,168,106,0.10); }
    .tc-theme.business     { color: var(--steel-l); background: rgba(107,140,175,0.14); }
    .tc-theme.migration    { color: #b8afd6;       background: rgba(144,134,184,0.14); }
    .tc-theme.supply-chain { color: var(--up-l);   background: rgba(127,168,140,0.10); }
    .tc-expand {
      margin-left: auto; background: transparent; border: none;
      color: var(--mute); font-family: 'JetBrains Mono', monospace;
      font-size: 0.66rem; cursor: pointer; letter-spacing: 0.08em;
      padding: 3px 6px; border-radius: 3px;
    }
    .tc-expand:hover { color: var(--brass-l); }

    .tc-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .thesis-card.open .tc-body { max-height: 520px; }
    .tc-section {
      padding: 0.7rem 0 0.25rem;
      border-top: 1px solid var(--line);
      margin-top: 0.6rem;
    }
    .tc-section:first-child { border-top: none; margin-top: 0; }
    .tc-section h4 {
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem;
      color: var(--mute); letter-spacing: 0.16em; text-transform: uppercase;
      margin-bottom: 0.35rem; font-weight: 500;
    }
    .tc-section p {
      font-size: 0.82rem; color: var(--text); line-height: 1.55;
      margin: 0;
    }
    .tc-section p .muted { color: var(--dim); }

    /* Thesis-board heading on landing */
    .board-heading {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 0.9rem 1.25rem 0.5rem;
    }
    .board-heading h3 { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
    .board-heading .sub {
      font-family: 'JetBrains Mono', monospace; font-size: 0.64rem;
      color: var(--mute); letter-spacing: 0.14em; text-transform: uppercase;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      cursor: pointer;
      transition: all 0.18s;
      position: relative;
    }
    .card:hover, .card.hover { border-color: var(--brass); transform: translateY(-1px); }
    .card.active { border-color: var(--brass); background: rgba(201,168,106,0.07); box-shadow: 0 0 0 1px var(--brass) inset; }
    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; gap: 0.75rem; }
    .card-route { font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; color: var(--mute); letter-spacing: 0.06em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-delta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem; font-weight: 600;
      padding: 2px 8px; border-radius: 4px;
      white-space: nowrap;
    }
    .card-delta.up { color: var(--up-l); background: rgba(127,168,140,0.12); }
    .card-delta.down { color: var(--down-l); background: rgba(184,120,87,0.14); }
    .card-headline { font-size: 0.92rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.3rem; line-height: 1.35; color: var(--text); }
    .card-reading { font-size: 0.78rem; color: var(--dim); line-height: 1.55; }
    .card-meta { margin-top: 0.55rem; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .theme-tag {
      font-size: 0.6rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 2px 6px; border-radius: 3px;
    }
    .theme-tag.tourism      { color: var(--brass-l); background: rgba(201,168,106,0.10); }
    .theme-tag.business     { color: var(--steel-l); background: rgba(107,140,175,0.14); }
    .theme-tag.migration    { color: #b8afd6;       background: rgba(144,134,184,0.14); }
    .theme-tag.supply-chain { color: var(--up-l);   background: rgba(127,168,140,0.10); }
    .card-period { font-size: 0.64rem; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
    .card-vol { font-size: 0.64rem; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.04em; margin-left: auto; }
    .card-conf-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .card-conf-dot.high { background: var(--brass); box-shadow: 0 0 6px var(--brass); }
    .card-conf-dot.medium { background: var(--brass-l); }
    .card-conf-dot.low { background: var(--down); }
    .empty { padding: 2rem 1rem; text-align: center; color: var(--mute); font-size: 0.85rem; }

    /* MAP OVERLAY LEGEND — compact horizontal strip, bottom-left */
    .map-legend {
      position: absolute;
      bottom: 14px; left: 16px;
      background: rgba(24,32,46,0.85);
      border: 1px solid var(--line-2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 6px 10px;
      border-radius: 6px;
      z-index: 400;
      display: flex; align-items: center; gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: var(--dim);
      letter-spacing: 0.06em;
      max-width: calc(100% - 32px);
      flex-wrap: wrap;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 18px; height: 3px; border-radius: 2px; flex-shrink: 0; }
    .legend-swatch.up { background: var(--up); }
    .legend-swatch.down { background: var(--down); }
    .legend-swatch.flow { background: linear-gradient(90deg, var(--brass-l), transparent); }

    /* GLOBE */
    #map canvas { display: block; outline: none; }
    #map { cursor: grab; }
    #map:active { cursor: grabbing; }
    #map .scene-tooltip {
      font-family: 'JetBrains Mono', monospace !important;
      background: rgba(24,32,46,0.94) !important;
      color: var(--text) !important;
      border: 1px solid var(--line-2) !important;
      font-size: 0.72rem !important;
      padding: 5px 9px !important;
      border-radius: 5px !important;
      letter-spacing: 0.05em !important;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5) !important;
    }
    .globe-loading {
      position: absolute; inset: 0; z-index: 350;
      background: var(--bg-2);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 0.9rem;
      transition: opacity 0.4s;
    }
    .globe-loading.done { opacity: 0; pointer-events: none; }
    .globe-loading .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--line-2); border-top-color: var(--brass);
      animation: spin 0.9s linear infinite;
    }
    .globe-loading p { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--mute); letter-spacing: 0.16em; text-transform: uppercase; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ACTIONS ROW (above feed) */
    .actions-row {
      padding: 0 1.25rem 0.5rem;
      display: flex; gap: 0.4rem; flex-wrap: wrap;
    }
    .action-btn {
      font-family: inherit; font-size: 0.7rem; font-weight: 500;
      color: var(--dim); background: transparent;
      border: 1px solid var(--line-2); border-radius: 4px;
      padding: 4px 9px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--brass); color: var(--brass-l); }
    .action-btn svg { width: 12px; height: 12px; }

    /* WATCH STAR ON CARDS */
    .card-star {
      position: absolute; top: 8px; right: 8px;
      width: 24px; height: 24px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--mute);
      cursor: pointer; transition: color 0.15s, transform 0.15s;
      opacity: 0;
    }
    .card:hover .card-star, .card-star.on { opacity: 1; }
    .card-star:hover { color: var(--down-l); transform: scale(1.15); }
    .card-star.on { color: var(--down); }
    .card-star svg { width: 14px; height: 14px; }
    /* keep delta from being covered by the star */
    .card-top { padding-right: 22px; }

    /* DETAIL DRAWER */
    .drawer-backdrop {
      position: fixed; inset: 58px 0 0 0;
      background: rgba(5,9,18,0.55);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s;
      z-index: 700;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 58px; right: 0; bottom: 0;
      width: min(460px, 95vw);
      background: var(--surface);
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0.2, 0.2, 1);
      z-index: 750;
      display: flex; flex-direction: column;
      box-shadow: -12px 0 40px rgba(0,0,0,0.5);
    }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 1.25rem 1.5rem 1rem;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;
    }
    .drawer-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--mute); letter-spacing: 0.16em; text-transform: uppercase; margin-bottom: 0.5rem; }
    .drawer-title { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
    .drawer-close {
      background: transparent; border: 1px solid var(--line-2); color: var(--dim);
      width: 30px; height: 30px; border-radius: 6px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .drawer-close:hover { color: var(--brass-l); border-color: var(--brass); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 1.25rem 1.5rem 2rem; }
    .drawer-body::-webkit-scrollbar { width: 8px; }
    .drawer-body::-webkit-scrollbar-thumb { background: var(--mute); border-radius: 4px; }

    .drawer-hero {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 1rem 1.1rem; margin-bottom: 1.25rem;
    }
    .drawer-hero-delta { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
    .drawer-hero-delta.up { color: var(--up-l); }
    .drawer-hero-delta.down { color: var(--down-l); }
    .drawer-hero-sub { font-size: 0.75rem; color: var(--mute); margin-top: 0.35rem; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }

    .vol-compare { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.55rem; }
    .vol-row { display: flex; align-items: center; gap: 0.65rem; font-size: 0.75rem; }
    .vol-row-label { width: 70px; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.06em; }
    .vol-bar-outer { flex: 1; height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; }
    .vol-bar-fill { height: 100%; border-radius: 3px; }
    .vol-bar-fill.current { background: var(--brass); box-shadow: 0 0 6px rgba(201,168,106,0.35); }
    .vol-bar-fill.prior   { background: var(--mute); }
    .vol-row-num { width: 62px; text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--text); font-variant-numeric: tabular-nums; }

    .drawer-section { margin-bottom: 1.5rem; }
    .drawer-section h3 {
      font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--mute);
      letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 0.6rem;
    }
    .drawer-reading { font-size: 0.92rem; color: var(--text); line-height: 1.65; }
    .drawer-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1rem; }
    .drawer-meta-cell .k { font-size: 0.66rem; color: var(--mute); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .drawer-meta-cell .v { font-size: 0.88rem; color: var(--text); }
    .drawer-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .drawer-btn {
      font-family: inherit; font-size: 0.78rem; font-weight: 600;
      padding: 8px 14px; border-radius: 5px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.15s;
    }
    .drawer-btn.primary { background: var(--brass); color: var(--bg); border: 1px solid var(--brass); }
    .drawer-btn.primary:hover { background: var(--brass-l); border-color: var(--brass-l); }
    .drawer-btn.ghost { background: transparent; color: var(--dim); border: 1px solid var(--line-2); }
    .drawer-btn.ghost:hover { color: var(--brass-l); border-color: var(--brass); }
    .drawer-btn.ok { color: var(--brass); border-color: var(--brass); }
    .drawer-btn svg { width: 13px; height: 13px; }

    .country-chip {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      color: var(--brass-l); background: rgba(201,168,106,0.10);
      padding: 3px 7px; border-radius: 3px; margin: 0 2px;
      cursor: pointer; letter-spacing: 0.04em;
      border: 1px solid transparent; transition: all 0.15s;
    }
    .country-chip:hover { border-color: var(--brass); }

    /* FOCUS INPUT — single search bar with autocomplete over nodes */
    .focus-wrap { position: relative; }
    .focus-input {
      width: 100%; background: var(--surface); border: 1px solid var(--line-2);
      color: var(--text); font-family: inherit; font-size: 0.95rem;
      padding: 10px 34px 10px 34px; border-radius: 6px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .focus-input:focus {
      outline: none; border-color: var(--brass);
      box-shadow: 0 0 0 3px rgba(201,168,106,0.12);
    }
    .focus-input::placeholder { color: var(--mute); }
    .focus-ico {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--mute); pointer-events: none;
    }
    .focus-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--mute); cursor: pointer;
      padding: 4px; border-radius: 3px; display: flex;
    }
    .focus-clear:hover { color: var(--down-l); }
    .focus-suggest {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--panel); border: 1px solid var(--line-2);
      border-top: none; border-radius: 0 0 6px 6px;
      max-height: 340px; overflow-y: auto;
      z-index: 50;
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .focus-suggest[hidden] { display: none; }
    .fs-group {
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: var(--mute); letter-spacing: 0.16em; text-transform: uppercase;
      padding: 8px 12px 4px;
    }
    .fs-option {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 12px; cursor: pointer; font-size: 0.85rem; color: var(--text);
      transition: background 0.1s;
      gap: 8px;
    }
    .fs-option:hover, .fs-option.active { background: rgba(201,168,106,0.10); color: var(--brass-l); }
    .fs-option .fs-kind {
      font-family: 'JetBrains Mono', monospace; font-size: 0.6rem;
      color: var(--mute); letter-spacing: 0.08em;
      padding: 2px 6px; border-radius: 3px; background: var(--surface);
    }
    .fs-empty {
      padding: 12px; text-align: center; font-size: 0.78rem; color: var(--mute);
    }

    /* BREADCRUMBS — small navigation trail */
    .crumbs {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.25rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.7rem;
      background: var(--surface);
      overflow-x: auto; white-space: nowrap;
    }
    .crumbs[hidden] { display: none; }
    .crumb-back {
      background: transparent; border: 1px solid var(--line-2); color: var(--dim);
      font-family: inherit; font-size: 0.68rem;
      padding: 3px 8px; border-radius: 4px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
      flex-shrink: 0;
    }
    .crumb-back:hover { color: var(--brass-l); border-color: var(--brass); }
    .crumb-sep { color: var(--mute); }
    .crumb-item {
      color: var(--dim); cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
      letter-spacing: 0.04em;
    }
    .crumb-item:hover { color: var(--brass-l); }
    .crumb-item.current { color: var(--text); cursor: default; font-weight: 500; }

    /* Clickable endpoints inside cards */
    .clickable-node {
      cursor: pointer;
      text-decoration: none;
      border-bottom: 1px dotted var(--mute);
      transition: color 0.15s, border-color 0.15s;
    }
    .clickable-node:hover { color: var(--brass-l); border-bottom-color: var(--brass-l); }

    /* IN / OUT layout in node dashboard */
    .direction-tab {
      display: flex; gap: 0.4rem;
      padding: 0 1.25rem 0.5rem;
    }
    .dir-chip {
      font-size: 0.72rem; font-weight: 500;
      padding: 5px 12px; border-radius: 4px;
      background: transparent; border: 1px solid var(--line-2);
      color: var(--dim); cursor: pointer; font-family: inherit;
      transition: all 0.15s;
    }
    .dir-chip:hover { border-color: var(--brass); color: var(--brass-l); }
    .dir-chip.active { background: var(--brass); border-color: var(--brass); color: var(--bg); font-weight: 600; }

    /* MAP LANDING PROMPT — small top-left hint, not a modal */
    .map-prompt {
      position: absolute; top: 16px; left: 16px;
      background: rgba(24,32,46,0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line-2);
      border-radius: 6px;
      padding: 6px 12px;
      z-index: 380;
      pointer-events: none;
      transition: opacity 0.2s;
      display: flex; align-items: center; gap: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem; color: var(--dim);
      letter-spacing: 0.06em;
    }
    .map-prompt::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--brass); box-shadow: 0 0 6px var(--brass);
    }
    .map-prompt.hidden { opacity: 0; }

    /* LANDING STATE IN FEED */
    .feed-landing {
      padding: 1.5rem 0.5rem;
      color: var(--dim); font-size: 0.85rem; line-height: 1.6;
      text-align: center;
    }
    .feed-landing .big { color: var(--text); font-weight: 600; margin-bottom: 0.35rem; display: block; font-size: 0.95rem; }

    /* MOBILE */
    .mobile-toggle {
      display: none;
      position: fixed; bottom: 20px; right: 20px; z-index: 600;
      background: var(--brass); color: var(--bg); border: none;
      padding: 10px 16px; border-radius: 40px;
      font-family: inherit; font-size: 0.8rem; font-weight: 700;
      box-shadow: 0 6px 20px rgba(201,168,106,0.28);
      cursor: pointer;
    }
    @media (max-width: 780px) {
      #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
      #sidebar { position: fixed; top: 58px; bottom: 0; left: 0; right: 0; z-index: 550; transform: translateY(100%); transition: transform 0.3s; }
      body.sidebar-open #sidebar { transform: translateY(0); }
      .mobile-toggle { display: block; }
    }
  </style>
</head>
