<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OvrHead — an observatory over Aarhus</title>
<meta name="description" content="One antenna over Aarhus, Denmark. We turn a continuous record of aircraft passing overhead into signals about connectivity, capacity and trade — with the evidence attached.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305164D'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%238A5A33'/%3E%3Ccircle cx='16' cy='16' r='7.5' fill='none' stroke='%2382A5D6' stroke-width='1.1' opacity='.75'/%3E%3Ccircle cx='16' cy='16' r='12.5' fill='none' stroke='%2382A5D6' stroke-width='1.1' opacity='.35'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Tokens.

   The palette is LayOvr's, used as documented there: navy dominant, amber as
   the warm action accent, burgundy reserved strictly for negative/critical
   signals, periwinkle as the secondary voice on navy, and a warm off-white
   ground with lavender-grey hairlines.

   Where OvrHead departs is the night theme. LayOvr is a light-only app; here
   the dark theme is built by promoting navy from accent to ground and letting
   LayOvr's own on-navy pair (#EEF1F8 / #82A5D6) carry the text. Same family,
   its own room — an observatory after dark.
   ───────────────────────────────────────────────────────────────────────── */
:root {
  --bg:        #f5f3f0;   /* LayOvr ink — warm off-white */
  --surface:   #ffffff;   /* LayOvr surface */
  --sunken:    #efece7;
  --ink:       #05164d;   /* LayOvr navy — also textPrimary */
  --ink-2:     #777586;   /* LayOvr textSecondary — muted purple-grey */
  --mute:      #8e8b9e;   /* LayOvr textTertiary */
  --faint:     #aca9bb;
  --rule:      #e2dfe9;   /* LayOvr hairline — lavender-grey */
  --rule-2:    #cdc8da;
  --accent:    #8a5a33;   /* LayOvr amber — action / CTA */
  --accent-bg: rgba(138,90,51,.09);
  --navy:      #05164d;
  --navy-deep: #05164d;
  --topbar:    #05164d;   /* pinned — nav bar is always this, both themes */
  --on-navy:   #eef1f8;   /* LayOvr onNavy */
  --on-navy-2: #82a5d6;   /* LayOvr onNavySub — periwinkle */
  --rise:      #2e875e;   /* LayOvr success */
  --fall:      #7d2b2d;   /* LayOvr burgundy — danger / critical ONLY */
  --rise-bg:   rgba(46,135,94,.10);
  --fall-bg:   rgba(125,43,45,.09);
  /* LayOvr reserves its darkest value for the pivotal CTAs. On the warm
     ground that is navy; on the navy ground it has to be the amber. */
  --cta-bg:       #05164d;
  --cta-fg:       #eef1f8;
  --cta-hover-fg: #ffffff;
  --bar:          #6b76a0;   /* muted navy — chart bars on the warm ground */

  /* One sans, weight does the work — the same logic as LayOvr's BrandFont.
     Archivo is squarer and a touch narrower than a default grotesque, which
     keeps dense tables legible and gives headlines some spine. */
  --sans:  'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:  'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Two radii only, per LayOvr — but pulled in from 10/16, which made every
     list read as an app card rather than a record. */
  --r-control: 7px;
  --r-card:    11px;

  --rail:  212px;
  --pad:   clamp(20px, 3.5vw, 44px);
  --measure: 68ch;
  color-scheme: light;   /* native controls follow the theme */
}

/* Night: page goes near-black — navy stays only in the pinned top bar. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0c0c0e;   /* near-black, no blue cast */
    --surface:   #191919;   /* card surface — dark grey, not navy */
    --sunken:    #060606;
    --ink:       #eef1f8;
    --ink-2:     #aab2c8;
    --mute:      #737b96;
    --faint:     #4d5470;
    --rule:      rgba(210,210,220,.12);   /* neutral, not periwinkle-tinted */
    --rule-2:    rgba(210,210,220,.22);
    --accent:    #d2955c;
    --accent-bg: rgba(210,149,92,.14);
    --navy:      #191919;   /* navy token now points to dark-grey surface in dark mode */
    --on-navy:   #eef1f8;
    --on-navy-2: #82a5d6;
    --rise:      #5cc191;
    --fall:      #d97b73;
    --rise-bg:   rgba(92,193,145,.14);
    --fall-bg:   rgba(217,123,115,.14);
    --cta-bg:       #d2955c;
    --cta-fg:       #1a0f05;
    --cta-hover-fg: #1a0f05;
    --bar:          #6a7fa8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:#0c0c0e; --surface:#191919; --sunken:#060606;
  --ink:#eef1f8; --ink-2:#aab2c8; --mute:#737b96; --faint:#4d5470;
  --rule:rgba(210,210,220,.12); --rule-2:rgba(210,210,220,.22);
  --accent:#d2955c; --accent-bg:rgba(210,149,92,.14);
  --navy:#191919; --on-navy:#eef1f8; --on-navy-2:#82a5d6;
  --rise:#5cc191; --fall:#d97b73;
  --rise-bg:rgba(92,193,145,.14); --fall-bg:rgba(217,123,115,.14);
  --cta-bg:#d2955c; --cta-fg:#1a0f05; --cta-hover-fg:#1a0f05; --bar:#6a7fa8;
  color-scheme: dark;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { font-size:16px; -webkit-text-size-adjust:100%; }
body {
  font-family:var(--sans); font-weight:400; line-height:1.6;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
}
a { color:inherit; }
button, input, textarea, select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }
@media (prefers-reduced-motion:reduce) { *{animation:none!important;transition:none!important} }

/* ── Shell ─────────────────────────────────────────────────────────────── */
#shell { min-height:100vh; }

/* Top bar in LayOvr's navy, using that project's on-navy pair. */
#topbar { position:sticky; top:0; z-index:80; background:var(--topbar); color:var(--on-navy); }
.bar { max-width:1240px; margin:0 auto; padding:0 var(--pad);
       display:flex; align-items:center; gap:20px; min-height:56px; flex-wrap:wrap; }
@media (max-width:760px){ .bar{ padding:10px var(--pad); gap:10px } }

.mark { display:flex; align-items:baseline; gap:9px; text-decoration:none; flex-shrink:0; }
.mark b { font-family:var(--mono); font-size:.82rem; font-weight:600;
          letter-spacing:.24em; color:var(--on-navy); }
.mark span { font-size:.68rem; color:var(--on-navy-2); }
@media (max-width:520px){ .mark span{ display:none } }

#nav { display:flex; gap:2px; flex-wrap:wrap; }
#nav a { font-size:.85rem; color:var(--on-navy-2); text-decoration:none;
         padding:7px 12px; border-radius:var(--r-control); white-space:nowrap; }
#nav a:hover { color:var(--on-navy); background:rgba(238,241,248,.09); }
#nav a.on { color:var(--navy); background:var(--on-navy); font-weight:600; }

/* Freshness is a permanent fixture of the chrome, not a footnote — every page
   should say how current the record is without the reader going looking. */
.freshness { margin-left:auto; font-family:var(--mono); font-size:.68rem;
             color:var(--on-navy-2); text-decoration:none; white-space:nowrap;
             display:flex; align-items:center; gap:7px;
             padding:6px 11px; border-radius:var(--r-control);
             border:1px solid rgba(130,165,214,.28); }
.freshness:hover { border-color:var(--on-navy-2); color:var(--on-navy); }
.freshness .dot { width:6px; height:6px; border-radius:50%; background:var(--rise);
                  flex-shrink:0; box-shadow:0 0 0 3px rgba(46,135,94,.22); }
.freshness.stale .dot { background:var(--fall); box-shadow:0 0 0 3px rgba(217,123,115,.22); }
.freshness b { font-weight:500; color:var(--on-navy); }
@media (max-width:760px){ .freshness{ margin-left:0; order:4 } }

#main { padding:0 var(--pad) 100px; min-width:0; }
.wrap { max-width:1240px; margin:0 auto; }

/* ── Search ────────────────────────────────────────────────────────────── */
#search-wrap { position:relative; flex:0 1 210px; }
@media (max-width:760px){ #search-wrap{ flex:1 1 160px; order:3 } }
#search {
  width:100%; background:rgba(238,241,248,.09); border:1px solid rgba(130,165,214,.28);
  border-radius:var(--r-control); padding:7px 11px; font-size:.78rem; color:var(--on-navy);
}
#search::placeholder { color:var(--on-navy-2); opacity:.68; }
#search:focus { border-color:var(--on-navy-2); background:rgba(238,241,248,.14); }
#results {
  position:absolute; z-index:60; left:0; right:0; top:calc(100% + 7px); min-width:240px;
  background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-card); max-height:340px; overflow-y:auto; display:none;
  box-shadow:0 10px 34px rgba(5,22,77,.20); padding:5px;
}
#results.open { display:block; }
#results a {
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
  padding:8px 10px; text-decoration:none; font-size:.79rem;
  border-radius:var(--r-control); color:var(--ink);
}
#results a:hover, #results a.cursor { background:var(--accent-bg); color:var(--accent); }
#results .k { font-family:var(--mono); font-size:.61rem; color:var(--mute);
              text-transform:uppercase; letter-spacing:.09em; }

/* ── Page header ───────────────────────────────────────────────────────── */
.crumbs { font-size:.67rem; font-weight:600; color:var(--mute); letter-spacing:.11em;
          text-transform:uppercase; padding:28px 0 0; display:flex; gap:7px; flex-wrap:wrap; }
.crumbs a { text-decoration:none; color:var(--mute); }
.crumbs a:hover { color:var(--accent); }
.crumbs em { font-style:normal; color:var(--faint); }

h1 { font-weight:600; font-size:clamp(1.95rem,4.4vw,2.85rem);
     line-height:1.08; letter-spacing:-.032em; margin:11px 0 0;
     text-wrap:balance; max-width:19ch; }
h1 .q { color:var(--accent); }
.lede { font-size:.98rem; font-weight:400; color:var(--ink-2); max-width:var(--measure);
        margin-top:14px; line-height:1.6; }
.page-head { padding-bottom:26px; border-bottom:1px solid var(--rule); margin-bottom:28px; }

h2 { font-weight:600; font-size:1.22rem; letter-spacing:-.022em;
     margin:0 0 3px; text-wrap:balance; line-height:1.24; }
h3 { font-size:.94rem; font-weight:600; margin:0 0 6px; }
p { max-width:var(--measure); }

section { margin-bottom:48px; }
.sec-head { display:flex; align-items:baseline; justify-content:space-between;
            gap:16px; margin-bottom:16px; flex-wrap:wrap; }
.sec-note { font-size:.8rem; color:var(--mute); max-width:52ch; }
/* LayOvr's eyebrow: uppercase, semibold, 1.2pt tracking. */
.eyebrow { font-size:.68rem; font-weight:600; letter-spacing:.11em;
           text-transform:uppercase; color:var(--accent); margin-bottom:8px; }

/* ── Readout strip ─────────────────────────────────────────────────────── */
.readout { display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
           border-top:1px solid var(--ink); border-bottom:1px solid var(--rule); }
.ro { padding:14px 16px 14px 0; border-right:1px solid var(--rule); }
.ro:last-child { border-right:none; }
.ro-v { font-family:var(--mono); font-size:1.5rem; font-weight:500; line-height:1.05;
        letter-spacing:-.025em; color:var(--ink); }
/* Readouts are sized for figures. A word set at that size looks like a
   mistake, so text values step down into the body face. */
.ro-v.txt { font-family:var(--sans); font-size:1.02rem; font-weight:600;
            letter-spacing:0; line-height:1.25; }
.ro-l { font-size:.71rem; color:var(--ink-2); margin-top:6px; }
.ro-s { font-size:.67rem; color:var(--mute); font-family:var(--mono); margin-top:3px; }

/* ── Signal rows (the insight grammar) ─────────────────────────────────── */
/* Flat, hairline-separated rows — a record to scan, not a stack of cards.
   The open state gets a tint and an accent edge instead of card chrome. */
.signals { border-top:1px solid var(--rule-2); }
.sig { border-bottom:1px solid var(--rule); border-left:2px solid transparent; }
.sig:hover { background:var(--surface); }
.sig.open { background:var(--surface); border-left-color:var(--accent); }
.sig-top {
  display:grid; grid-template-columns:128px minmax(0,1fr) auto; gap:18px;
  align-items:start; padding:16px 14px; width:100%; background:none; border:none;
  text-align:left; cursor:pointer; color:inherit;
}
@media (max-width:680px){ .sig-top{ grid-template-columns:1fr; gap:8px; padding:14px 12px } }
.sig-metric { font-family:var(--mono); font-size:1.5rem; font-weight:500; line-height:1;
              letter-spacing:-.035em; color:var(--ink); }
.sig-metric.up { color:var(--rise); } .sig-metric.down { color:var(--fall); }
.sig-mlabel { font-size:.67rem; color:var(--mute); margin-top:5px; line-height:1.35; }
.sig-title { font-size:1.02rem; font-weight:600; line-height:1.3; letter-spacing:-.017em;
             text-wrap:balance; color:var(--ink); }
.sig-sub { font-size:.79rem; color:var(--ink-2); margin-top:4px; }
.sig-where { font-family:var(--mono); font-size:.67rem; color:var(--mute); margin-top:4px; }
.sig-right { display:flex; align-items:center; gap:11px; }
@media (max-width:680px){ .sig-right{ justify-content:flex-start } }
.chev { font-family:var(--mono); color:var(--faint); font-size:.85rem;
        transition:transform .16s ease; }
.sig[open] .chev, .sig.open .chev { transform:rotate(90deg); }

.sig-body { display:none; padding:0 14px 20px; }
.sig.open .sig-body { display:block; }
.sig-grid { display:grid; grid-template-columns:128px minmax(0,1fr); gap:18px; }
@media (max-width:680px){ .sig-grid{ grid-template-columns:1fr } }
.sig-fields { display:flex; flex-direction:column; gap:16px; max-width:var(--measure); }
.field-k { font-size:.65rem; font-weight:600; letter-spacing:.11em;
           text-transform:uppercase; color:var(--mute); margin-bottom:5px; }
.field-v { font-size:.88rem; color:var(--ink); line-height:1.62; }
.field-v.caveat { color:var(--ink-2); }

/* ── Confidence ────────────────────────────────────────────────────────── */
.conf { font-size:.62rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
        padding:4px 9px; border:1px solid var(--rule-2); border-radius:var(--r-control);
        color:var(--ink-2); white-space:nowrap; }
.conf[data-c="strong"]   { color:var(--rise); border-color:var(--rise); background:var(--rise-bg); }
.conf[data-c="moderate"] { color:var(--accent); border-color:var(--accent); background:var(--accent-bg); }
.conf[data-c="observed"] { color:var(--ink-2); }
.conf[data-c="early"]    { color:var(--mute); border-style:dashed; }

/* ── Tables ────────────────────────────────────────────────────────────── */
.tbl-wrap { overflow-x:auto; border-top:1px solid var(--ink); }
table { width:100%; border-collapse:collapse; font-size:.83rem; }
th { font-size:.63rem; letter-spacing:.1em; text-transform:uppercase;
     color:var(--mute); text-align:left; font-weight:600; padding:10px 12px 9px 0;
     border-bottom:1px solid var(--rule); white-space:nowrap; }
th.num, td.num { text-align:right; }
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { color:var(--ink); }
th .dir { color:var(--accent); }
td { padding:8px 12px 8px 0; border-bottom:1px solid var(--rule); vertical-align:baseline; }
tbody tr:hover { background:var(--accent-bg); }
td.num, .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
td a { color:var(--ink); text-decoration:none; border-bottom:1px solid var(--rule-2); }
td a:hover { color:var(--accent); border-bottom-color:var(--accent); }
.code { font-family:var(--mono); font-size:.76rem; color:var(--accent); }
.dim { color:var(--mute); }
.faint { color:var(--faint); }
.unknown { color:var(--mute); font-style:italic; font-size:.8rem; }

/* Share bar sits behind the number, not beside it */
.barcell { position:relative; }
.barcell .fill { position:absolute; right:0; top:50%; transform:translateY(-50%);
                 height:15px; background:var(--accent-bg); border-right:2px solid var(--accent);
                 pointer-events:none; }
.barcell span { position:relative; }

/* ── Charts ────────────────────────────────────────────────────────────── */
.chart { display:flex; align-items:flex-end; gap:3px; height:150px;
         border-bottom:1px solid var(--ink); padding-top:8px; }
.cbar { flex:1; min-width:3px; display:flex; flex-direction:column; justify-content:flex-end;
        height:100%; position:relative; }
.cbar i { display:block; background:var(--bar); width:100%; border-radius:2px 2px 0 0; }
.cbar.hi i { background:var(--accent); }
.cbar.partial i { background:repeating-linear-gradient(45deg,var(--faint),var(--faint) 2px,transparent 2px,transparent 4px); }
.cbar:hover i { background:var(--accent); }
.caxis { display:flex; gap:3px; margin-top:6px; }
.caxis span { flex:1; min-width:3px; font-family:var(--mono); font-size:.6rem;
              color:var(--mute); text-align:center; overflow:hidden; white-space:nowrap; }

/* ── Globe ─────────────────────────────────────────────────────────────── */
#globe-layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:26px;
                align-items:start; }
@media (max-width:960px){ #globe-layout{ grid-template-columns:1fr } }

#globe-stage { position:relative; aspect-ratio:1/1;
               width:100%; max-width:min(100%, 540px); margin:0 auto; }
#globe-canvas { width:100%; height:100%; cursor:grab; touch-action:none; display:block; }
#globe-canvas.dragging { cursor:grabbing; }

/* Labels are positioned each frame from the projected point, so they track
   the sphere as it turns and disappear round the back. */
#globe-overlay { position:absolute; inset:0; pointer-events:none; }
.gl-label { position:absolute; transform:translate(-50%,-50%);
            font-size:.7rem; font-weight:600; letter-spacing:-.01em;
            background:var(--bg); color:var(--ink);
            border:1px solid var(--rule-2); border-radius:var(--r-control);
            padding:3px 8px; white-space:nowrap; pointer-events:auto;
            cursor:pointer; text-decoration:none; display:flex; align-items:center; gap:6px; }
.gl-label:hover { border-color:var(--accent); color:var(--accent); }
.gl-label b { font-family:var(--mono); font-weight:500; color:var(--mute); font-size:.66rem; }
.gl-label:hover b { color:var(--accent); }
.gl-label.hot { border-color:var(--accent); background:var(--accent); color:#fff; }
.gl-label.hot b { color:rgba(255,255,255,.8); }

.globe-legend { display:flex; gap:16px; flex-wrap:wrap; justify-content:center;
                margin-top:10px; font-size:.72rem; color:var(--mute); }
.globe-legend i { display:inline-block; width:8px; height:8px; border-radius:50%;
                  background:var(--accent); margin-right:6px; vertical-align:middle; }
.globe-legend i.home { background:var(--fall); }

.gl-list { display:flex; flex-direction:column; border-top:1px solid var(--ink); }
.gl-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:11px;
           align-items:baseline; padding:10px 6px; border-bottom:1px solid var(--rule);
           text-decoration:none; color:var(--ink); cursor:pointer; }
.gl-item:hover, .gl-item.hot { background:var(--surface); }
.gl-item .rank { font-family:var(--mono); font-size:.66rem; color:var(--faint); }
.gl-item .nm { font-size:.86rem; font-weight:500; }
.gl-item .sub { font-size:.71rem; color:var(--mute); margin-top:2px; }
.gl-item .n { font-family:var(--mono); font-size:.8rem; color:var(--ink-2); }

/* ── Hierarchy browser ─────────────────────────────────────────────────── */
.hier { display:grid; grid-template-columns:repeat(auto-fit,minmax(228px,1fr)); gap:0 24px; }
.hcol { border-top:1px solid var(--ink); }
.hcol h3 { font-size:.64rem; letter-spacing:.11em; text-transform:uppercase;
           color:var(--mute); font-weight:600; padding:9px 6px 8px;
           border-bottom:1px solid var(--rule); margin-bottom:2px; }
.hrow { display:flex; justify-content:space-between; align-items:baseline; gap:10px;
        padding:7px 6px; border-radius:var(--r-control); text-decoration:none; font-size:.84rem;
        color:var(--ink); }
.hrow:hover { color:var(--accent); background:var(--accent-bg); }
.hrow.on { color:var(--accent); font-weight:600; }
.hrow b { font-weight:inherit; }
.hrow .n { font-family:var(--mono); font-size:.76rem; color:var(--mute); }

/* ── Buttons / controls ────────────────────────────────────────────────── */
.btn {
  font-size:.73rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  background:var(--surface); border:1px solid var(--rule-2); border-radius:var(--r-control);
  padding:9px 15px; cursor:pointer; text-decoration:none; display:inline-block;
  color:var(--ink); white-space:nowrap;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
/* LayOvr reserves near-black for its two pivotal CTAs. Here the equivalent
   weight goes to the one action that actually runs something. */
.btn.primary { background:var(--cta-bg); color:var(--cta-fg); border-color:var(--cta-bg); }
.btn.primary:hover { background:var(--accent); border-color:var(--accent); color:var(--cta-hover-fg); }
.btn:disabled { opacity:.45; cursor:default; }

/* The query builder reads as a sentence, so the controls sit inline in the
   prose rather than in a labelled form grid. */
.qb { border-top:1px solid var(--ink); border-bottom:1px solid var(--rule);
      padding:20px 0; margin-bottom:6px; }
.qb-line { display:flex; flex-wrap:wrap; align-items:center; gap:9px;
           font-size:1.06rem; line-height:2.1; }
.qb-t { color:var(--ink-2); }
/* Native select chrome: the browser draws the arrow in the right colour for
   whichever theme is active, which a hand-drawn SVG arrow cannot do without
   a per-theme override that leaks into the un-stamped state. */
.qb select {
  font-family:inherit; font-size:1rem; font-weight:600; color:var(--accent);
  background:var(--accent-bg); border:1px solid transparent;
  border-radius:var(--r-control); padding:5px 8px; cursor:pointer; max-width:100%;
}
.qb select:hover { border-color:var(--accent); }

/* SQL is available, not prominent. */
.adv { margin-top:34px; border-top:1px solid var(--rule); padding-top:14px; }
.adv summary { font-size:.8rem; color:var(--mute); cursor:pointer; list-style:none;
               display:flex; align-items:center; gap:7px; padding:4px 0; }
.adv summary::-webkit-details-marker { display:none; }
.adv summary::before { content:'›'; font-family:var(--mono); transition:transform .16s ease;
                       display:inline-block; }
.adv[open] summary::before { transform:rotate(90deg); }
.adv summary:hover { color:var(--accent); }
.adv-note { font-size:.79rem; color:var(--mute); margin:10px 0 10px; max-width:var(--measure); }
.adv-bar { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }

/* ── SQL ───────────────────────────────────────────────────────────────── */
.sql-box { background:var(--sunken); border:1px solid var(--rule); border-radius:var(--r-control);
           padding:14px 16px; font-family:var(--mono); font-size:.76rem; line-height:1.65;
           white-space:pre; overflow-x:auto; color:var(--ink-2); }
textarea.sql-box { width:100%; resize:vertical; min-height:132px; color:var(--ink);
                   white-space:pre; tab-size:2; }
textarea.sql-box:focus { border-color:var(--accent); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
.chip { font-size:.78rem; padding:8px 13px; border:1px solid var(--rule-2);
        border-radius:var(--r-control); background:var(--surface); cursor:pointer;
        color:var(--ink-2); text-align:left; }
.chip:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }

/* ── Notices ───────────────────────────────────────────────────────────── */
.notice { border-left:3px solid var(--accent); background:var(--accent-bg);
          padding:14px 17px; font-size:.84rem; color:var(--ink-2);
          max-width:var(--measure); line-height:1.6;
          border-radius:0 var(--r-control) var(--r-control) 0; }
/* Burgundy is LayOvr's critical-only colour, so it appears here only when
   something is actually wrong. */
.notice.warn { border-left-color:var(--fall); background:var(--fall-bg); }
.notice b { color:var(--ink); font-weight:600; }
.status { font-family:var(--mono); font-size:.7rem; color:var(--mute); padding:10px 0; }
.empty { font-family:var(--mono); font-size:.76rem; color:var(--mute); padding:24px 0;
         border-bottom:1px solid var(--rule); }

/* ── Boot ──────────────────────────────────────────────────────────────── */
#boot { position:fixed; inset:0; z-index:900; background:var(--bg);
        display:flex; align-items:center; justify-content:center; }
#boot.gone { display:none; }
.boot-in { text-align:center; }
.boot-rings { width:54px; height:54px; margin:0 auto 18px; border-radius:50%;
              border:1px solid var(--rule-2); position:relative; }
.boot-rings::after { content:''; position:absolute; inset:11px; border-radius:50%;
                     border:1.5px solid var(--accent); animation:ping 1.8s ease-out infinite; }
@keyframes ping { 0%{transform:scale(.4);opacity:1} 100%{transform:scale(1.5);opacity:0} }
.boot-t { font-size:.72rem; font-weight:600; letter-spacing:.13em;
          text-transform:uppercase; color:var(--mute); }

.dl { display:flex; flex-direction:column; border-top:1px solid var(--ink); }
.dl-row { display:flex; justify-content:space-between; align-items:baseline; gap:14px;
          padding:11px 4px; border-bottom:1px solid var(--rule); flex-wrap:wrap; }
.dl-row:hover { background:var(--surface); }
.dl-row .meta { font-family:var(--mono); font-size:.7rem; color:var(--mute); }
.prose p { margin-bottom:13px; font-size:.9rem; line-height:1.68; }
.prose h3 { margin:28px 0 8px; font-size:.7rem; font-weight:600; letter-spacing:.11em;
            text-transform:uppercase; color:var(--accent); }
.prose ul { margin:0 0 13px 1.1em; max-width:var(--measure); }
.prose li { font-size:.9rem; margin-bottom:5px; line-height:1.62; }
</style>
</head>
<body>

<div id="boot"><div class="boot-in">
  <div class="boot-rings"></div>
  <div class="boot-t" id="boot-t">Reading the record</div>
</div></div>

<div id="shell">
  <header id="topbar">
    <div class="bar">
      <a class="mark" href="#/"><b>OVRHEAD</b><span>Aarhus</span></a>
      <nav id="nav">
        <a href="#/"        data-r="/"       >Signals</a>
        <a href="#/globe"   data-r="/globe"  >Globe</a>
        <a href="#/explore" data-r="/explore">Explore</a>
        <a href="#/ask"     data-r="/ask"    >Ask</a>
        <a href="#/data"    data-r="/data"   >Data</a>
        <a href="#/method"  data-r="/method" >Method</a>
      </nav>
      <div id="search-wrap">
        <input id="search" type="search" placeholder="Country, airline, aircraft…" autocomplete="off" spellcheck="false">
        <div id="results"></div>
      </div>
      <a class="freshness" href="#/data" id="stamp" title="When the record was last updated"></a>
    </div>
  </header>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>

<script type="module">
const BASE = new URL('./data/adsb/', location.href).href;

/* ── State ───────────────────────────────────────────────────────────────
   Two layers. `S` is the precomputed summary and arrives in one small fetch,
   which is what every page paints from. `deep` is DuckDB with the real flight
   table, loaded only when a page actually needs to run a query. */
let S = null, TAX = null;
let deep = null, deepPromise = null;

const $  = s => document.querySelector(s);
const el = document.getElementById.bind(document);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n = v => Number(v ?? 0).toLocaleString('en-US');
const pct = v => (v > 0 ? '+' : '') + Number(v).toFixed(0) + '%';

/** Arrow hands timestamps back as epoch milliseconds, Dates, or strings
 *  depending on the column. Normalise all three to "YYYY-MM-DD HH:MM". */
function ts(v) {
  if (v == null) return '—';
  let d;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number' || typeof v === 'bigint') {
    const ms = Number(v);
    d = new Date(ms < 1e12 ? ms * 1000 : ms);   // seconds vs milliseconds
  } else {
    d = new Date(String(v));
    if (isNaN(d)) return String(v).slice(0, 16);
  }
  return isNaN(d) ? '—' : d.toISOString().slice(0, 16).replace('T', ' ');
}
const looksLikeTime = c => /(_at|_seen|^ts$|time|date|day)$/i.test(c);
const boot = t => { const b = el('boot-t'); if (b) b.textContent = t; };

const CONF_TEXT = {
  strong:   'Large, consistent and well sampled.',
  moderate: 'Enough history and volume to be worth attention.',
  observed: 'Directly counted. No inference involved.',
  early:    'Real, but the record is too short to call it a trend.',
};

/* ── Deep layer: DuckDB-Wasm ─────────────────────────────────────────────
   Loaded on demand. We deliberately do NOT load aircraft_db.parquet (4.7 MB):
   type, registration and description are already denormalised onto each
   flight row, so the browser never needs the full 636k-aircraft table. */
async function getDeep() {
  if (deep) return deep;
  if (deepPromise) return deepPromise;
  deepPromise = (async () => {
    const duckdb = await import('https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.29.0/+esm');
    const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
    const workerUrl = URL.createObjectURL(
      new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' }));
    const worker = new Worker(workerUrl);
    const db = new duckdb.AsyncDuckDB(new duckdb.VoidLogger(), worker);
    await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
    URL.revokeObjectURL(workerUrl);
    const conn = await db.connect();

    const man = await fetch(BASE + 'manifest.json').then(r => r.json());
    for (const f of man.flights) {
      const buf = await fetch(BASE + f.path.replace(/^data\/adsb\//, '')).then(r => r.arrayBuffer());
      await db.registerFileBuffer(f.name, new Uint8Array(buf));
    }
    const names = man.flights.map(f => `'${f.name}'`).join(',');

    // Country attribution as a pure range join. ICAO addresses are always six
    // lowercase hex digits, so comparing them as strings is equivalent to
    // comparing the integers — no casting needed. Narrowest block wins, which
    // is how sub-allocations (Iceland inside Ireland's range) resolve.
    const blocks = TAX.blocks.map(b =>
      `('${b.lo_hex}','${b.hi_hex}','${b.cc}',${b.width})`).join(',');
    await conn.query(`CREATE TABLE country_block(lo VARCHAR, hi VARCHAR, cc VARCHAR, width BIGINT)`);
    await conn.query(`INSERT INTO country_block VALUES ${blocks}`);

    const cRows = Object.entries(TAX.countries).map(([cc, m]) =>
      `('${cc}',${q(m.name)},${q(m.region)},${q(m.continent)})`).join(',');
    await conn.query(`CREATE TABLE country(cc VARCHAR, name VARCHAR, region VARCHAR, continent VARCHAR)`);
    await conn.query(`INSERT INTO country VALUES ${cRows}`);

    await conn.query(`CREATE VIEW _raw AS SELECT * FROM read_parquet([${names}], union_by_name=true)`);
    await conn.query(`
      CREATE VIEW flights AS
      SELECT r.*,
             c.cc         AS reg_country,
             ct.name      AS reg_country_name,
             ct.region    AS reg_region,
             ct.continent AS reg_continent,
             CASE WHEN r.ac_type SIMILAR TO '(A30|A31|A33|A34|A35|A38|B74|B76|B77|B78|IL9|MD11|A124).*'
                  THEN 'widebody' ELSE 'narrowbody' END AS body,
             r.airline_prefix IN ('FDX','UPS','GTI','CLX','CKS','ABW','CAO','CKK','GEC','BOX',
                                  'SQC','MPH','TAY','ICV','RCF') AS is_cargo,
             TO_TIMESTAMP(r.first_seen) AS seen_at
      FROM _raw r
      LEFT JOIN country_block c
             ON r.hex >= c.lo AND r.hex <= c.hi
            AND c.width = (SELECT MIN(b2.width) FROM country_block b2
                           WHERE r.hex >= b2.lo AND r.hex <= b2.hi)
      LEFT JOIN country ct ON ct.cc = c.cc`);
    deep = { db, conn };
    return deep;
  })();
  return deepPromise;
}
const q = v => v == null ? 'NULL' : `'${String(v).replace(/'/g, "''")}'`;

async function query(sql) {
  const { conn } = await getDeep();
  const r = await conn.query(sql);
  return { rows: r.toArray().map(x => x.toJSON ? x.toJSON() : x),
           cols: (r.schema?.fields ?? []).map(f => f.name) };
}

/* ── Shared components ───────────────────────────────────────────────── */
const confChip = c => `<span class="conf" data-c="${esc(c)}" title="${esc(CONF_TEXT[c] || '')}">${esc(c)}</span>`;

function readout(items) {
  return `<div class="readout">${items.map(i => `
    <div class="ro">
      <div class="ro-v${/[A-Za-z]{2}/.test(String(i.v)) ? ' txt' : ''}">${i.v}</div>
      <div class="ro-l">${esc(i.l)}</div>
      ${i.s ? `<div class="ro-s">${esc(i.s)}</div>` : ''}
    </div>`).join('')}</div>`;
}

/** Bar chart. Partial buckets are hatched so an incomplete day never reads
 *  as a genuine dip. */
function chart(data, { key, val, partial, labelEvery = 1 } = {}) {
  if (!data.length) return `<div class="empty">Nothing recorded yet.</div>`;
  const max = Math.max(...data.map(d => +d[val]), 1);
  const peak = data.reduce((a, b) => (+b[val] > +a[val] ? b : a));
  const bars = data.map(d => {
    const isP = partial && d[partial];
    return `<div class="cbar ${d === peak ? 'hi' : ''} ${isP ? 'partial' : ''}"
      title="${esc(d[key])} — ${n(d[val])}${isP ? ' (partial coverage)' : ''}">
      <i style="height:${(+d[val] / max * 100).toFixed(1)}%"></i></div>`;
  }).join('');
  // Dates read best trimmed to MM-DD, but anything else has to keep its start
  // or it turns to nonsense ("Sweden" -> "weden").
  const tick = v => {
    const t = String(v ?? '');
    return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(5, 10) : t.slice(0, 8);
  };
  const axis = data.map((d, i) =>
    `<span title="${esc(d[key])}">${i % labelEvery === 0 ? esc(tick(d[key])) : ''}</span>`).join('');
  return `<div class="chart">${bars}</div><div class="caxis">${axis}</div>`;
}

/** A sortable, drillable entity table. `cols` describe how to read each row. */
function table(rows, cols, { max = 40, sortKey, sortDir = -1, id = 't' } = {}) {
  if (!rows.length) return `<div class="empty">No rows.</div>`;
  const sorted = sortKey
    ? [...rows].sort((a, b) => {
        const x = a[sortKey], y = b[sortKey];
        if (typeof x === 'number' || typeof y === 'number')
          return ((y ?? -Infinity) - (x ?? -Infinity)) * -sortDir * -1;
        return String(x ?? '').localeCompare(String(y ?? '')) * sortDir * -1;
      })
    : rows;
  const top = Math.max(...rows.map(r => +r[cols.find(c => c.bar)?.k] || 0), 1);
  const head = cols.map(c =>
    `<th class="${c.num ? 'num' : ''} sortable" data-t="${id}" data-k="${esc(c.k)}">
      ${esc(c.h)}${sortKey === c.k ? `<span class="dir"> ${sortDir > 0 ? '↑' : '↓'}</span>` : ''}
     </th>`).join('');
  const body = sorted.slice(0, max).map(r => `<tr>${cols.map(c => {
    const v = c.render ? c.render(r) : esc(r[c.k] ?? '—');
    if (c.bar) return `<td class="num barcell">
        <div class="fill" style="width:${(+r[c.k] / top * 100).toFixed(1)}%"></div>
        <span>${v}</span></td>`;
    return `<td class="${c.num ? 'num' : ''}">${v}</td>`;
  }).join('')}</tr>`).join('');
  const more = rows.length > max
    ? `<div class="status">Showing ${max} of ${n(rows.length)}.</div>` : '';
  return `<div class="tbl-wrap"><table data-tid="${id}">
    <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}`;
}

/* Sorting is delegated: tables re-render through the view that owns them. */
const sortState = {};
document.addEventListener('click', e => {
  const th = e.target.closest('th.sortable');
  if (!th) return;
  const t = th.dataset.t, k = th.dataset.k;
  const cur = sortState[t] || {};
  sortState[t] = { key: k, dir: cur.key === k ? -(cur.dir || -1) : -1 };
  route();
});

function changeCell(v) {
  if (v == null) return `<span class="faint" title="Not enough baseline to compare">—</span>`;
  return `<span style="color:var(--${v >= 0 ? 'rise' : 'fall'})">${pct(v)}</span>`;
}
const countryName = cc => TAX?.countries?.[cc]?.name || cc;

/* ── Signals view ────────────────────────────────────────────────────── */
function viewSignals() {
  const t = S.totals, w = S.window;
  const stale = (Date.now() - new Date(S.generated_at)) / 3.6e6;

  const sigs = S.signals.map((s, i) => {
    const dir = /up |↑|\+/.test(s.metric) && s.metric.startsWith('+') ? 'up'
              : s.metric.startsWith('-') ? 'down' : '';
    return `<div class="sig" id="${esc(s.id)}">
      <button class="sig-top" data-sig="${i}" aria-expanded="false">
        <div>
          <div class="sig-metric ${dir}">${esc(s.metric)}</div>
          <div class="sig-mlabel">${esc(s.metric_label)}</div>
        </div>
        <div>
          <div class="sig-title">${esc(s.title)}</div>
          ${s.comparison ? `<div class="sig-sub">${esc(s.comparison)}</div>` : ''}
          ${s.where ? `<div class="sig-where">${esc(s.where)}</div>` : ''}
        </div>
        <div class="sig-right">${confChip(s.confidence)}<span class="chev">›</span></div>
      </button>
      <div class="sig-body"><div class="sig-grid"><div></div><div class="sig-fields">
        <div><div class="field-k">What it might mean</div>
             <div class="field-v">${esc(s.interpretation)}</div></div>
        <div><div class="field-k">What it does not show</div>
             <div class="field-v caveat">${esc(s.caveat)}</div></div>
        <div><a class="btn" href="#/ask?sql=${
               encodeURIComponent(s.sql)}">See the evidence →</a></div>
      </div></div></div>
    </div>`;
  }).join('');

  const nordic = S.regions.find(r => r.key === 'Nordics');
  return `
  <header class="page-head">
    <div class="crumbs"><em>Observatory</em></div>
    <h1>Read the world from the sky above <span class="q">Aarhus</span>.</h1>
    <p class="lede">One antenna records every aircraft that passes overhead. These are the
      signals we can honestly draw from it — evidence and limits attached.</p>
  </header>

  ${stale > 30 ? `<div class="notice warn" style="margin-bottom:34px">
    <b>The record is behind.</b> Last updated ${stale.toFixed(0)} hours ago — the receiver
    or the nightly ingest may have stopped.</div>` : ''}

  <section>
    ${readout([
      { v: n(t.flights),   l: 'Flights recorded', s: `over ${w.days_observed} days` },
      { v: n(t.aircraft),  l: 'Distinct aircraft', s: `${n(t.operators)} operators` },
      { v: n(t.countries), l: 'Registration countries' },
      { v: n(t.widebody),  l: 'Wide-body movements',
        s: `${(t.widebody / t.flights * 100).toFixed(0)}% of traffic` },
    ])}
  </section>

  <section>
    <div class="sec-head">
      <div><div class="eyebrow">What the data is telling us</div>
        <h2>Signals</h2></div>
      <p class="sec-note">Open one for what it might mean, and what it doesn't.</p>
    </div>
    <div class="signals">${sigs}</div>
  </section>

  <section>
    <div class="sec-head">
      <div><div class="eyebrow">Coverage</div><h2>Daily record</h2></div>
      <p class="sec-note">Hatched bars are partial days, excluded from comparisons.</p>
    </div>
    ${chart(S.daily, { key: 'day', val: 'flights', partial: 'partial' })}
  </section>

  <section>
    <div class="sec-head">
      <div><div class="eyebrow">Where the traffic is registered</div>
        <h2>Top countries</h2></div>
      <a class="btn" href="#/explore">Explore all →</a>
    </div>
    ${table(S.countries.slice(0, 12), COUNTRY_COLS, { id: 'home-c', max: 12,
       ...(sortState['home-c'] || { sortKey: 'flights', sortDir: -1 }) })}
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Rhythm</div>
      <h2>Traffic by hour</h2></div>
      <p class="sec-note">All days combined, UTC.</p></div>
    ${chart(S.hourly, { key: 'hour', val: 'flights', labelEvery: 3 })}
  </section>`;
}

const COUNTRY_COLS = [
  { k: 'name', h: 'Country', render: r =>
      `<a href="#/place/${esc(r.key)}">${esc(r.name)}</a>` },
  { k: 'region', h: 'Region', render: r =>
      r.region ? `<a href="#/region/${encodeURIComponent(r.region)}" class="dim">${esc(r.region)}</a>` : '—' },
  { k: 'flights', h: 'Flights', num: true, bar: true, render: r => n(r.flights) },
  { k: 'aircraft', h: 'Aircraft', num: true, render: r => n(r.aircraft) },
  { k: 'widebody', h: 'Wide-body', num: true, render: r =>
      `${n(r.widebody)} <span class="faint">${(r.widebody / r.flights * 100).toFixed(0)}%</span>` },
  { k: 'change_pct', h: 'Δ 24h', num: true, render: r => changeCell(r.change_pct) },
];

/* ── Explore: the hierarchy ──────────────────────────────────────────── */
function viewExplore() {
  const cont = S.continents, reg = S.regions;
  const col = (title, rows, href, keyName = 'key') => `
    <div class="hcol"><h3>${esc(title)}</h3>
      ${rows.map(r => `<a class="hrow" href="${href(r)}">
        <b>${esc(r.name || r[keyName])}</b>
        <span class="n">${n(r.flights)}</span></a>`).join('')}
    </div>`;

  return `
  <header class="page-head">
    <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Explore</div>
    <h1>Where the traffic is registered</h1>
    <p class="lede">Every aircraft broadcasts an address allocated to a state, so we can tell
      where 99% of them are registered — though not where they took off or where they're
      headed. Start anywhere and drill down.</p>
  </header>

  <section>
    <div class="hier">
      ${col('Continent', cont, r => `#/continent/${encodeURIComponent(r.key)}`)}
      ${col('Economic region', reg.slice(0, 14), r => `#/region/${encodeURIComponent(r.key)}`)}
      ${col('Country', S.countries.slice(0, 14), r => `#/place/${r.key}`, 'name')}
    </div>
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Full table</div>
      <h2>All ${S.countries.length} countries</h2></div></div>
    ${table(S.countries, COUNTRY_COLS, { id: 'exp-c', max: 200,
      ...(sortState['exp-c'] || { sortKey: 'flights', sortDir: -1 }) })}
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Operators</div><h2>Airlines seen</h2></div></div>
    ${table(S.operators, [
      { k: 'key', h: 'Code', render: r => `<a href="#/operator/${esc(r.key)}" class="code">${esc(r.key)}</a>` },
      { k: 'name', h: 'Airline', render: r => r.name
          ? esc(r.name) + (r.cargo_operator ? ' <span class="faint">· all-cargo</span>' : '')
          : `<span class="unknown">Not in our airline table</span>` },
      { k: 'flights', h: 'Flights', num: true, bar: true, render: r => n(r.flights) },
      { k: 'aircraft', h: 'Aircraft', num: true, render: r => n(r.aircraft) },
      { k: 'widebody', h: 'Wide-body', num: true, render: r => n(r.widebody) },
    ], { id: 'exp-o', max: 60, ...(sortState['exp-o'] || { sortKey: 'flights', sortDir: -1 }) })}
  </section>

  <section>
    <div class="sec-head"><div><div class="eyebrow">Fleet</div><h2>Aircraft types</h2></div></div>
    ${table(S.types, [
      { k: 'key', h: 'Type', render: r => `<a href="#/type/${esc(r.key)}" class="code">${esc(r.key)}</a>` },
      { k: 'desc', h: 'Aircraft', render: r => esc(r.desc || '—') },
      { k: 'flights', h: 'Flights', num: true, bar: true, render: r => n(r.flights) },
      { k: 'aircraft', h: 'Airframes', num: true, render: r => n(r.aircraft) },
      { k: 'widebody_type', h: 'Class', render: r =>
          r.widebody_type ? '<span class="code">wide-body</span>' : '<span class="dim">narrow-body</span>' },
    ], { id: 'exp-t', max: 60, ...(sortState['exp-t'] || { sortKey: 'flights', sortDir: -1 }) })}
  </section>`;
}

/* ── Globe ───────────────────────────────────────────────────────────────
   An orthographic projection drawn straight to canvas. The previous version
   of this site pulled three.js, globe.gl, topojson and world-atlas from a CDN
   to do this; the coastline is now baked into land.json and the projection is
   about forty lines of trigonometry. */
let LAND = null, globeStop = null;

function viewGlobe() {
  const top = S.countries.filter(c => c.lat != null || TAX.countries[c.key]).slice(0, 40);
  return `
  <header class="page-head">
    <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Globe</div>
    <h1>Where the aircraft <span class="q">come from</span></h1>
    <p class="lede">Every country whose aircraft have passed over Aarhus, sized by how many.
      Drag to spin.</p>
  </header>

  <div id="globe-layout">
    <div>
      <div id="globe-stage">
        <canvas id="globe-canvas"></canvas>
        <div id="globe-overlay"></div>
      </div>
      <div class="globe-legend">
        <span><i class="home"></i>Aarhus — the antenna</span>
        <span><i></i>Registration country, sized by flights</span>
      </div>
    </div>
    <div>
      <div class="sec-head" style="margin-bottom:12px">
        <div><div class="eyebrow">Ranked</div><h2>Top origins</h2></div>
      </div>
      <div class="gl-list">
        ${top.map((c, i) => `
          <a class="gl-item" href="#/place/${esc(c.key)}" data-cc="${esc(c.key)}">
            <span class="rank">${String(i + 1).padStart(2, '0')}</span>
            <span><span class="nm">${esc(c.name)}</span>
              <span class="sub">${esc(c.region || '')}${
                c.widebody ? ` · ${Math.round(c.widebody / c.flights * 100)}% wide-body` : ''}</span></span>
            <span class="n">${n(c.flights)}</span>
          </a>`).join('')}
      </div>
    </div>
  </div>`;
}

async function initGlobe() {
  const cv = el('globe-canvas'), overlay = el('globe-overlay');
  if (!cv) return;
  if (!LAND) {
    try { LAND = await fetch(BASE + 'land.json').then(r => r.json()); }
    catch { LAND = []; }
  }

  const pts = S.countries.map(c => {
    const m = TAX.countries[c.key];
    return m && m.lat != null
      ? { ...c, lat: m.lat, lng: m.lng } : null;
  }).filter(Boolean);
  const HOME = { lat: S.origin?.lat ?? 56.16, lng: S.origin?.lng ?? 10.20 };
  const maxF = Math.max(...pts.map(p => p.flights), 1);
  const LABELLED = pts.slice(0, 8);

  // rotP is the latitude at the centre of the disc. Aarhus sits at 56°N, so
  // tilting to ~38° puts the antenna and its corridors in the upper half
  // without pushing the southern hemisphere off the back entirely.
  let rotL = -HOME.lng, rotP = 38, spin = true, hot = null;
  let dragging = false, lastX = 0, lastY = 0;

  const css = getComputedStyle(document.documentElement);
  const tok = k => css.getPropertyValue(k).trim();

  const ctx = cv.getContext('2d');
  let R = 0, cx = 0, cy = 0;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = cv.clientWidth, h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    R = Math.min(w, h) / 2 - 34; cx = w / 2; cy = h / 2;
  }

  /** Orthographic projection. Returns null when the point faces away. */
  function project(lat, lng) {
    const l = (lng + rotL) * Math.PI / 180, p = lat * Math.PI / 180;
    const p0 = rotP * Math.PI / 180;
    const cosc = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l);
    if (cosc < 0) return null;
    return {
      x: cx + R * Math.cos(p) * Math.sin(l),
      y: cy - R * (Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l)),
      z: cosc,
    };
  }

  /** Spherical interpolation, so an arc follows the great circle. */
  function arcPoints(a, b, steps = 48) {
    const toXYZ = (lat, lng) => {
      const p = lat * Math.PI / 180, l = lng * Math.PI / 180;
      return [Math.cos(p) * Math.cos(l), Math.cos(p) * Math.sin(l), Math.sin(p)];
    };
    const A = toXYZ(a.lat, a.lng), B = toXYZ(b.lat, b.lng);
    const dot = Math.max(-1, Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2]));
    const om = Math.acos(dot);
    const out = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      let v;
      if (om < 1e-6) v = A;
      else {
        const s1 = Math.sin((1 - t) * om) / Math.sin(om), s2 = Math.sin(t * om) / Math.sin(om);
        v = [A[0] * s1 + B[0] * s2, A[1] * s1 + B[1] * s2, A[2] * s1 + B[2] * s2];
      }
      out.push({ lat: Math.asin(v[2]) * 180 / Math.PI,
                 lng: Math.atan2(v[1], v[0]) * 180 / Math.PI });
    }
    return out;
  }

  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight;
    ctx.clearRect(0, 0, w, h);

    // Sphere
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = tok('--surface'); ctx.fill();
    ctx.strokeStyle = tok('--rule-2'); ctx.lineWidth = 1; ctx.stroke();

    // Graticule every 30°
    ctx.strokeStyle = tok('--rule'); ctx.lineWidth = 1;
    for (let lat = -60; lat <= 60; lat += 30) {
      ctx.beginPath(); let started = false;
      for (let lng = -180; lng <= 180; lng += 3) {
        const q = project(lat, lng);
        if (!q) { started = false; continue; }
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      ctx.stroke();
    }
    for (let lng = -180; lng < 180; lng += 30) {
      ctx.beginPath(); let started = false;
      for (let lat = -90; lat <= 90; lat += 3) {
        const q = project(lat, lng);
        if (!q) { started = false; continue; }
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      ctx.stroke();
    }

    // Land
    ctx.fillStyle = tok('--sunken'); ctx.strokeStyle = tok('--rule-2'); ctx.lineWidth = .7;
    for (const ring of LAND) {
      ctx.beginPath(); let started = false, any = false;
      for (const [lng, lat] of ring) {
        const q = project(lat, lng);
        if (!q) { started = false; continue; }
        any = true;
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      if (any) { ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }

    // Corridor arcs, faintest first so the busiest sit on top
    const arcs = pts.slice(0, 22);
    for (const p of arcs) {
      const isHot = hot === p.key;
      ctx.beginPath(); let started = false;
      for (const s of arcPoints(p, HOME)) {
        const q = project(s.lat, s.lng);
        if (!q) { started = false; continue; }
        started ? ctx.lineTo(q.x, q.y) : (ctx.moveTo(q.x, q.y), started = true);
      }
      ctx.strokeStyle = tok('--accent');
      ctx.globalAlpha = isHot ? .95 : .13 + .3 * (p.flights / maxF);
      ctx.lineWidth = isHot ? 2 : 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Country markers
    for (const p of pts) {
      const q = project(p.lat, p.lng);
      if (!q) continue;
      const r = 2.5 + 9 * Math.sqrt(p.flights / maxF);
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2);
      ctx.fillStyle = tok('--accent');
      ctx.globalAlpha = hot === p.key ? 1 : .28 + .6 * q.z;
      ctx.fill();
      if (hot === p.key) {
        ctx.globalAlpha = 1; ctx.lineWidth = 2;
        ctx.strokeStyle = tok('--ink'); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // The antenna
    const hq = project(HOME.lat, HOME.lng);
    if (hq) {
      ctx.beginPath(); ctx.arc(hq.x, hq.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = tok('--fall'); ctx.fill();
      ctx.beginPath(); ctx.arc(hq.x, hq.y, 11, 0, Math.PI * 2);
      ctx.strokeStyle = tok('--fall'); ctx.globalAlpha = .45; ctx.lineWidth = 1.5;
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    positionLabels();
  }

  // Overlay labels are real DOM so they stay crisp, clickable and accessible.
  const labelEls = new Map();
  overlay.innerHTML = '';
  for (const p of LABELLED) {
    const a = document.createElement('a');
    a.className = 'gl-label';
    a.href = `#/place/${p.key}`;
    a.innerHTML = `${esc(p.name)} <b>${n(p.flights)}</b>`;
    a.addEventListener('pointerenter', () => { hot = p.key; syncList(); });
    a.addEventListener('pointerleave', () => { hot = null; syncList(); });
    overlay.appendChild(a);
    labelEls.set(p.key, a);
  }
  /* Europe is dense: at this scale half a dozen countries land within a few
     pixels of each other. Place labels greedily by traffic and drop any that
     would collide with one already placed, so the busiest always wins and the
     overlay never turns into a pile. */
  function positionLabels() {
    const placed = [];
    for (const p of LABELLED) {
      const a = labelEls.get(p.key), q = project(p.lat, p.lng);
      if (!q || q.z < 0.18) { a.style.display = 'none'; continue; }

      const w = a.offsetWidth || 76, h = a.offsetHeight || 22;
      const x = q.x, y = q.y - 15 - 9 * Math.sqrt(p.flights / maxF);
      const box = { l: x - w / 2, r: x + w / 2, t: y - h / 2, b: y + h / 2 };
      const clash = hot !== p.key && placed.some(o =>
        box.l < o.r + 4 && box.r > o.l - 4 && box.t < o.b + 4 && box.b > o.t - 4);
      if (clash) { a.style.display = 'none'; continue; }

      placed.push(box);
      a.style.display = '';
      a.style.left = x + 'px';
      a.style.top  = y + 'px';
      a.style.opacity = Math.min(1, (q.z - 0.18) * 4);
      a.classList.toggle('hot', hot === p.key);
    }
  }
  function syncList() {
    document.querySelectorAll('.gl-item').forEach(x =>
      x.classList.toggle('hot', x.dataset.cc === hot));
  }

  // Hovering the ranked list turns the globe to that country.
  document.querySelectorAll('.gl-item').forEach(item => {
    item.addEventListener('pointerenter', () => {
      hot = item.dataset.cc;
      const p = pts.find(x => x.key === hot);
      if (p) { targetL = -p.lng; targetP = Math.max(-55, Math.min(60, p.lat * .8)); turning = true; }
      syncList();
    });
    item.addEventListener('pointerleave', () => { hot = null; turning = false; syncList(); });
  });

  let targetL = rotL, targetP = rotP, turning = false;

  cv.addEventListener('pointerdown', e => {
    dragging = true; spin = false; turning = false;
    lastX = e.clientX; lastY = e.clientY;
    cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    rotL += (e.clientX - lastX) * 0.32;
    rotP = Math.max(-80, Math.min(80, rotP - (e.clientY - lastY) * 0.32));
    lastX = e.clientX; lastY = e.clientY;
  });
  const endDrag = () => { dragging = false; cv.classList.remove('dragging');
                          setTimeout(() => { if (!dragging) spin = true; }, 2200); };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf;
  function frame() {
    if (turning) {
      let d = ((targetL - rotL + 540) % 360) - 180;
      rotL += d * 0.12; rotP += (targetP - rotP) * 0.12;
    } else if (spin && !reduce) {
      rotL -= 0.085;
    }
    draw();
    raf = requestAnimationFrame(frame);
  }
  const ro = new ResizeObserver(() => { resize(); draw(); });
  ro.observe(cv);
  resize(); frame();

  globeStop = () => { cancelAnimationFrame(raf); ro.disconnect(); globeStop = null; };
}

/* ── Entity pages ────────────────────────────────────────────────────── */
function entityShell({ crumbs, title, lede, stats, body }) {
  return `<header class="page-head">
    <div class="crumbs">${crumbs}</div>
    <h1>${title}</h1>
    ${lede ? `<p class="lede">${lede}</p>` : ''}
  </header>
  ${stats ? `<section>${stats}</section>` : ''}
  ${body}`;
}

function viewPlace(cc) {
  const c = S.countries.find(x => x.key === cc);
  if (!c) return notFound(`No aircraft registered in ${esc(countryName(cc))} have been recorded yet.`);
  const share = (c.flights / S.totals.flights * 100).toFixed(1);
  const wbShare = c.flights ? (c.widebody / c.flights * 100).toFixed(0) : 0;
  const isFar = c.continent && c.continent !== 'Europe';

  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em>
             <a href="#/continent/${encodeURIComponent(c.continent)}">${esc(c.continent)}</a> <em>/</em>
             <a href="#/region/${encodeURIComponent(c.region)}">${esc(c.region)}</a> <em>/</em> ${esc(c.name)}`,
    title: `${esc(c.name)}`,
    lede: isFar
      ? `${esc(c.name)} has no scheduled service to Aarhus. Everything below is aircraft at
         cruise altitude on intercontinental routings, passing through this antenna's range.`
      : `Aircraft registered in ${esc(c.name)}, as recorded passing over Aarhus.`,
    stats: readout([
      { v: n(c.flights),  l: 'Flights', s: `${share}% of all traffic` },
      { v: n(c.aircraft), l: 'Distinct aircraft' },
      { v: n(c.widebody), l: 'Wide-body', s: `${wbShare}% of its traffic` },
      { v: c.change_pct == null ? '—' : pct(c.change_pct), l: 'Change vs prev. 24h',
        s: c.change_pct == null ? 'baseline too short' : null },
    ]),
    body: `
      <section>
        <div class="sec-head"><div><div class="eyebrow">Evidence</div>
          <h2>Every ${esc(c.name)} flight on record</h2></div>
          <a class="btn" href="#/ask?sql=${encodeURIComponent(
            `SELECT callsign, ac_type, ac_desc, reg, seen_at, airline\nFROM flights\nWHERE reg_country = '${cc}'\nORDER BY first_seen DESC;`)}">Open in Ask →</a>
        </div>
        <div id="lazy" data-kind="place" data-arg="${esc(cc)}">
          <div class="status">Loading the flight table…</div></div>
      </section>

      <section>
        <div class="sec-head"><div><div class="eyebrow">Context</div>
          <h2>How ${esc(c.name)} compares in ${esc(c.region)}</h2></div></div>
        ${table(S.countries.filter(x => x.region === c.region), COUNTRY_COLS,
          { id: 'pl-c', max: 20, sortKey: 'flights', sortDir: -1 })}
      </section>`,
  });
}

function viewGroup(kind, name) {
  const list = kind === 'region' ? S.regions : S.continents;
  const g = list.find(x => x.key === name);
  if (!g) return notFound(`Nothing recorded for ${esc(name)} yet.`);
  const kids = S.countries.filter(c => (kind === 'region' ? c.region : c.continent) === name);
  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em> ${esc(name)}`,
    title: esc(name),
    lede: `${kids.length} registration countries, aggregated.`,
    stats: readout([
      { v: n(g.flights), l: 'Flights', s: `${g.share}% of all traffic` },
      { v: n(kids.length), l: 'Countries' },
      { v: n(g.aircraft), l: 'Distinct aircraft' },
      { v: g.change_pct == null ? '—' : pct(g.change_pct), l: 'Change vs prev. 24h',
        s: g.change_pct == null ? 'baseline too short' : `${n(g.widebody)} wide-body` },
    ]),
    body: `<section>
      <div class="sec-head"><div><div class="eyebrow">Breakdown</div>
        <h2>Countries in ${esc(name)}</h2></div></div>
      ${table(kids, COUNTRY_COLS, { id: 'grp', max: 60, sortKey: 'flights', sortDir: -1 })}
    </section>`,
  });
}

function viewOperator(code) {
  const o = S.operators.find(x => x.key === code);
  if (!o) return notFound(`No flights recorded for operator ${esc(code)}.`);
  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em> Operators <em>/</em> ${esc(code)}`,
    title: o.name ? esc(o.name) : `Operator ${esc(code)}`,
    lede: o.name
      ? `ICAO code ${esc(code)}.${o.cargo_operator ? ' An all-cargo operator — the closest thing in this record to a trade signal.' : ''}`
      : `We see the ICAO prefix ${esc(code)} on these flights but it is not in our airline
         table yet, so we cannot name the operator. The flights themselves are real.`,
    stats: readout([
      { v: n(o.flights), l: 'Flights', s: `${o.share}% of all traffic` },
      { v: n(o.aircraft), l: 'Distinct aircraft' },
      { v: n(o.widebody), l: 'Wide-body' },
      { v: o.change_pct == null ? '—' : pct(o.change_pct), l: 'Change vs prev. 24h' },
    ]),
    body: `<section>
      <div class="sec-head"><div><div class="eyebrow">Evidence</div><h2>Flights recorded</h2></div>
        <a class="btn" href="#/ask?sql=${encodeURIComponent(
          `SELECT callsign, ac_type, reg, reg_country_name, seen_at\nFROM flights\nWHERE airline_prefix = '${code}'\nORDER BY first_seen DESC;`)}">Open in Ask →</a></div>
      <div id="lazy" data-kind="operator" data-arg="${esc(code)}">
        <div class="status">Loading the flight table…</div></div>
    </section>`,
  });
}

function viewType(code) {
  const t = S.types.find(x => x.key === code);
  if (!t) return notFound(`No flights recorded for aircraft type ${esc(code)}.`);
  return entityShell({
    crumbs: `<a href="#/explore">Explore</a> <em>/</em> Types <em>/</em> ${esc(code)}`,
    title: esc(t.desc || code),
    lede: `ICAO type code ${esc(code)} · ${t.widebody_type ? 'wide-body' : 'narrow-body'} airframe.
           ${t.widebody_type ? 'Wide-bodies over Aarhus are almost always intercontinental routings at cruise.' : ''}`,
    stats: readout([
      { v: n(t.flights), l: 'Flights', s: `${t.share}% of all traffic` },
      { v: n(t.aircraft), l: 'Distinct airframes' },
      { v: t.change_pct == null ? '—' : pct(t.change_pct), l: 'Change vs prev. 24h' },
    ]),
    body: `<section>
      <div class="sec-head"><div><div class="eyebrow">Evidence</div><h2>Flights recorded</h2></div>
        <a class="btn" href="#/ask?sql=${encodeURIComponent(
          `SELECT callsign, reg, reg_country_name, airline, seen_at\nFROM flights\nWHERE ac_type = '${code}'\nORDER BY first_seen DESC;`)}">Open in Ask →</a></div>
      <div id="lazy" data-kind="type" data-arg="${esc(code)}">
        <div class="status">Loading the flight table…</div></div>
    </section>`,
  });
}

const notFound = msg => `<header class="page-head">
  <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Not found</div>
  <h1>Nothing here yet</h1><p class="lede">${msg}</p></header>
  <a class="btn" href="#/explore">Browse what we do have →</a>`;

/** Entity pages paint instantly from the summary, then fill their evidence
 *  table from DuckDB once it is up. */
async function fillLazy() {
  const host = el('lazy');
  if (!host) return;
  const { kind, arg } = host.dataset;
  const where = { place: `reg_country = ${q(arg)}`,
                  operator: `airline_prefix = ${q(arg)}`,
                  type: `ac_type = ${q(arg)}` }[kind];
  try {
    const { rows } = await query(`
      SELECT callsign, ac_type, ac_desc, reg, reg_country_name, airline,
             airline_prefix, seen_at, ROUND(duration_sec/60.0) AS mins
      FROM flights WHERE ${where} ORDER BY first_seen DESC LIMIT 300`);
    host.innerHTML = table(rows, FLIGHT_COLS,
      { id: 'lz', max: 100, ...(sortState['lz'] || {}) });
  } catch (e) {
    host.innerHTML = `<div class="notice warn">Could not load the flight table: ${esc(e.message)}</div>`;
  }
}

const FLIGHT_COLS = [
  { k: 'callsign', h: 'Callsign', render: r => r.callsign
      ? `<a class="code" href="https://www.flightradar24.com/data/flights/${esc(r.callsign)}"
           target="_blank" rel="noopener">${esc(r.callsign)}</a>`
      : `<span class="unknown">No callsign transmitted</span>` },
  { k: 'ac_desc', h: 'Aircraft', render: r => r.ac_desc
      ? `${esc(r.ac_desc)} <a href="#/type/${esc(r.ac_type)}" class="code">${esc(r.ac_type)}</a>`
      : `<span class="unknown">Unidentified airframe</span>` },
  { k: 'reg', h: 'Registration', render: r => r.reg ? `<span class="mono">${esc(r.reg)}</span>` : '—' },
  { k: 'reg_country_name', h: 'Registered in', render: r => r.reg_country_name
      ? esc(r.reg_country_name) : `<span class="unknown">Unallocated block</span>` },
  { k: 'airline', h: 'Operator', render: r => r.airline ? esc(r.airline)
      : (r.airline_prefix ? `<span class="code">${esc(r.airline_prefix)}</span>`
                          : `<span class="unknown">Unknown</span>`) },
  { k: 'seen_at', h: 'Seen (UTC)', render: r => `<span class="mono">${esc(ts(r.seen_at))}</span>` },
  { k: 'mins', h: 'In range', num: true, render: r => r.mins ? `${n(r.mins)} min` : '—' },
];

/* ── Ask ─────────────────────────────────────────────────────────────── */
/* ── Ask ─────────────────────────────────────────────────────────────────
   The audience is business analysts, not engineers. The question is assembled
   from plain-language dropdowns that read as a sentence; SQL exists, runs the
   whole thing, and stays folded away until somebody asks to see it. */
const MEASURES = {
  flights:  { sql: 'COUNT(*)',                                          label: 'How many flights' },
  aircraft: { sql: 'COUNT(DISTINCT hex)',                               label: 'How many different aircraft' },
  widebody: { sql: "SUM(CASE WHEN body='widebody' THEN 1 ELSE 0 END)",  label: 'How many wide-body flights' },
  cargo:    { sql: 'SUM(CASE WHEN is_cargo THEN 1 ELSE 0 END)',         label: 'How many all-cargo flights' },
  operators:{ sql: 'COUNT(DISTINCT airline_prefix)',                    label: 'How many airlines' },
};
const DIMS = {
  country:   { sql: 'reg_country_name',                label: 'country',            head: 'Country' },
  region:    { sql: 'reg_region',                      label: 'economic region',    head: 'Region' },
  continent: { sql: 'reg_continent',                   label: 'continent',          head: 'Continent' },
  operator:  { sql: 'airline',                         label: 'airline',            head: 'Airline' },
  type:      { sql: 'ac_desc',                         label: 'aircraft type',      head: 'Aircraft' },
  day:       { sql: "strftime(seen_at, '%Y-%m-%d')",   label: 'day',                head: 'Day' },
  hour:      { sql: "strftime(seen_at, '%H') || ':00'",label: 'hour of the day',    head: 'Hour' },
};
const FILTERS = {
  '':           { sql: '',                            label: 'all aircraft' },
  widebody:     { sql: "body='widebody'",             label: 'only wide-bodies' },
  cargo:        { sql: 'is_cargo',                    label: 'only all-cargo operators' },
  nonEU:        { sql: "reg_continent<>'Europe'",     label: 'only non-European aircraft' },
  anon:         { sql: 'callsign IS NULL',            label: 'only aircraft with no callsign' },
};
const WINDOWS = {
  '':    { hours: null, label: 'the whole record' },
  '24':  { hours: 24,   label: 'the last 24 hours' },
  '72':  { hours: 72,   label: 'the last 3 days' },
  '168': { hours: 168,  label: 'the last 7 days' },
};
/* Examples are builder states, not raw SQL, so clicking one shows the reader
   exactly which controls produce that answer. */
const PRESETS = [
  ['Which countries send the most aircraft?',      { m:'flights',  d:'country',   f:'',        w:'' }],
  ['Who is flying in from outside Europe?',        { m:'flights',  d:'country',   f:'nonEU',   w:'' }],
  ['What does a normal day look like?',            { m:'flights',  d:'hour',      f:'',        w:'' }],
  ['Which wide-bodies pass overhead most?',        { m:'flights',  d:'type',      f:'widebody',w:'' }],
  ['Which airlines are busiest right now?',        { m:'flights',  d:'operator',  f:'',        w:'168' }],
  ['Is any freight moving through?',               { m:'flights',  d:'operator',  f:'cargo',   w:'' }],
  ['How much long-haul, by region?',               { m:'widebody', d:'region',    f:'',        w:'' }],
];

    `<option value="${k}"${k === cur ? ' selected' : ''}>${esc(v.label)}</option>`).join('')}</select>`;
  return `
  <header class="page-head">
    <div class="crumbs"><a href="#/">Signals</a> <em>/</em> Ask</div>
    <h1>Ask the data</h1>
    <p class="lede">The whole record is loaded in your browser. Nothing here is sampled or
      rounded, and every answer is computed in front of you.</p>
  </header>

  <section>
    <div class="chips">${PRESETS.map((p, i) =>
      `<button class="chip" data-ex="${i}">${esc(p[0])}</button>`).join('')}</div>

    <div class="qb">
      <div class="qb-line">
        <span class="qb-t">Show me</span>${sel('c-measure', MEASURES, 'flights')}
        <span class="qb-t">by</span>${sel('c-dim', DIMS, 'country')}
        <span class="qb-t">counting</span>${sel('c-filter', FILTERS, '')}
        <span class="qb-t">across</span>${sel('c-win', WINDOWS, '')}
      </div>
    </div>
    <div class="status" id="qstatus">Loading the record…</div>
    <div id="qout"></div>

    <details class="adv" id="adv">
      <summary>Show the query behind this answer</summary>
      <p class="adv-note">This is the SQL that produced the table above. Edit it and run if
        you want something the controls can't express.</p>
      <textarea class="sql-box" id="sql" spellcheck="false"></textarea>
      <div class="adv-bar">
        <button class="btn primary" id="run">Run this query</button>
        <button class="btn" id="copy-sql">Copy</button>
        <a class="btn" href="#/data">Column reference →</a>

function wireAsk() {
  const ta = el('sql'), out = el('qout'), st = el('qstatus');
  if (!ta) return;
  const ctl = { m: el('c-measure'), d: el('c-dim'), f: el('c-filter'), w: el('c-win') };

  function compose() {
    const m = MEASURES[ctl.m.value], d = DIMS[ctl.d.value];
    const f = FILTERS[ctl.f.value], w = WINDOWS[ctl.w.value];
    const conds = [`${d.sql} IS NOT NULL`];
    if (f.sql) conds.push(f.sql);
    if (w.hours) conds.push(
      `first_seen >= (SELECT MAX(first_seen) FROM flights) - ${w.hours * 3600}`);
    const ordering = ctl.d.value === 'day' || ctl.d.value === 'hour'
      ? 'ORDER BY 1' : 'ORDER BY 2 DESC';
    return `SELECT ${d.sql} AS "${d.head}",\n       ${m.sql} AS "${m.label.replace(/^How many /, '')}"\n`
         + `FROM flights\nWHERE ${conds.join('\n  AND ')}\nGROUP BY 1\n${ordering};`;
  }

  async function run(sql) {
    sql = (sql || ta.value).trim();
    if (!sql) return;
    ta.value = sql;
    st.textContent = 'Working…';
    try {
      // Warm the engine before starting the clock. The first call pays for
      // downloading and instantiating DuckDB, which is not what the reader is
      // being told the query cost.
      await getDeep();
      const t0 = performance.now();
      const { rows, cols } = await query(sql);
      const ms = Math.round(performance.now() - t0);
      st.innerHTML = rows.length
        ? `<b>${n(rows.length)}</b> ${rows.length === 1 ? 'row' : 'rows'} · answered in ${ms} ms, in your browser`
        : '';
      out.innerHTML = rows.length ? renderResult(rows, cols)
        : `<div class="empty">Nothing in the record matches that.</div>`;
    } catch (e) {
      st.textContent = '';
      out.innerHTML = `<div class="notice warn"><b>That didn't run.</b> ${esc(e.message)}</div>`;
      el('adv').open = true;   // the SQL is where the problem is, so show it
    }
  }
  const runComposed = () => run(compose());

  Object.values(ctl).forEach(s => s.addEventListener('change', runComposed));

  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => {
    const p = PRESETS[+b.dataset.ex][1];
    ctl.m.value = p.m; ctl.d.value = p.d; ctl.f.value = p.f; ctl.w.value = p.w;
    runComposed();
  });

  el('run').onclick = () => run();
  el('copy-sql').onclick = async () => {
    try { await navigator.clipboard.writeText(ta.value); el('copy-sql').textContent = 'Copied'; }
    catch { el('copy-sql').textContent = 'Select and copy'; }
    setTimeout(() => { el('copy-sql').textContent = 'Copy'; }, 1600);
  };
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
  });

  // A "reproduce this" link from a signal arrives with its own SQL.
  const linked = new URLSearchParams(location.hash.split('?')[1] || '').get('sql');
  if (linked) { el('adv').open = true; run(linked); }
  else runComposed();
}

/** Result rendering picks a chart when the shape is label + one number. */
function renderResult(rows, cols) {
  let chartHtml = '';
  if (cols.length >= 2 && rows.length > 1 && rows.length <= 60) {
    const numCol = cols.slice(1).find(c => typeof rows[0][c] === 'number' || typeof rows[0][c] === 'bigint');
    if (numCol) {
      const data = rows.map(r => ({ k: String(r[cols[0]]), v: Number(r[numCol]) }));
      chartHtml = `<div style="margin-bottom:22px">${
        chart(data, { key: 'k', val: 'v', labelEvery: Math.ceil(data.length / 14) })}</div>`;
    }
  }
  const cells = rows.slice(0, 400).map(r => `<tr>${cols.map(c => {
    const v = r[c];
    if (v == null) return `<td class="faint">—</td>`;
    // Only reformat genuine temporal values. A strftime() result is already
    // a formatted string and must be left exactly as the query produced it.
    if (v instanceof Date || (looksLikeTime(c) && typeof v !== 'string'))
      return `<td class="mono">${esc(ts(v))}</td>`;
    const num = typeof v === 'number' || typeof v === 'bigint';
    return `<td class="${num ? 'num' : ''}">${num ? n(v) : esc(String(v).slice(0, 60))}</td>`;
  }).join('')}</tr>`).join('');
  return chartHtml + `<div class="tbl-wrap"><table><thead><tr>${
    cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${cells}</tbody></table></div>` +
    (rows.length > 400 ? `<div class="status">Showing 400 of ${n(rows.length)} rows.</div>` : '');
}
