name: Update insights

on:
  schedule:
    # 06:00 UTC daily
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_insights.py

      - name: Commit changes
        run: |
          if git diff --quiet data/insights.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "flight-macro-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/insights.json
          git commit -m "chore(data): refresh insights $(date -u +%Y-%m-%d)"
          git push
